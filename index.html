      order: initialOrder(), orderChecked: false, orderLast: 0, orderBest: 0,
      form: freshForm(), reportChecked: false, res: null, reportBest: 0,
      bestInd: { order: false, facts: false, content: false }
    };
  }
  function valid(m) { return m && Array.isArray(m.order) && m.order.length === CORRECT.length && m.form && Array.isArray(m.form.sistem); }
  C.store.registerModule(MOD, fresh, valid);

  C.store.registerScore(MOD, function (m) {
    var orderPts = Math.round(m.orderBest / CORRECT.length * 40);
    var ind = [
      { label: 'Urutan keenam tahapan benar (terbaik ' + m.orderBest + '/6).', met: m.bestInd.order },
      { label: 'Jenis insiden, waktu, dan sistem terdampak benar.', met: m.bestInd.facts },
      { label: 'Dampak, kronologi, penahanan, dan rekomendasi tepat.', met: m.bestInd.content }
    ];
    return {
      earned: orderPts + m.reportBest, max: 100, label: 'Respons Insiden',
      done: ind.filter(function (x) { return x.met; }).length, total: ind.length,
      started: m.orderChecked || m.orderBest > 0 || m.reportBest > 0 || !!m.res,
      tuntas: ind.every(function (x) { return x.met; }), indicators: ind
    };
  });

  var ui = null;
  function mod() { return C.store.mod(MOD); }
  function step(id) { return R.steps.filter(function (s) { return s.id === id; })[0]; }

  /* ---------- Penilaian laporan ---------- */
  function hasAny(text, words) {
    var t = String(text || '').toLowerCase();
    return words.some(function (w) { return t.indexOf(w) >= 0; });
  }
  function multiScore(def, picked, max) {
    var ok = def.options.filter(function (o) { return o.ok; });
    var right = picked.filter(function (id) { return ok.some(function (o) { return o.id === id; }); }).length;
    var wrong = picked.length - right;
    var per = max / ok.length;
    return { pts: Math.max(0, Math.round((right - wrong) * per * 10) / 10), right: right, wrong: wrong, need: ok.length };
  }
  function gradeReport(f) {
    var res = {};
    res.jenis = { ok: f.jenis === F.jenis.answer, pts: f.jenis === F.jenis.answer ? 8 : 0, max: 8 };
    res.mulai = { ok: f.mulai === F.mulai.answer, pts: f.mulai === F.mulai.answer ? 5 : 0, max: 5 };
    res.deteksi = { ok: f.deteksi === F.deteksi.answer, pts: f.deteksi === F.deteksi.answer ? 5 : 0, max: 5 };
    var sysOk = f.sistem.length === 1 && f.sistem[0] === 'web';
    res.sistem = { ok: sysOk, pts: sysOk ? 8 : (f.sistem.indexOf('web') >= 0 ? 3 : 0), max: 8 };
    var dLen = f.dampak.trim().length;
    var dOk = dLen >= 30 && hasAny(f.dampak, R.dampakWords);
    res.dampak = { ok: dOk, pts: dOk ? 8 : dLen >= 15 ? 3 : 0, max: 8,
      note: dOk ? 'Dampak dijelaskan dengan jelas.' : dLen < 30 ? 'Tulis minimal 30 karakter tentang apa yang terganggu.' : 'Sebutkan apa yang terganggu, misalnya tampilan website.' };
    var k = f.kronologi.trim();
    var kTime = /\b\d{1,2}[.:]\d{2}\b/.test(k);
    var kOk = k.length >= 60 && kTime && hasAny(k, R.kronologiWords);
    res.kronologi = { ok: kOk, pts: kOk ? 8 : (k.length >= 30 ? 3 : 0), max: 8,
      note: kOk ? 'Kronologi memuat waktu dan kejadian utama.' : 'Kronologi minimal 60 karakter, memuat jam (contoh 02.13) dan kejadian login SSH.' };
    var p = multiScore(F.penahanan, f.penahanan, 9);
    res.penahanan = { ok: p.right === p.need && p.wrong === 0, pts: p.pts, max: 9, right: p.right, wrong: p.wrong, need: p.need };
    var r = multiScore(F.rekomendasi, f.rekomendasi, 9);
    res.rekomendasi = { ok: r.right >= 3 && r.wrong === 0, pts: r.pts, max: 9, right: r.right, wrong: r.wrong, need: r.need };
    var total = 0;
    Object.keys(res).forEach(function (k2) { total += res[k2].pts; });
    res.total = Math.round(total);
    res.facts = res.jenis.ok && res.mulai.ok && res.deteksi.ok && res.sistem.ok;
    res.content = res.dampak.ok && res.kronologi.ok && res.penahanan.ok && res.rekomendasi.ok;
    return res;
  }

  /* ---------- Template ---------- */
  function template() {
    var meta = C.moduleMeta(MOD);
    return '<section class="page page--ir" aria-labelledby="page-title-' + MOD + '">' +
      C.page.head(meta, 'Website sekolah sintetis diubah tampilannya oleh peretas. Pelajari buktinya, urutkan tindakan penanganan, lalu susun laporan insiden.', C.page.resetButton()) +
      '<div class="two-col">' +
        '<article class="card hud" aria-labelledby="ir-ev-h">' +
          '<header class="card-head"><div><h2 id="ir-ev-h">Bukti Insiden</h2><p class="card-sub">Kamis, 9 Oktober 2026. Semua data sintetis.</p></div></header>' +
          '<ol class="timeline">' + R.evidence.map(function (e) {
            return '<li><time class="num">' + esc(e.time) + '</time><p>' + esc(e.text) + '</p></li>';
          }).join('') + '</ol>' +
        '</article>' +
        '<article class="card" id="ir-progress" aria-label="Indikator keberhasilan"></article>' +
      '</div>' +
      '<article class="card" id="ir-order-card" aria-labelledby="ir-order-h"></article>' +
      '<article class="card" id="ir-form-card" aria-labelledby="ir-form-h"></article>' +
      C.page.cpCard(meta) +
    '</section>';
  }

  function renderOrder() {
    var m = mod();
    var n = m.order.length;
    var items = m.order.map(function (id, i) {
      var s = step(id);
      var right = m.orderChecked && CORRECT[i] === id;
      return '<li class="order-item' + (m.orderChecked ? (right ? ' is-right' : ' is-wrong') : '') + '" data-step="' + id + '">' +
        '<span class="order-item__no num">' + (i + 1) + '</span>' +
        '<div class="order-item__body"><p>' + esc(s.text) + '</p>' +
          (m.orderChecked ? '<p class="small ' + (right ? 'text-ok' : 'text-warn') + '">Tahap ' + esc(s.phase) + (right ? '' : ', seharusnya urutan ke-' + (CORRECT.indexOf(id) + 1)) + '</p>' : '') +
        '</div>' +
        '<div class="order-item__acts">' +
          '<button type="button" class="icon-btn" data-action="ord-up" data-id="' + id + '"' + (i === 0 || m.orderChecked ? ' disabled' : '') + ' aria-label="Naikkan: ' + esc(s.text) + '">' + C.icon('up') + '</button>' +
          '<button type="button" class="icon-btn" data-action="ord-down" data-id="' + id + '"' + (i === n - 1 || m.orderChecked ? ' disabled' : '') + ' aria-label="Turunkan: ' + esc(s.text) + '">' + C.icon('down') + '</button>' +
        '</div>' +
      '</li>';
    }).join('');
    C.$('#ir-order-card', ui.root).innerHTML =
      '<header class="card-head"><div><h2 id="ir-order-h">A. Urutkan Tindakan Penanganan</h2>' +
        '<p class="card-sub">Susun dari tindakan paling awal (atas) sampai paling akhir (bawah) dengan tombol naik dan turun.</p></div>' +
        (m.orderChecked ? '<span class="tag tag--muted num">Benar ' + m.orderLast + '/6</span>' : '') + '</header>' +
      '<ol class="order-list">' + items + '</ol>' +
      '<div class="actions-row">' + (m.orderChecked
        ? '<button type="button" class="btn btn--ghost" data-action="ord-edit">' + C.icon('edit') + '<span>Susun Ulang</span></button>' +
          '<p class="small ' + (m.orderLast === 6 ? 'text-ok' : 'text-warn') + '">' + (m.orderLast === 6 ? 'Urutan tepat: Persiapan, Identifikasi, Penahanan, Pemberantasan, Pemulihan, Pembelajaran.' : 'Perhatikan nama tahap pada setiap kartu, lalu susun ulang.') + '</p>'
        : '<button type="button" class="btn btn--accent" data-action="ord-check">' + C.icon('checklist') + '<span>Periksa Urutan</span></button>') +
      '</div>';
  }

  function selectField(key, f, disabled) {
    var d = F[key];
    return '<div class="field"><label for="ir-' + key + '">' + esc(d.label) + '</label>' +
      '<select id="ir-' + key + '" class="input" data-field="' + key + '"' + (disabled ? ' disabled' : '') + '><option value="">Pilih…</option>' +
      d.options.map(function (o) { return '<option value="' + o.id + '"' + (f[key] === o.id ? ' selected' : '') + '>' + esc(o.text) + '</option>'; }).join('') +
      '</select>' + fb(key) + '</div>';
  }
  function checksField(key, f, disabled) {
    var d = F[key];
    return '<fieldset class="field"><legend>' + esc(d.label) + '</legend><div class="checks">' +
      d.options.map(function (o) {
        return '<label class="check check--sm"><input type="checkbox" data-multi="' + key + '" value="' + o.id + '"' + (f[key].indexOf(o.id) >= 0 ? ' checked' : '') + (disabled ? ' disabled' : '') + '><span>' + esc(o.text) + '</span></label>';
      }).join('') + '</div>' + fb(key) + '</fieldset>';
  }
  function fb(key) {
    var m = mod();
    if (!m.reportChecked || !m.res) return '';
    var r = m.res[key];
    var text;
    if (key === 'dampak' || key === 'kronologi') text = r.note;
    else if (key === 'penahanan' || key === 'rekomendasi') text = r.right + ' dari ' + r.need + ' pilihan tepat' + (r.wrong ? ', ' + r.wrong + ' pilihan keliru' : '') + '. ' + F[key].explain;
    else text = (r.ok ? '' : 'Belum tepat. ') + F[key].explain;
    return '<p class="field-fb ' + (r.ok ? 'is-ok' : 'is-bad') + '">' + C.icon(r.ok ? 'check' : 'x') + '<span>' + esc(text) + ' <b class="num">(' + String(r.pts).replace('.', ',') + '/' + r.max + ')</b></span></p>';
  }

  function renderForm() {
    var m = mod();
    var f = m.form;
    var dis = m.reportChecked;
    if (!f.pelapor && C.store.state.student.nama) f.pelapor = C.store.state.student.nama;
    C.$('#ir-form-card', ui.root).innerHTML =
      '<header class="card-head"><div><h2 id="ir-form-h">B. Laporan Insiden</h2>' +
        '<p class="card-sub">Isi berdasarkan bukti di atas. Umpan balik muncul setelah laporan diperiksa.</p></div>' +
        (m.reportChecked ? '<span class="score-pill num">' + m.res.total + '<small>/60</small></span>' : '') + '</header>' +
      '<form id="ir-form" class="ir-form" novalidate>' +
        '<div class="ir-form__grid">' +
          '<div class="field"><label for="ir-pelapor">Nama pelapor</label><input id="ir-pelapor" class="input" data-text="pelapor" maxlength="80" value="' + esc(f.pelapor) + '"' + (dis ? ' disabled' : '') + '></div>' +
          selectField('jenis', f, dis) + selectField('mulai', f, dis) + selectField('deteksi', f, dis) +
        '</div>' +
        checksField('sistem', f, dis) +
        '<div class="field"><label for="ir-dampak">Dampak insiden</label><textarea id="ir-dampak" class="input" rows="3" data-text="dampak" maxlength="600" placeholder="Apa yang terganggu? Siapa yang terdampak?"' + (dis ? ' disabled' : '') + '>' + esc(f.dampak) + '</textarea>' +
          '<p class="field-help"><span class="num" data-count="dampak">' + f.dampak.trim().length + '</span> karakter, minimal 30.</p>' + fb('dampak') + '</div>' +
        '<div class="field"><label for="ir-kronologi">Kronologi singkat</label><textarea id="ir-kronologi" class="input" rows="4" data-text="kronologi" maxlength="1000" placeholder="Contoh: 02.10 terjadi ratusan percobaan login SSH ..."' + (dis ? ' disabled' : '') + '>' + esc(f.kronologi) + '</textarea>' +
          '<p class="field-help"><span class="num" data-count="kronologi">' + f.kronologi.trim().length + '</span> karakter, minimal 60, sertakan jam kejadian.</p>' + fb('kronologi') + '</div>' +
        checksField('penahanan', f, dis) + checksField('rekomendasi', f, dis) +
        '<p class="field-err" id="ir-err" hidden></p>' +
        '<div class="actions-row">' + (dis
          ? '<button type="button" class="btn btn--ghost" data-action="ir-edit">' + C.icon('edit') + '<span>Perbaiki Laporan</span></button>' +
            '<button type="button" class="btn btn--primary" data-action="ir-copy">' + C.icon('copy') + '<span>Salin Laporan</span></button>'
          : '<button type="submit" class="btn btn--accent">' + C.icon('checklist') + '<span>Periksa Laporan</span></button>') +
        '</div>' +
      '</form>';
  }

  function renderProgress() { C.$('#ir-progress', ui.root).innerHTML = C.page.progressCard(MOD); }

  /* ---------- Aksi ---------- */
  function move(id, dir) {
    var m = mod();
    var i = m.order.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= m.order.length) return;
    m.order[i] = m.order[j]; m.order[j] = id;
    C.store.commit('ir-order');
    renderOrder();
    var b = C.$('[data-action="' + (dir < 0 ? 'ord-up' : 'ord-down') + '"][data-id="' + id + '"]', ui.root);
    if (b && !b.disabled) b.focus();
    else { var o = C.$('[data-action="' + (dir < 0 ? 'ord-down' : 'ord-up') + '"][data-id="' + id + '"]', ui.root); if (o) o.focus(); }
  }

  function checkOrder() {
    var m = mod();
    var c = m.order.filter(function (id, i) { return CORRECT[i] === id; }).length;
    m.orderChecked = true; m.orderLast = c; m.orderBest = Math.max(m.orderBest, c);
    if (c === 6) m.bestInd.order = true;
    C.log.add(MOD, c === 6 ? 'success' : 'warn', 'Urutan tahapan respons insiden: ' + c + ' dari 6 tepat.');
    C.store.commit('ir-order');
    renderOrder(); renderProgress();
  }

  function checkReport() {
    var m = mod();
    var f = m.form;
    var missing = [];
    if (!f.jenis) missing.push('jenis insiden');
    if (!f.mulai) missing.push('waktu serangan');
    if (!f.deteksi) missing.push('waktu terdeteksi');
    if (!f.sistem.length) missing.push('sistem terdampak');
    if (!f.dampak.trim()) missing.push('dampak');
    if (!f.kronologi.trim()) missing.push('kronologi');
    if (!f.penahanan.length) missing.push('tindakan penahanan');
    if (!f.rekomendasi.length) missing.push('rekomendasi');
    if (missing.length) {
      var err = C.$('#ir-err', ui.root);
      err.textContent = 'Lengkapi dulu: ' + missing.join(', ') + '.';
      err.hidden = false;
      return;
    }
    m.res = gradeReport(f);
    m.reportChecked = true;
    m.reportBest = Math.max(m.reportBest, m.res.total);
    m.bestInd.facts = m.bestInd.facts || m.res.facts;
    m.bestInd.content = m.bestInd.content || m.res.content;
    C.log.add(MOD, m.res.facts && m.res.content ? 'success' : 'warn', 'Laporan insiden diperiksa: ' + m.res.total + '/60 poin.');
    C.store.commit('ir-report');
    renderForm(); renderProgress();
    C.$('#ir-form-card', ui.root).scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  }

  function reportText() {
    var m = mod();
    var f = m.form;
    function opt(key, id) { var o = F[key].options.filter(function (x) { return x.id === id; })[0]; return o ? o.text : '-'; }
    function list(key) { return f[key].map(function (id) { return '- ' + opt(key, id); }).join('\n') || '-'; }
    return [
      'LAPORAN INSIDEN KEAMANAN (SIMULASI)',
      'Pelapor        : ' + (f.pelapor || '-'),
      'Tanggal        : 9 Oktober 2026',
      'Jenis insiden  : ' + opt('jenis', f.jenis),
      'Mulai serangan : ' + opt('mulai', f.mulai),
      'Terdeteksi     : ' + opt('deteksi', f.deteksi),
      'Sistem terdampak:', list('sistem'),
      '', 'Dampak:', f.dampak.trim(),
      '', 'Kronologi:', f.kronologi.trim(),
      '', 'Tindakan penahanan:', list('penahanan'),
      '', 'Rekomendasi perbaikan:', list('rekomendasi')
    ].join('\n');
  }

  /* ---------- Event ---------- */
  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || !ui || !ui.root.contains(btn) || btn.disabled) return;
    var m = mod();
    switch (btn.getAttribute('data-action')) {
      case 'ord-up': move(btn.getAttribute('data-id'), -1); break;
      case 'ord-down': move(btn.getAttribute('data-id'), 1); break;
      case 'ord-check': checkOrder(); break;
      case 'ord-edit': m.orderChecked = false; C.store.commit('ir-order'); renderOrder(); break;
      case 'ir-edit': m.reportChecked = false; C.store.commit('ir-report'); renderForm(); break;
      case 'ir-copy': {
        var txt = reportText();
        C.ui.copyText(txt).then(function (ok) { if (ok) C.ui.toast('Laporan disalin. Tempel di dokumen atau pesan untuk guru.', { type: 'success' }); });
        break;
      }
      case 'module-reset': C.page.confirmReset(MOD, 'Respons Insiden', function () { if (ui) renderAll(); }); break;
      default: break;
    }
  }

  function onChange(e) {
    var t = e.target;
    var m = mod();
    if (m.reportChecked) return;
    if (t.hasAttribute('data-field')) m.form[t.getAttribute('data-field')] = t.value;
    else if (t.hasAttribute('data-multi')) {
      var key = t.getAttribute('data-multi');
      var arr = m.form[key];
      var i = arr.indexOf(t.value);
      if (t.checked && i < 0) arr.push(t.value);
      if (!t.checked && i >= 0) arr.splice(i, 1);
    } else return;
    var err = C.$('#ir-err', ui.root); if (err) err.hidden = true;
    C.store.commit('ir-form');
  }
  function onInput(e) {
    var t = e.target;
    var m = mod();
    if (!t.hasAttribute('data-text') || m.reportChecked) return;
    var k = t.getAttribute('data-text');
    m.form[k] = t.value;
    var c = C.$('[data-count="' + k + '"]', ui.root);
    if (c) c.textContent = t.value.trim().length;
    C.store.commit('ir-form');
  }
  function onSubmit(e) { if (e.target.id === 'ir-form') { e.preventDefault(); checkReport(); } }

  function renderAll() { renderOrder(); renderForm(); renderProgress(); }

  function mount(root) {
    ui = { root: root };
    root.innerHTML = template();
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    root.addEventListener('input', onInput);
    root.addEventListener('submit', onSubmit);
    renderAll();
  }
  function unmount() { ui = null; }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/evaluasi.js">
/* ==========================================================================
   Menu 9 — Evaluasi
   20 soal (PG, benar-salah, studi kasus). Skor otomatis dan pembahasan.
   Nilai resmi = percobaan pertama; percobaan berikutnya sebagai latihan.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var EV = C.EvaluasiData;
  var esc = C.esc;
  var MOD = 'evaluasi';
  var ALL = [];
  EV.sections.forEach(function (s) { s.questions.forEach(function (q) { ALL.push(q); }); });
  var TOTAL = ALL.length;

  function fresh() { return { answers: {}, submitted: false, attempts: [], kktp: EV.defaultKktp }; }
  function valid(m) { return m && typeof m.answers === 'object' && Array.isArray(m.attempts) && typeof m.kktp === 'number'; }
  C.store.registerModule(MOD, fresh, valid);

  function first(m) { return m.attempts[0] || null; }
  function best(m) { return m.attempts.reduce(function (b, a) { return Math.max(b, a.score); }, 0); }

  C.store.registerScore(MOD, function (m) {
    var f = first(m);
    var ind = [
      { label: 'Menyelesaikan evaluasi ' + TOTAL + ' soal.', met: !!f },
      { label: 'Nilai percobaan pertama mencapai KKTP ' + m.kktp + (f ? ' (nilai ' + f.score + ').' : '.'), met: !!f && f.score >= m.kktp }
    ];
    return {
      earned: f ? f.score : 0, max: 100, label: 'Evaluasi',
      done: ind.filter(function (x) { return x.met; }).length, total: ind.length,
      started: !!f || Object.keys(m.answers).length > 0,
      tuntas: ind.every(function (x) { return x.met; }), indicators: ind,
      extra: { first: f ? f.score : null, best: m.attempts.length ? best(m) : null, attempts: m.attempts.length, kktp: m.kktp }
    };
  });

  var ui = null;
  function mod() { return C.store.mod(MOD); }
  function answered(m) { return ALL.filter(function (q) { return m.answers[q.id]; }).length; }

  function template() {
    var meta = C.moduleMeta(MOD);
    return '<section class="page page--eval" aria-labelledby="page-title-' + MOD + '">' +
      C.page.head(meta, 'Kerjakan 20 soal tentang materi seluruh lab. Skor dihitung otomatis dan pembahasan muncul setelah jawaban dikumpulkan.', C.page.resetButton()) +
      '<div class="two-col">' +
        '<article class="card hud" id="ev-info" aria-label="Informasi evaluasi"></article>' +
        '<article class="card" id="ev-progress" aria-label="Indikator keberhasilan"></article>' +
      '</div>' +
      '<div id="ev-result"></div>' +
      '<div class="ev-sticky" id="ev-sticky"></div>' +
      '<form id="ev-form" class="ev-form" novalidate></form>' +
      C.page.cpCard(meta) +
    '</section>';
  }

  function renderInfo() {
    var m = mod();
    var f = first(m);
    C.$('#ev-info', ui.root).innerHTML =
      '<header class="card-head"><div><h2>Ketentuan</h2></div></header>' +
      '<ul class="plain-list">' +
        '<li>20 soal: 10 pilihan ganda, 6 benar-salah, dan 4 soal studi kasus. Setiap soal bernilai 5.</li>' +
        '<li><strong>Nilai resmi adalah percobaan pertama.</strong> Percobaan berikutnya dicatat sebagai latihan.</li>' +
        '<li>KKTP saat ini: <strong class="num">' + m.kktp + '</strong>.</li>' +
      '</ul>' +
      (f ? '<p class="small">Nilai resmi: <strong class="num">' + f.score + '</strong>. Percobaan: ' + m.attempts.length + ', nilai terbaik ' + best(m) + '.</p>' : '') +
      '<details class="teacher">' +
        '<summary>Pengaturan guru</summary>' +
        '<form id="ev-kktp-form" class="kktp-form" novalidate>' +
          '<div class="field field--inline"><label for="ev-kktp">KKTP</label><input id="ev-kktp" class="input input--sm num" type="number" min="0" max="100" step="1" value="' + m.kktp + '"></div>' +
          '<button type="submit" class="btn btn--sm btn--ghost">Simpan KKTP</button>' +
        '</form>' +
        '<p class="field-err" id="ev-kktp-err" hidden></p>' +
        '<p class="small muted">KKTP tersimpan di browser perangkat ini. Atur sebelum siswa mulai mengerjakan.</p>' +
      '</details>';
  }

  function renderSticky() {
    var m = mod();
    var n = answered(m);
    C.$('#ev-sticky', ui.root).innerHTML = m.submitted ? '' :
      '<div class="ev-sticky__in"><span class="small">Terjawab <strong class="num">' + n + '/' + TOTAL + '</strong></span>' +
      '<span class="bar" aria-hidden="true"><span style="width:' + Math.round(n / TOTAL * 100) + '%"></span></span>' +
      (m.attempts.length ? '<span class="tag tag--muted">Latihan ke-' + (m.attempts.length) + '</span>' : '<span class="tag tag--draft">Percobaan resmi</span>') + '</div>';
  }

  function renderForm() {
    var m = mod();
    var no = 0;
    C.$('#ev-form', ui.root).innerHTML = EV.sections.map(function (sec) {
      return '<article class="card ev-section" aria-labelledby="ev-sec-' + sec.id + '">' +
        '<header class="card-head"><div><h2 id="ev-sec-' + sec.id + '">' + esc(sec.title) + '</h2></div></header>' +
        '<div class="q-stack">' + sec.questions.map(function (q) {
          no++;
          return C.page.choice(q, { picked: m.answers[q.id], reveal: m.submitted, no: no, name: 'ev-' + q.id });
        }).join('') + '</div></article>';
    }).join('') +
    '<p class="field-err" id="ev-err" hidden></p>' +
    '<div class="actions-row ev-submit">' + (m.submitted
      ? '<button type="button" class="btn btn--ghost" data-action="ev-retry">' + C.icon('reset') + '<span>Ulangi sebagai Latihan</span></button>'
      : '<button type="submit" class="btn btn--accent">' + C.icon('send') + '<span>Kumpulkan Jawaban</span></button>') + '</div>';
  }

  function renderResult() {
    var m = mod();
    var el = C.$('#ev-result', ui.root);
    if (!m.submitted || !m.attempts.length) { el.innerHTML = ''; return; }
    var last = m.attempts[m.attempts.length - 1];
    var f = first(m);
    var pass = f.score >= m.kktp;
    el.innerHTML = '<article class="card hud ev-result" aria-labelledby="ev-res-h">' +
      '<header class="card-head"><div><h2 id="ev-res-h">' + (m.attempts.length === 1 ? 'Hasil Evaluasi' : 'Hasil Latihan ke-' + (m.attempts.length - 1)) + '</h2>' +
        '<p class="card-sub">' + last.correct + ' dari ' + TOTAL + ' soal benar. Pembahasan ada di bawah setiap soal.</p></div>' +
        '<span class="score-pill num">' + last.score + '<small>/100</small></span></header>' +
      '<div class="ev-sum">' +
        '<div class="stat"><span class="stat__k">Nilai resmi (percobaan pertama)</span><span class="stat__v num">' + f.score + '</span></div>' +
        '<div class="stat"><span class="stat__k">KKTP</span><span class="stat__v num">' + m.kktp + '</span></div>' +
        '<div class="stat"><span class="stat__k">Status</span><span class="stat__v"><span class="level level--' + (pass ? 'low' : 'mid') + '">' + (pass ? 'TUNTAS' : 'BELUM TUNTAS') + '</span></span></div>' +
        '<div class="stat"><span class="stat__k">Nilai terbaik</span><span class="stat__v num">' + best(m) + '</span></div>' +
      '</div>' +
      '<p class="small muted">' + sectionSummary(m) + '</p>' +
    '</article>';
  }

  function sectionSummary(m) {
    return EV.sections.map(function (s) {
      var c = s.questions.filter(function (q) { return m.answers[q.id] === q.answer; }).length;
      return s.title.replace(/^Bagian [A-C]\. /, '') + ': ' + c + '/' + s.questions.length;
    }).join(', ') + '.';
  }

  function renderProgress() { C.$('#ev-progress', ui.root).innerHTML = C.page.progressCard(MOD); }

  function submit(force) {
    var m = mod();
    var miss = TOTAL - answered(m);
    if (miss && !force) {
      C.ui.confirm({
        title: 'Kumpulkan dengan ' + miss + ' soal kosong?',
        body: 'Soal yang tidak dijawab dihitung salah.' + (m.attempts.length ? '' : ' Ini percobaan resmi, nilainya akan menjadi nilai resmi.'),
        confirmLabel: 'Tetap Kumpulkan', cancelLabel: 'Kembali Mengerjakan', tone: 'warn'
      }).then(function (ok) {
        if (ok && ui) submit(true);
        else if (ui) { var q = ALL.filter(function (x) { return !mod().answers[x.id]; })[0]; var el = q && C.$('[data-qid="' + q.id + '"]', ui.root); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      });
      return;
    }
    var correct = ALL.filter(function (q) { return m.answers[q.id] === q.answer; }).length;
    var score = correct * EV.pointsEach;
    m.attempts.push({ score: score, correct: correct, at: Date.now() });
    m.submitted = true;
    var official = m.attempts.length === 1;
    C.log.add(MOD, score >= m.kktp ? 'success' : 'warn', (official ? 'Evaluasi (nilai resmi)' : 'Latihan evaluasi ke-' + (m.attempts.length - 1)) + ': ' + score + '/100, ' + correct + ' dari ' + TOTAL + ' benar.');
    C.store.commit('ev-submit');
    renderAll();
    C.$('#ev-result', ui.root).scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  }

  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || !ui || !ui.root.contains(btn) || btn.disabled) return;
    var m = mod();
    switch (btn.getAttribute('data-action')) {
      case 'ev-retry':
        m.answers = {}; m.submitted = false;
        C.store.commit('ev-retry'); renderAll();
        C.$('#ev-sticky', ui.root).scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
        break;
      case 'module-reset':
        C.page.confirmReset(MOD, 'Evaluasi', function () { if (ui) renderAll(); });
        break;
      default: break;
    }
  }
  function onChange(e) {
    var t = e.target;
    var m = mod();
    if (!t.name || t.name.indexOf('ev-') !== 0 || m.submitted) return;
    m.answers[t.getAttribute('data-q')] = t.value;
    C.$$('[data-qid="' + t.getAttribute('data-q') + '"] .opt', ui.root).forEach(function (l) { l.classList.toggle('is-picked', l.querySelector('input').checked); });
    C.store.commit('ev-answer');
    renderSticky();
  }
  function onSubmit(e) {
    e.preventDefault();
    if (e.target.id === 'ev-form') submit(false);
    else if (e.target.id === 'ev-kktp-form') {
      var v = Number(C.$('#ev-kktp', ui.root).value);
      var err = C.$('#ev-kktp-err', ui.root);
      if (!Number.isInteger(v) || v < 0 || v > 100) { err.textContent = 'KKTP diisi bilangan bulat 0 sampai 100.'; err.hidden = false; return; }
      err.hidden = true;
      mod().kktp = v;
      C.log.add(MOD, 'info', 'KKTP evaluasi diatur menjadi ' + v + '.');
      C.store.commit('ev-kktp');
      renderInfo(); renderResult(); renderProgress();
      C.ui.toast('KKTP disimpan: ' + v + '.', { type: 'success' });
    }
  }

  function renderAll() { renderInfo(); renderProgress(); renderResult(); renderSticky(); renderForm(); }

  function mount(root) {
    ui = { root: root };
    root.innerHTML = template();
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    root.addEventListener('submit', onSubmit);
    renderAll();
  }
  function unmount() { ui = null; }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/laporan.js">
/* ==========================================================================
   Menu 10 — Laporan Hasil Belajar
   Rekap identitas, skor per modul, indikator keberhasilan, nilai evaluasi,
   dan catatan aktivitas. Dapat dicetak atau disimpan sebagai PDF lewat
   dialog cetak browser (Ctrl+P).
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var esc = C.esc;
  var MOD = 'laporan';

  function scoredModules() { return C.MODULES.filter(function (m) { return m.scored; }); }

  function statusOf(r) {
    if (r.tuntas) return { text: 'Tuntas', cls: 'ok' };
    if (r.started || r.earned > 0) return { text: 'Berjalan', cls: 'mid' };
    return { text: 'Belum dimulai', cls: 'none' };
  }

  function data() {
    var sc = C.store.score();
    var mods = scoredModules().map(function (meta) { return { meta: meta, r: sc.parts[meta.id] }; });
    var tuntas = mods.filter(function (x) { return x.r.tuntas; }).length;
    var ev = sc.parts.evaluasi;
    return { sc: sc, mods: mods, tuntas: tuntas, ev: ev, pct: sc.max ? Math.round(sc.earned / sc.max * 100) : 0 };
  }

  function today() {
    try { return new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return new Date().toDateString(); }
  }

  function template() {
    var meta = C.moduleMeta(MOD);
    var s = C.store.state.student;
    var d = data();
    var ex = d.ev.extra;
    var missingId = !s.nama || !s.kelas;
    var logs = C.store.state.log.filter(function (e) { return e.level === 'success'; }).slice(0, 8);

    return '<section class="page page--report" aria-labelledby="page-title-' + MOD + '">' +
      '<div class="no-print">' +
        C.page.head(meta, 'Rekap hasil belajar dari seluruh modul lab. Periksa identitas, lalu cetak atau simpan sebagai PDF untuk diserahkan kepada guru.',
          '<button type="button" class="btn btn--accent" data-action="print">' + C.icon('report') + '<span>Cetak / Simpan PDF</span></button>' +
          '<button type="button" class="btn btn--ghost" data-action="copy">' + C.icon('copy') + '<span>Salin Ringkasan</span></button>') +
        (missingId ? '<p class="note note--draft">' + C.icon('info') + ' Identitas belum lengkap. <a href="#dashboard">Isi nama dan kelas di Dashboard</a> sebelum mencetak.</p>' : '') +
        '<p class="small muted">Tombol cetak membuka dialog cetak browser. Pilih "Simpan sebagai PDF" untuk membuat berkas PDF. Jika tombol tidak merespons (misalnya saat dibuka di dalam pratinjau aplikasi lain), buka aplikasi langsung dari index.html atau GitHub Pages lalu tekan Ctrl+P.</p>' +
      '</div>' +

      '<article class="paper" aria-label="Laporan hasil belajar">' +
        '<header class="paper__head">' +
          '<p class="paper__kicker">Cyber Security Virtual Lab: Attack &amp; Defense</p>' +
          '<h2 class="paper__title">Laporan Hasil Belajar</h2>' +
          '<p class="paper__sub">Laboratorium maya keamanan jaringan, kelas XI Teknik Komputer dan Jaringan</p>' +
        '</header>' +

        '<table class="paper__id"><tbody>' +
          '<tr><th scope="row">Nama siswa</th><td>' + (s.nama ? esc(s.nama) : '<span class="blank"></span>') + '</td>' +
            '<th scope="row">Tanggal</th><td>' + esc(today()) + '</td></tr>' +
          '<tr><th scope="row">Kelas</th><td>' + (s.kelas ? esc(s.kelas) : '<span class="blank"></span>') + '</td>' +
            '<th scope="row">No. absen</th><td>' + (s.absen ? esc(s.absen) : '<span class="blank"></span>') + '</td></tr>' +
        '</tbody></table>' +

        '<div class="paper__sum">' +
          '<div><span>Skor total</span><strong class="num">' + d.sc.earned + ' / ' + d.sc.max + '</strong></div>' +
          '<div><span>Persentase</span><strong class="num">' + d.pct + '%</strong></div>' +
          '<div><span>Modul tuntas</span><strong class="num">' + d.tuntas + ' / ' + d.mods.length + '</strong></div>' +
          '<div><span>Nilai evaluasi (resmi)</span><strong class="num">' + (ex.first === null ? '-' : ex.first) + '</strong></div>' +
        '</div>' +

        '<h3 class="paper__h">A. Rekap Skor per Modul</h3>' +
        '<table class="paper__tbl"><thead><tr><th scope="col">No</th><th scope="col">Modul</th><th scope="col">Skor</th><th scope="col">Indikator</th><th scope="col">Status</th></tr></thead><tbody>' +
          d.mods.map(function (x, i) {
            var st = statusOf(x.r);
            return '<tr><td class="num">' + (i + 1) + '</td><td>' + esc(x.meta.title) + '</td><td class="num">' + x.r.earned + ' / ' + x.r.max + '</td>' +
              '<td class="num">' + x.r.done + ' / ' + x.r.total + '</td><td><span class="pstat pstat--' + st.cls + '">' + st.text + '</span></td></tr>';
          }).join('') +
        '</tbody><tfoot><tr><th scope="row" colspan="2">Jumlah</th><td class="num">' + d.sc.earned + ' / ' + d.sc.max + '</td><td></td><td></td></tr></tfoot></table>' +

        '<h3 class="paper__h">B. Evaluasi</h3>' +
        '<table class="paper__tbl paper__tbl--kv"><tbody>' +
          '<tr><th scope="row">Nilai resmi (percobaan pertama)</th><td class="num">' + (ex.first === null ? 'Belum mengerjakan' : ex.first) + '</td></tr>' +
          '<tr><th scope="row">KKTP</th><td class="num">' + ex.kktp + '</td></tr>' +
          '<tr><th scope="row">Status ketuntasan</th><td>' + (ex.first === null ? '-' : ex.first >= ex.kktp ? 'Tuntas' : 'Belum tuntas') + '</td></tr>' +
          '<tr><th scope="row">Nilai terbaik / jumlah percobaan</th><td class="num">' + (ex.best === null ? '-' : ex.best + ' / ' + ex.attempts + ' kali') + '</td></tr>' +
        '</tbody></table>' +

        '<h3 class="paper__h">C. Indikator Keberhasilan Setiap Skenario</h3>' +
        '<div class="paper__ind">' + d.mods.map(function (x) {
          return '<section><h4>' + esc(x.meta.no + '. ' + x.meta.title) + '</h4><ul>' + x.r.indicators.map(function (k) {
            return '<li class="' + (k.met ? 'is-met' : '') + '"><span class="pmark" aria-hidden="true">' + (k.met ? '✓' : '–') + '</span><span>' + esc(k.label) + '<span class="sr-only">' + (k.met ? ' (tercapai)' : ' (belum tercapai)') + '</span></span></li>';
          }).join('') + '</ul></section>';
        }).join('') + '</div>' +

        '<h3 class="paper__h">D. Catatan Aktivitas Penting</h3>' +
        (logs.length ? '<ol class="paper__log">' + logs.map(function (e) {
          return '<li><span class="num">' + esc(C.dateStr(e.t)) + '</span> ' + esc(e.msg) + '</li>';
        }).join('') + '</ol>' : '<p class="paper__muted">Belum ada aktivitas yang berhasil diselesaikan.</p>') +

        '<p class="paper__note">Catatan: pemetaan Capaian Pembelajaran dan Alur Tujuan Pembelajaran pada aplikasi ini masih rancangan sementara. Semua simulasi memakai data sintetis dan berjalan lokal di browser.</p>' +

        '<div class="paper__sign">' +
          '<div><p>Siswa,</p><p class="sign-line">' + (s.nama ? esc(s.nama) : '') + '</p></div>' +
          '<div><p>Guru mata pelajaran,</p><p class="sign-line"></p></div>' +
        '</div>' +
        '<footer class="paper__foot">Dicetak dari Cyber Security Virtual Lab. Penyusun media: Mohammad Yusron Kholish, S.Kom (SMKS PGRI SINGOSARI).</footer>' +
      '</article>' +
    '</section>';
  }

  function summaryText() {
    var s = C.store.state.student;
    var d = data();
    var ex = d.ev.extra;
    var lines = [
      'LAPORAN HASIL BELAJAR - Cyber Security Virtual Lab',
      'Nama  : ' + (s.nama || '-'),
      'Kelas : ' + (s.kelas || '-') + '   No. absen: ' + (s.absen || '-'),
      'Tanggal: ' + today(),
      '',
      'Skor total: ' + d.sc.earned + '/' + d.sc.max + ' (' + d.pct + '%), modul tuntas ' + d.tuntas + '/' + d.mods.length,
      'Evaluasi: nilai resmi ' + (ex.first === null ? '-' : ex.first) + ', KKTP ' + ex.kktp + (ex.first === null ? '' : ex.first >= ex.kktp ? ' (tuntas)' : ' (belum tuntas)'),
      ''
    ];
    d.mods.forEach(function (x, i) {
      lines.push((i + 1) + '. ' + x.meta.title + ': ' + x.r.earned + '/' + x.r.max + ', indikator ' + x.r.done + '/' + x.r.total + ', ' + statusOf(x.r).text);
    });
    return lines.join('\n');
  }

  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var a = btn.getAttribute('data-action');
    if (a === 'print') {
      C.log.add(MOD, 'info', 'Laporan hasil belajar dibuka untuk dicetak.');
      window.print();
    } else if (a === 'copy') {
      C.ui.copyText(summaryText()).then(function (ok) { if (ok) C.ui.toast('Ringkasan laporan disalin.', { type: 'success' }); });
    }
  }

  var host = null;
  function mount(root) {
    host = root;
    root.innerHTML = template();
    root.addEventListener('click', onClick);
  }
  function unmount() { host = null; }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <!-- Boot -->
  <script data-file="js/app.js">
/* ==========================================================================
   Boot aplikasi: sidebar 10 menu, topbar status (ancaman, skor, siswa),
   tombol global (menu ponsel, Reset Semua Data), lalu menjalankan router.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var esc = C.esc;

  function renderSidebar() {
    var nav = C.$('#nav-list');
    nav.innerHTML = C.MODULES.map(function (m) {
      return '<li><a class="nav__item" href="#' + m.id + '" data-nav="' + m.id + '">' +
        '<span class="nav__no num">' + m.no + '</span>' + C.icon(m.icon) +
        '<span class="nav__label">' + esc(m.title) + '</span>' +
        (m.scored ? '<span class="nav__chip" data-nav-prog="' + m.id + '"></span>' : '') + '</a></li>';
    }).join('');
  }

  function updateNavProgress() {
    var sc = C.store.score();
    C.MODULES.forEach(function (m) {
      if (!m.scored) return;
      var el = C.$('[data-nav-prog="' + m.id + '"]');
      if (!el) return;
      var r = sc.parts[m.id];
      el.className = 'nav__chip' + (r.tuntas ? ' nav__chip--done' : r.earned > 0 ? ' nav__chip--ready' : '');
      el.innerHTML = r.tuntas ? C.icon('check') + '<span class="sr-only">tuntas</span>' : r.earned > 0 ? r.earned + '<span class="sr-only"> dari ' + r.max + ' poin</span>' : '';
    });
  }

  function setActive(id) {
    C.$$('[data-nav]').forEach(function (a) {
      var on = a.getAttribute('data-nav') === id;
      a.classList.toggle('is-active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    var meta = C.moduleMeta(id);
    C.$('#tb-no').textContent = meta ? meta.no : '';
    C.$('#tb-title').textContent = meta ? meta.title : '';
  }

  function updateTopbar() {
    var st = C.Firewall.status();
    var sc = C.store.score();
    C.$('#tb-threat').innerHTML = '<span class="chip__k">Ancaman</span><span class="level level--' + st.levelKey + '">' + st.level + '</span>';
    C.$('#tb-threat').setAttribute('title', st.exposures.length + ' celah terbuka pada aturan firewall saat ini');
    C.$('#tb-score').innerHTML = '<span class="chip__k">Skor</span><span class="num"><b>' + sc.earned + '</b>/' + sc.max + '</span>';
    var s = C.store.state.student;
    var u = C.$('#tb-user');
    if (s.nama) {
      u.hidden = false;
      u.textContent = s.nama.split(/\s+/)[0] + (s.kelas ? ' · ' + s.kelas : '');
      u.setAttribute('title', s.nama + (s.kelas ? ', ' + s.kelas : '') + (s.absen ? ', absen ' + s.absen : ''));
    } else {
      u.hidden = true;
    }
    updateNavProgress();
  }

  function openNav(open) {
    var app = C.$('#app');
    app.classList.toggle('nav-open', open);
    var btn = C.$('#nav-toggle');
    btn.setAttribute('aria-expanded', String(open));
    if (open) {
      var active = C.$('.nav__item.is-active') || C.$('.nav__item');
      if (active) active.focus();
    }
  }

  function resetAll() {
    C.ui.confirm({
      title: 'Reset semua data lab?',
      body: 'Identitas, aturan firewall, progres misi, skor, dan log di browser ini dihapus dan dikembalikan ke kondisi awal. Tindakan ini tidak bisa dibatalkan.',
      confirmLabel: 'Reset Semua Data',
      tone: 'danger'
    }).then(function (ok) {
      if (!ok) return;
      var cur = C.router.currentView;
      if (cur && cur.unmount) cur.unmount();
      C.store.resetAll();
      C.log.add('dashboard', 'info', 'Semua data lab direset ke kondisi awal.');
      C.router.reload();
      updateTopbar();
      openNav(false);
      C.ui.toast('Semua data lab direset.', { type: 'success' });
    });
  }

  function onDocClick(e) {
    var btn = e.target.closest('[data-action]');
    if (btn) {
      var a = btn.getAttribute('data-action');
      if (a === 'go') { C.router.go(btn.getAttribute('data-route')); return; }
      if (a === 'open-nav') { openNav(!C.$('#app').classList.contains('nav-open')); return; }
      if (a === 'close-nav') { openNav(false); return; }
      if (a === 'reset-all') { resetAll(); return; }
    }
    if (e.target.closest('.nav__item')) openNav(false);
  }

  function boot() {
    C.store.init();
    renderSidebar();
    document.addEventListener('click', onDocClick);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && C.$('#app').classList.contains('nav-open')) {
        openNav(false);
        C.$('#nav-toggle').focus();
      }
    });
    C.bus.on('route', function (r) { setActive(r.id); });
    C.bus.on('change', C.throttle(updateTopbar, 250));
    updateTopbar();
    C.router.start();
    C.$('#year').textContent = new Date().getFullYear();
    if (!C.store.persistent) {
      C.ui.toast('Penyimpanan browser tidak tersedia. Progres hanya bertahan selama halaman ini terbuka.', { type: 'warn', timeout: 8000 });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
