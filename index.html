              (r.pass ? '' : '<button type="button" class="btn btn--sm btn--ghost test__act" data-action="test-replay" data-mi="' + r.mission + '" data-ti="' + r.testIndex + '">Kirim paket ini</button>') +
              '</li>';
          }).join('') + '</ul>' +
        '</div>';
    }

    var doneHtml = '';
    if (ms.passed) {
      var nextIdx = i + 1 < D.missions.length ? i + 1 : -1;
      doneHtml =
        '<div class="mission__done">' +
          '<p class="mission__done-head">' + C.icon('check') + '<span>Misi selesai: ' + ms.points + ' poin' +
            (ms.hintUsed ? ' (memakai petunjuk)' : '') + ', ' + ms.attempts + ' kali uji.</span></p>' +
          '<p><strong>Pembahasan.</strong> ' + esc(md.review) + '</p>' +
          (nextIdx >= 0
            ? '<button type="button" class="btn btn--primary" data-action="mission-view" data-index="' + nextIdx + '">Lanjut ke Misi ' + (nextIdx + 1) + C.icon('arrowRight') + '</button>'
            : '') +
        '</div>';
    }

    var finalHtml = '';
    if (allDone) {
      var hints = m.missions.filter(function (x) { return x.hintUsed; }).length;
      var attempts = m.missions.reduce(function (s, x) { return s + x.attempts; }, 0);
      var auditHtml = '';
      if (ui.audit) {
        var okCount = ui.audit.filter(function (a) { return a.pass; }).length;
        auditHtml = '<ul class="audit-list">' + ui.audit.map(function (a) {
          return '<li class="' + (a.pass ? 'is-pass' : 'is-fail') + '">' + C.icon(a.pass ? 'check' : 'x') +
            '<span>Misi ' + (a.index + 1) + ': ' + esc(a.title) + '</span><span class="num">' + a.passCount + '/' + a.total + '</span></li>';
        }).join('') + '</ul>' +
        '<p class="small ' + (okCount === ui.audit.length ? 'text-ok' : 'text-warn') + '">' +
          (okCount === ui.audit.length ? 'Konfigurasi saat ini memenuhi semua target misi.' : 'Ada target misi yang tidak terpenuhi lagi oleh aturan saat ini. Periksa misi yang ditandai.') + '</p>';
      }
      finalHtml =
        '<div class="final">' +
          '<p class="final__head">Semua misi selesai</p>' +
          '<p class="final__score num">' + scoreOf(m) + '<small>/' + D.missions.length * D.pointsFull + '</small></p>' +
          '<p class="small muted">' + hints + ' petunjuk dipakai, ' + attempts + ' kali uji misi.</p>' +
          '<button type="button" class="btn btn--ghost" data-action="mission-audit">' + C.icon('checklist') + '<span>Jalankan Audit Konfigurasi</span></button>' +
          auditHtml +
        '</div>';
    }

    var el = C.$('#fw-mission-card', ui.root);
    el.innerHTML =
      '<header class="card-head">' +
        '<div><h2 id="fw-mission-h">Misi Firewall</h2><p class="card-sub">Selesaikan berurutan. Setiap misi juga menguji ulang target misi sebelumnya.</p></div>' +
        '<span class="score-pill num" title="Skor Simulasi Firewall">' + scoreOf(m) + '<small>/' + D.missions.length * D.pointsFull + '</small></span>' +
      '</header>' +
      '<ol class="mission-steps" aria-label="Daftar misi">' + steps + '</ol>' +
      finalHtml +
      '<div class="mission">' +
        '<p class="mission__eyebrow">Misi ' + (i + 1) + ' dari ' + D.missions.length + ' · ' + esc(md.concept) + '</p>' +
        '<h3 class="mission__title">' + esc(md.title) + '</h3>' +
        '<p class="mission__brief">' + esc(md.brief) + '</p>' +
        '<h4 class="h-sub">Target</h4>' +
        '<ul class="mission__goals">' + md.goals.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ul>' +
        '<p class="mission__indicator"><strong>Indikator keberhasilan:</strong> ' + totalTests + ' uji paket lolos' +
          (i > 0 ? ' (' + ownTests + ' uji misi ini + ' + (totalTests - ownTests) + ' uji regresi).' : '.') + '</p>' +
        '<div class="mission__actions">' +
          '<button type="button" class="btn btn--accent" data-action="mission-test">' + C.icon('checklist') + '<span>' + (ms.passed ? 'Uji Ulang Misi' : 'Uji Misi') + '</span></button>' +
          hintBtn +
        '</div>' +
        (hintVisible ? '<div class="hint"><p><strong>Petunjuk.</strong> ' + esc(md.hint) + '</p></div>' : '') +
        resultHtml +
        doneHtml +
      '</div>';
  }

  /* ---------------- Render: aturan ---------------- */
  function ruleRow(r, idx, total) {
    var portTxt = r.protocol === 'TCP' || r.protocol === 'UDP' ? ':' + r.port : '';
    var flash = ui.flashId === r.id ? ' is-new' : '';
    return '<li class="rule' + (r.enabled ? '' : ' is-off') + flash + '" data-rule="' + r.id + '">' +
      '<span class="rule__no num" aria-label="Urutan ' + (idx + 1) + '">' + (idx + 1) + '</span>' +
      '<div class="rule__body">' +
        '<div class="rule__main">' +
          '<span class="tag ' + (r.action === 'ALLOW' ? 'tag--allow' : 'tag--drop') + '">' + E.ACTION_LABEL[r.action] + '</span>' +
          '<code class="rule__tuple"><span class="rule__proto">' + esc(r.protocol) + '</span> ' + esc(r.src) +
            ' <span class="rule__arrow" aria-label="ke">→</span> ' + esc(r.dst) + esc(portTxt) + '</code>' +
        '</div>' +
        '<div class="rule__meta">' +
          (r.note ? '<span class="rule__note">' + esc(r.note) + '</span>' : '<span class="rule__note muted">Tanpa keterangan</span>') +
          '<span class="rule__hits num" data-hits-for="' + r.id + '">' + (r.hits || 0) + '× cocok</span>' +
          (r.enabled ? '' : '<span class="tag tag--muted">Nonaktif</span>') +
        '</div>' +
      '</div>' +
      '<div class="rule__actions">' +
        '<label class="switch" title="Aktif atau nonaktifkan aturan">' +
          '<input type="checkbox" data-change="rule-toggle" data-id="' + r.id + '"' + (r.enabled ? ' checked' : '') + ' aria-label="Aktifkan aturan nomor ' + (idx + 1) + '">' +
          '<span class="switch__track" aria-hidden="true"></span></label>' +
        '<button type="button" class="icon-btn" data-action="rule-up" data-id="' + r.id + '"' + (idx === 0 ? ' disabled' : '') + ' aria-label="Naikkan aturan nomor ' + (idx + 1) + '" title="Naikkan">' + C.icon('up') + '</button>' +
        '<button type="button" class="icon-btn" data-action="rule-down" data-id="' + r.id + '"' + (idx === total - 1 ? ' disabled' : '') + ' aria-label="Turunkan aturan nomor ' + (idx + 1) + '" title="Turunkan">' + C.icon('down') + '</button>' +
        '<button type="button" class="icon-btn" data-action="rule-edit" data-id="' + r.id + '" aria-label="Ubah aturan nomor ' + (idx + 1) + '" title="Ubah">' + C.icon('edit') + '</button>' +
        '<button type="button" class="icon-btn icon-btn--danger" data-action="rule-delete" data-id="' + r.id + '" aria-label="Hapus aturan nomor ' + (idx + 1) + '" title="Hapus">' + C.icon('trash') + '</button>' +
      '</div>' +
    '</li>';
  }

  function renderRules() {
    var m = mod();
    var list = C.$('#fw-rule-list', ui.root);
    list.innerHTML = m.rules.length
      ? m.rules.map(function (r, idx) { return ruleRow(r, idx, m.rules.length); }).join('')
      : '<li class="empty">Belum ada aturan. Semua paket ditangani kebijakan default ' + E.ACTION_LABEL[m.defaultPolicy] + '.</li>';
    C.$('#fw-rule-default', ui.root).innerHTML =
      '<span class="rule__no rule__no--def" aria-hidden="true">∗</span>' +
      '<span>Jika tidak ada aturan yang cocok: kebijakan default ' +
      '<span class="tag ' + (m.defaultPolicy === 'ALLOW' ? 'tag--allow' : 'tag--drop') + '">' + E.ACTION_LABEL[m.defaultPolicy] + '</span></span>';
    if (ui.flashId) {
      var id = ui.flashId;
      ui.flashId = null;
      setTimeout(function () {
        if (!ui) return;
        var row = C.$('[data-rule="' + id + '"]', ui.root);
        if (row) row.classList.remove('is-new');
      }, 1400);
    }
  }

  function updateHits() {
    var m = mod();
    m.rules.forEach(function (r) {
      var el = C.$('[data-hits-for="' + r.id + '"]', ui.root);
      if (el) el.textContent = (r.hits || 0) + '× cocok';
    });
  }

  function flashRule(id) {
    var row = C.$('[data-rule="' + id + '"]', ui.root);
    if (!row) return;
    row.classList.remove('is-hit');
    void row.offsetWidth;
    row.classList.add('is-hit');
    setTimeout(function () { row.classList.remove('is-hit'); }, 1200);
  }

  /* ---------------- Form aturan ---------------- */
  function renderForm() {
    var host = C.$('#fw-rule-form', ui.root);
    if (ui.editing === null) { host.innerHTML = ''; return; }
    var m = mod();
    var isNew = ui.editing === 'new';
    var idx = isNew ? -1 : m.rules.findIndex(function (r) { return r.id === ui.editing; });
    var r = isNew
      ? { action: 'ALLOW', protocol: 'TCP', src: 'ANY', dst: '', port: '', note: '' }
      : m.rules[idx];
    var count = isNew ? m.rules.length + 1 : m.rules.length;
    var curPos = isNew ? count : idx + 1;
    var posOpts = '';
    for (var p = 1; p <= count; p++) {
      var lbl = p === 1 ? '1 (paling atas)' : p === count ? p + ' (paling bawah)' : String(p);
      posOpts += '<option value="' + p + '"' + (p === curPos ? ' selected' : '') + '>' + lbl + '</option>';
    }
    var portLocked = r.protocol === 'ICMP' || r.protocol === 'ANY';

    host.innerHTML =
      '<form class="rule-form" id="fw-rule-form-el" novalidate>' +
        '<h3 class="rule-form__title">' + (isNew ? 'Tambah aturan baru' : 'Ubah aturan nomor ' + (idx + 1)) + '</h3>' +
        '<fieldset class="field field--action"><legend>Aksi</legend>' +
          '<div class="seg seg--form">' +
            '<label class="seg__opt seg__opt--allow"><input type="radio" name="rf-action" value="ALLOW"' + (r.action === 'ALLOW' ? ' checked' : '') + '><span>IZINKAN</span></label>' +
            '<label class="seg__opt seg__opt--drop"><input type="radio" name="rf-action" value="DROP"' + (r.action === 'DROP' ? ' checked' : '') + '><span>BLOKIR</span></label>' +
          '</div><p class="field-err" id="rf-action-err" hidden></p></fieldset>' +
        '<div class="field"><label for="rf-proto">Protokol</label>' +
          '<select id="rf-proto" class="input">' + E.PROTOCOLS.map(function (pr) {
            return '<option' + (pr === r.protocol ? ' selected' : '') + '>' + pr + '</option>';
          }).join('') + '</select><p class="field-err" id="rf-proto-err" hidden></p></div>' +
        '<div class="field"><label for="rf-src">Alamat sumber</label>' +
          '<input id="rf-src" class="input mono" list="fw-addr-list" autocomplete="off" spellcheck="false" placeholder="ANY, 192.168.10.20, atau 192.168.10.0/24" value="' + esc(r.src) + '" aria-describedby="rf-src-err">' +
          '<p class="field-err" id="rf-src-err" hidden></p></div>' +
        '<div class="field"><label for="rf-dst">Alamat tujuan</label>' +
          '<input id="rf-dst" class="input mono" list="fw-addr-list" autocomplete="off" spellcheck="false" placeholder="Contoh: 172.16.20.10" value="' + esc(r.dst) + '" aria-describedby="rf-dst-err">' +
          '<p class="field-err" id="rf-dst-err" hidden></p></div>' +
        '<div class="field"><label for="rf-port">Port tujuan</label>' +
          '<input id="rf-port" class="input mono" autocomplete="off" spellcheck="false" placeholder="80,443 · 1024-65535 · ANY" value="' + esc(portLocked ? 'ANY' : (r.port === 'ANY' && !isNew ? 'ANY' : r.port)) + '"' + (portLocked ? ' disabled' : '') + ' aria-describedby="rf-port-help rf-port-err">' +
          '<p class="field-help" id="rf-port-help">' + (portLocked ? 'Port hanya berlaku untuk TCP dan UDP.' : 'Satu port, daftar dipisah koma, rentang, atau ANY.') + '</p>' +
          '<p class="field-err" id="rf-port-err" hidden></p></div>' +
        '<div class="field"><label for="rf-pos">Posisi dalam daftar</label><select id="rf-pos" class="input">' + posOpts + '</select></div>' +
        '<div class="field field--wide"><label for="rf-note">Keterangan (opsional)</label>' +
          '<input id="rf-note" class="input" maxlength="80" placeholder="Contoh: Website publik" value="' + esc(r.note || '') + '"></div>' +
        '<div class="form-actions">' +
          '<button type="submit" class="btn btn--primary">' + C.icon('check') + '<span>Simpan Aturan</span></button>' +
          '<button type="button" class="btn btn--ghost" data-action="rule-cancel">Batal</button>' +
        '</div>' +
      '</form>';
    var first = C.$(isNew ? '#rf-dst' : '#rf-src', host);
    if (first) first.focus();
    host.scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'nearest' });
  }

  function onProtoChange() {
    var proto = C.$('#rf-proto', ui.root).value;
    var port = C.$('#rf-port', ui.root);
    var help = C.$('#rf-port-help', ui.root);
    var locked = proto === 'ICMP' || proto === 'ANY';
    if (locked) { port.value = 'ANY'; port.disabled = true; help.textContent = 'Port hanya berlaku untuk TCP dan UDP.'; }
    else { if (port.disabled) port.value = ''; port.disabled = false; help.textContent = 'Satu port, daftar dipisah koma, rentang, atau ANY.'; }
    setErr('rf-port', '');
  }

  function setErr(field, msg) {
    var el = C.$('#' + field + '-err', ui.root);
    if (!el) return;
    el.textContent = msg || '';
    el.hidden = !msg;
    var input = C.$('#' + field, ui.root);
    if (input) input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  }

  function saveRule() {
    var m = mod();
    var actionEl = C.$('input[name="rf-action"]:checked', ui.root);
    var input = {
      action: actionEl ? actionEl.value : null,
      protocol: C.$('#rf-proto', ui.root).value,
      src: C.$('#rf-src', ui.root).value,
      dst: C.$('#rf-dst', ui.root).value,
      port: C.$('#rf-port', ui.root).value,
      note: C.$('#rf-note', ui.root).value
    };
    var v = E.validateRule(input);
    ['rf-action', 'rf-proto', 'rf-src', 'rf-dst', 'rf-port'].forEach(function (f) { setErr(f, ''); });
    if (!v.ok) {
      var map = { action: 'rf-action', protocol: 'rf-proto', src: 'rf-src', dst: 'rf-dst', port: 'rf-port' };
      var firstField = null;
      Object.keys(v.errors).forEach(function (k) {
        setErr(map[k], v.errors[k]);
        if (!firstField) firstField = map[k];
      });
      var f = firstField && C.$('#' + firstField, ui.root);
      if (f && f.focus) f.focus();
      return;
    }
    var pos = Math.max(1, Number(C.$('#rf-pos', ui.root).value) || 1);
    var rule;
    if (ui.editing === 'new') {
      rule = Object.assign({ id: m.nextId++, enabled: true, hits: 0 }, v.rule);
      m.rules.splice(Math.min(pos - 1, m.rules.length), 0, rule);
      C.log.add(MOD, 'info', 'Aturan #' + (m.rules.indexOf(rule) + 1) + ' ditambahkan: ' + E.describeRule(rule) + '.');
      C.ui.toast('Aturan nomor ' + (m.rules.indexOf(rule) + 1) + ' ditambahkan.', { type: 'success' });
    } else {
      var idx = m.rules.findIndex(function (r) { return r.id === ui.editing; });
      if (idx < 0) { closeForm(); return; }
      rule = Object.assign({}, m.rules[idx], v.rule);
      m.rules.splice(idx, 1);
      m.rules.splice(Math.min(pos - 1, m.rules.length), 0, rule);
      C.log.add(MOD, 'info', 'Aturan diubah menjadi #' + (m.rules.indexOf(rule) + 1) + ': ' + E.describeRule(rule) + '.');
      C.ui.toast('Perubahan aturan nomor ' + (m.rules.indexOf(rule) + 1) + ' disimpan.', { type: 'success' });
    }
    ui.editing = null;
    ui.flashId = rule.id;
    C.store.commit('rules');
    afterRulesChanged();
    var btn = C.$('[data-action="rule-new"]', ui.root);
    if (btn) btn.focus({ preventScroll: true });
  }

  function openForm(id) { ui.editing = id; renderForm(); }
  function closeForm() { ui.editing = null; renderForm(); }

  function afterRulesChanged() {
    renderForm();
    renderRules();
    renderStatus();
    syncTopo();
  }

  function moveRule(id, dir) {
    var m = mod();
    var idx = m.rules.findIndex(function (r) { return r.id === id; });
    var j = idx + dir;
    if (idx < 0 || j < 0 || j >= m.rules.length) return;
    var tmp = m.rules[idx];
    m.rules[idx] = m.rules[j];
    m.rules[j] = tmp;
    C.log.add(MOD, 'info', 'Aturan ' + E.describeRule(tmp) + ' dipindah ke posisi ' + (j + 1) + '.');
    ui.flashId = id;
    C.store.commit('rules');
    if (ui.editing !== null) closeForm();
    renderRules();
    renderStatus();
    var b = C.$('[data-rule="' + id + '"] [data-action="' + (dir < 0 ? 'rule-up' : 'rule-down') + '"]', ui.root);
    if (b && !b.disabled) b.focus();
    else { var alt = C.$('[data-rule="' + id + '"] [data-action="rule-edit"]', ui.root); if (alt) alt.focus(); }
  }

  function toggleRule(id, on) {
    var m = mod();
    var r = m.rules.find(function (x) { return x.id === id; });
    if (!r) return;
    r.enabled = on;
    var no = m.rules.indexOf(r) + 1;
    C.log.add(MOD, 'info', 'Aturan #' + no + ' ' + (on ? 'diaktifkan' : 'dinonaktifkan') + ': ' + E.describeRule(r) + '.');
    C.store.commit('rules');
    renderRules();
    renderStatus();
    syncTopo();
    var cb = C.$('[data-change="rule-toggle"][data-id="' + id + '"]', ui.root);
    if (cb) cb.focus();
  }

  function deleteRule(id) {
    var m = mod();
    var idx = m.rules.findIndex(function (r) { return r.id === id; });
    if (idx < 0) return;
    var removed = m.rules.splice(idx, 1)[0];
    if (ui.editing === id) ui.editing = null;
    C.log.add(MOD, 'info', 'Aturan #' + (idx + 1) + ' dihapus: ' + E.describeRule(removed) + '.');
    C.store.commit('rules');
    afterRulesChanged();
    C.ui.toast('Aturan nomor ' + (idx + 1) + ' dihapus.', {
      action: {
        label: 'Batalkan',
        fn: function () {
          var mm = mod();
          if (mm.rules.some(function (r) { return r.id === removed.id; })) return;
          mm.rules.splice(Math.min(idx, mm.rules.length), 0, removed);
          C.log.add(MOD, 'info', 'Penghapusan dibatalkan, aturan #' + (Math.min(idx, mm.rules.length - 1) + 1) + ' dikembalikan.');
          C.store.commit('rules');
          if (ui) { ui.flashId = removed.id; afterRulesChanged(); }
        }
      }
    });
  }

  function setPolicy(p) {
    var m = mod();
    if (m.defaultPolicy === p) return;
    m.defaultPolicy = p;
    if (p === 'ALLOW') {
      C.log.add(MOD, 'warn', 'Kebijakan default diubah menjadi IZINKAN. Semua paket yang tidak cocok aturan akan lolos.');
      C.ui.toast('Kebijakan default IZINKAN: paket yang tidak cocok aturan mana pun akan lolos. Perhatikan tingkat ancaman.', { type: 'warn' });
    } else {
      C.log.add(MOD, 'info', 'Kebijakan default diubah menjadi BLOKIR.');
      C.ui.toast('Kebijakan default BLOKIR diterapkan.', { type: 'success' });
    }
    C.store.commit('policy');
    renderStatus();
    renderRules();
    syncTopo();
    var b = C.$('[data-action="policy"][data-value="' + p + '"]', ui.root);
    if (b) b.focus();
  }

  /* ---------------- Misi ---------------- */
  function testMission() {
    var m = mod();
    var i = m.viewMission;
    var ms = m.missions[i];
    var run = S.testMission(i, m);
    ms.attempts++;
    ui.runs[i] = run;
    if (run.passed && !ms.passed) {
      ms.passed = true;
      ms.points = ms.hintUsed ? D.pointsWithHint : D.pointsFull;
      ms.passedAt = Date.now();
      C.log.add(MOD, 'success', 'Misi ' + (i + 1) + ' "' + D.missions[i].title + '" berhasil (+' + ms.points + ' poin).');
      C.ui.toast('Misi ' + (i + 1) + ' berhasil. +' + ms.points + ' poin.', { type: 'success' });
    } else if (run.passed) {
      C.log.add(MOD, 'success', 'Uji ulang Misi ' + (i + 1) + ': semua ' + run.total + ' uji lolos.');
      C.ui.toast('Semua uji Misi ' + (i + 1) + ' masih lolos.', { type: 'success' });
    } else {
      C.log.add(MOD, 'warn', 'Uji Misi ' + (i + 1) + ': ' + run.failed + ' dari ' + run.total + ' uji belum lolos.');
    }
    C.store.commit('mission');
    animateTests(run);
    renderMission();
    var res = C.$('.run', ui.root);
    if (res) res.scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'nearest' });
  }

  function animateTests(run) {
    clearTestTimers();
    run.results.forEach(function (r, k) {
      ui.testTimers.push(setTimeout(function () {
        if (!ui) return;
        ui.topo.send(r.test, r.result, { variant: 'test' });
      }, k * 140));
    });
  }
  function clearTestTimers() {
    (ui.testTimers || []).forEach(clearTimeout);
    ui.testTimers = [];
  }

  function showHint() {
    var m = mod();
    var i = m.viewMission;
    var ms = m.missions[i];
    if (ms.hintUsed) return;
    if (ms.passed) { ui.hintOpen[i] = !ui.hintOpen[i]; renderMission(); return; }
    C.ui.confirm({
      title: 'Buka petunjuk Misi ' + (i + 1) + '?',
      body: 'Petunjuk menampilkan langkah penyelesaian. Nilai maksimal misi ini turun dari ' + D.pointsFull + ' menjadi ' + D.pointsWithHint + ' poin.',
      confirmLabel: 'Buka Petunjuk',
      tone: 'warn'
    }).then(function (ok) {
      if (!ok || !ui) return;
      var mm = mod();
      mm.missions[i].hintUsed = true;
      C.log.add(MOD, 'info', 'Petunjuk Misi ' + (i + 1) + ' dibuka (nilai maksimal misi menjadi ' + D.pointsWithHint + ').');
      C.store.commit('hint');
      renderMission();
    });
  }

  function viewMission(i) {
    var m = mod();
    if (i < 0 || i >= D.missions.length || !isUnlocked(m, i)) return;
    m.viewMission = i;
    C.store.commit('mission-view');
    renderMission();
    var b = C.$('.mstep.is-active', ui.root);
    if (b) b.focus({ preventScroll: true });
  }

  function runAudit() {
    var m = mod();
    ui.audit = S.audit(m);
    var ok = ui.audit.filter(function (a) { return a.pass; }).length;
    C.log.add(MOD, ok === ui.audit.length ? 'success' : 'warn', 'Audit konfigurasi: ' + ok + ' dari ' + ui.audit.length + ' target misi terpenuhi.');
    renderMission();
  }

  /* ---------------- Paket uji ---------------- */
  function readSender() {
    var src = C.$('#ps-src', ui.root).value;
    var dst = C.$('#ps-dst', ui.root).value;
    var svcId = C.$('#ps-svc', ui.root).value;
    var protocol, port;
    if (svcId === 'custom') {
      protocol = C.$('#ps-proto', ui.root).value;
      var raw = C.$('#ps-port', ui.root).value;
      port = protocol === 'ICMP' ? null : Number(raw);
    } else {
      var svc = D.services.filter(function (s) { return s.id === svcId; })[0];
      protocol = svc.protocol;
      port = svc.port;
    }
    return { src: src, dst: dst, protocol: protocol, port: port };
  }

  function senderError(msg) {
    var el = C.$('#ps-err', ui.root);
    el.textContent = msg || '';
    el.hidden = !msg;
  }

  function sendManual() {
    var spec = readSender();
    senderError('');
    if (spec.src === spec.dst) { senderError('Sumber dan tujuan tidak boleh perangkat yang sama.'); return; }
    if (spec.protocol !== 'ICMP' && !(Number.isInteger(spec.port) && spec.port >= 1 && spec.port <= 65535)) {
      senderError('Isi port tujuan dengan angka 1 sampai 65535.');
      C.$('#ps-port', ui.root).focus();
      return;
    }
    var m = mod();
    var res = S.evaluate(spec, m);
    record(m, spec, res, 'manual');
    C.store.commit('packet');
    ui.last = { spec: spec, res: res, at: Date.now() };
    ui.topo.send(spec, res, { variant: 'manual', label: S.protoLabel(spec) });
    renderResult();
    renderLog();
    updateHits();
    if (res.matchedId != null) flashRule(res.matchedId);
  }

  function renderResult() {
    var el = C.$('#ps-result', ui.root);
    if (!ui.last) {
      el.innerHTML = '<p class="empty">Belum ada paket dikirim. Coba kirim HTTPS dari PENGUNJUNG ke SRV-WEB untuk melihat kebijakan default bekerja.</p>';
      return;
    }
    var spec = ui.last.spec, res = ui.last.res;
    var pkt = S.toPacket(spec);
    var cls, label, by;
    if (res.sameZone) { cls = 'verdict--info'; label = 'TIDAK MELEWATI FIREWALL'; by = 'satu zona, lewat switch'; }
    else {
      cls = res.decision === 'ALLOW' ? 'verdict--allow' : 'verdict--drop';
      label = E.DECISION_LABEL[res.decision];
      by = res.byDefault ? 'oleh kebijakan default' : 'oleh aturan nomor ' + res.matchedNo;
    }
    el.innerHTML =
      '<div class="verdict ' + cls + '">' +
        '<p class="verdict__line"><span class="verdict__label">' + label + '</span><span class="verdict__by">' + esc(by) + '</span></p>' +
        '<p class="verdict__pkt"><code>' + esc(pkt.src + ' → ' + pkt.dst + ' ' + S.protoLabel(spec)) + '</code></p>' +
      '</div>' +
      '<h3 class="h-sub">Jejak pemeriksaan</h3>' +
      '<ol class="trace">' + res.trace.map(function (t) {
        return '<li class="trace__item trace--' + t.status + '"><span class="trace__no">' + (t.no ? '#' + t.no : t.status === 'default' ? '∗' : 'i') + '</span><span>' + esc(t.reason) + '</span></li>';
      }).join('') + '</ol>';
  }

  function setSenderFromSpec(spec) {
    C.$('#ps-src', ui.root).value = spec.src;
    C.$('#ps-dst', ui.root).value = spec.dst;
    var svc = D.services.filter(function (s) {
      return s.protocol === spec.protocol && (spec.protocol === 'ICMP' || s.port === spec.port);
    })[0];
    if (svc) {
      C.$('#ps-svc', ui.root).value = svc.id;
    } else {
      C.$('#ps-svc', ui.root).value = 'custom';
      C.$('#ps-proto', ui.root).value = spec.protocol;
      C.$('#ps-port', ui.root).value = spec.port || '';
    }
    onSvcChange();
    syncTopo();
  }

  function onSvcChange() {
    var custom = C.$('#ps-svc', ui.root).value === 'custom';
    C.$('#ps-custom', ui.root).hidden = !custom;
    var proto = C.$('#ps-proto', ui.root).value;
    C.$('#ps-port', ui.root).disabled = proto === 'ICMP';
  }

  /* ---------------- Pencatatan paket ---------------- */
  function record(m, spec, res, variant) {
    var desc = S.describe(spec);
    if (res.sameZone) {
      if (variant === 'manual') C.log.add(MOD, 'info', 'Paket uji ' + desc + ' tidak melewati firewall karena sumber dan tujuan satu zona.');
      return variant === 'manual';
    }
    var c = m.counters;
    c.total++;
    if (res.decision === 'ALLOW') c.allowed++; else c.blocked++;
    if (res.matchedId != null) {
      var r = m.rules.find(function (x) { return x.id === res.matchedId; });
      if (r) r.hits = (r.hits || 0) + 1;
    }
    var by = res.byDefault ? 'kebijakan default' : 'aturan #' + res.matchedNo;
    if (variant === 'manual') {
      m.packetsSent++;
      C.log.add(MOD, res.decision === 'ALLOW' ? 'allow' : 'block', 'Paket uji ' + desc + ' ' + E.DECISION_LABEL[res.decision] + ' oleh ' + by + '.');
      return true;
    }
    if (spec.threat) {
      if (res.decision === 'ALLOW') {
        c.threatPassed++;
        C.log.add(MOD, 'warn', 'Ancaman lolos: ' + spec.tag + ' (' + desc + ') diizinkan oleh ' + by + '.');
      } else {
        c.threatBlocked++;
        C.log.add(MOD, 'block', 'Ancaman diblokir: ' + spec.tag + ' (' + desc + ') oleh ' + by + '.');
      }
      return true;
    }
    if (res.decision === 'DROP') {
      c.legitBlocked++;
      C.log.add(MOD, 'warn', 'Layanan sah terblokir: ' + spec.tag + ' (' + desc + ') oleh ' + by + '.');
      return true;
    }
    return false;
  }

  /* ---------------- Lalu lintas otomatis ---------------- */
  function renderAuto() {
    var m = mod();
    var c = m.counters;
    var running = ui.auto.running;
    var pctAllow = c.total ? Math.round(c.allowed / c.total * 100) : 0;
    var el = C.$('#fw-auto-card', ui.root);
    var speedSel = C.$('#auto-speed', el);
    if (!speedSel) {
      el.innerHTML =
        '<header class="card-head"><div><h2 id="fw-auto-h">Lalu Lintas Otomatis</h2>' +
          '<p class="card-sub">Campuran lalu lintas sah dan serangan sintetis melewati aturan Anda saat ini.</p></div></header>' +
        '<div class="auto-controls">' +
          '<button type="button" class="btn btn--primary" data-action="auto-toggle" id="auto-toggle"></button>' +
          '<div class="field field--inline"><label for="auto-speed">Kecepatan</label>' +
            '<select id="auto-speed" class="input input--sm"><option value="lambat">Lambat</option><option value="normal" selected>Normal</option><option value="cepat">Cepat</option></select></div>' +
          '<button type="button" class="btn btn--ghost btn--sm" data-action="counters-reset">' + C.icon('reset') + '<span>Nol-kan</span></button>' +
        '</div>' +
        '<dl class="counters" id="auto-counters"></dl>' +
        '<div class="meter" id="auto-meter" aria-hidden="true"><span class="meter__allow"></span><span class="meter__drop"></span></div>' +
        '<p class="small muted" id="auto-meter-cap"></p>';
      C.$('#auto-speed', el).value = ui.auto.speed;
    }
    var tgl = C.$('#auto-toggle', el);
    tgl.innerHTML = C.icon(running ? 'pause' : 'play') + '<span>' + (running ? 'Hentikan' : 'Mulai Lalu Lintas') + '</span>';
    tgl.setAttribute('aria-pressed', String(running));
    tgl.classList.toggle('is-running', running);

    C.$('#auto-counters', el).innerHTML =
      counter('Total paket', c.total, '') +
      counter('Diizinkan', c.allowed, 'ok') +
      counter('Diblokir', c.blocked, 'bad') +
      counter('Ancaman diblokir', c.threatBlocked, 'ok') +
      counter('Ancaman lolos', c.threatPassed, c.threatPassed ? 'alert' : '') +
      counter('Layanan sah terblokir', c.legitBlocked, c.legitBlocked ? 'alert' : '');
    C.$('.meter__allow', el).style.width = (c.total ? pctAllow : 0) + '%';
    C.$('.meter__drop', el).style.width = (c.total ? 100 - pctAllow : 0) + '%';
    C.$('#auto-meter-cap', el).textContent = c.total
      ? pctAllow + '% paket diizinkan, ' + (100 - pctAllow) + '% diblokir.'
      : 'Belum ada lalu lintas. Tekan Mulai Lalu Lintas.';
  }

  function counter(label, val, tone) {
    return '<div class="counter' + (tone ? ' counter--' + tone : '') + '"><dt>' + esc(label) + '</dt><dd class="num">' + val + '</dd></div>';
  }

  function startAuto() {
    if (ui.auto.running) return;
    ui.auto.running = true;
    C.log.add(MOD, 'info', 'Lalu lintas otomatis dimulai (' + ui.auto.speed + ').');
    tickAuto();
    ui.auto.timer = setInterval(tickAuto, SPEEDS[ui.auto.speed]);
    renderAuto();
    renderLog();
  }

  function stopAuto(silent) {
    if (!ui || !ui.auto.running) return;
    clearInterval(ui.auto.timer);
    ui.auto.running = false;
    if (!silent) {
      C.log.add(MOD, 'info', 'Lalu lintas otomatis dihentikan.');
      renderAuto();
      renderLog();
    }
  }

  function tickAuto() {
    if (!ui) return;
    var m = mod();
    var spec = S.randomPacket();
    var res = S.evaluate(spec, m);
    var logged = record(m, spec, res, 'auto');
    C.store.commit('traffic');
    ui.topo.send(spec, res, { variant: spec.threat ? 'threat' : 'legit' });
    renderAuto();
    updateHits();
    if (logged) renderLog();
  }

  /* ---------------- Log ---------------- */
  function renderLog() {
    var list = C.log.list(MOD, ui.logFilter).slice(0, 80);
    var el = C.$('#fw-log-list', ui.root);
    el.innerHTML = list.length
      ? list.map(function (e) {
          return '<li class="log log--' + e.level + '"><time class="log__t">' + C.timeStr(e.t) + '</time>' +
            '<span class="log__lv">' + esc(C.log.LEVELS[e.level] || e.level) + '</span><span class="log__msg">' + esc(e.msg) + '</span></li>';
        }).join('')
      : '<li class="empty">Belum ada peristiwa' + (ui.logFilter === 'all' ? '' : ' untuk filter ini') + '.</li>';
  }

  /* ---------------- Info perangkat ---------------- */
  function selectNode(id) {
    ui.node = ui.node === id ? null : id;
    ui.topo.focusNode(ui.node);
    renderNodeInfo();
  }

  function renderNodeInfo() {
    var el = C.$('#fw-node-info', ui.root);
    if (!ui.node) {
      el.innerHTML = '<p class="small muted">' + C.icon('info') + ' Pilih perangkat pada diagram untuk melihat IP, zona, dan layanannya.</p>';
      return;
    }
    var n = S.node(ui.node);
    el.innerHTML =
      '<div class="node-card">' +
        '<div class="node-card__head"><strong>' + esc(n.name) + '</strong><code>' + esc(n.ip) + '</code><span class="tag tag--muted">' + esc(D.zones[n.zone].label) + '</span></div>' +
        '<p class="small">' + esc(n.role) + '.</p>' +
        '<p class="small muted">Layanan: ' + (n.services.length ? esc(n.services.join(', ')) : 'tidak menyediakan layanan') + '</p>' +
        '<div class="node-card__actions">' +
          '<button type="button" class="btn btn--sm btn--ghost" data-action="node-src">Jadikan Sumber</button>' +
          '<button type="button" class="btn btn--sm btn--ghost" data-action="node-dst">Jadikan Tujuan</button>' +
          '<button type="button" class="btn btn--sm btn--ghost" data-action="node-close">Tutup</button>' +
        '</div>' +
      '</div>';
  }

  function syncTopo() {
    if (!ui || !ui.topo) return;
    var m = mod();
    ui.topo.setFirewall(m.defaultPolicy, m.rules.filter(function (r) { return r.enabled; }).length);
    ui.topo.select(C.$('#ps-src', ui.root).value, C.$('#ps-dst', ui.root).value);
  }

  /* ---------------- Reset ---------------- */
  function resetRules() {
    C.ui.confirm({
      title: 'Kembalikan aturan awal?',
      body: 'Semua aturan diganti dengan aturan bawaan dan kebijakan default kembali BLOKIR. Progres misi dan skor tetap tersimpan.',
      confirmLabel: 'Kembalikan', tone: 'danger'
    }).then(function (ok) {
      if (!ok || !ui) return;
      var m = mod();
      m.rules = freshRules();
      m.nextId = D.initialRules.length + 1;
      m.defaultPolicy = D.initialPolicy;
      ui.editing = null;
      C.log.add(MOD, 'info', 'Aturan dikembalikan ke kondisi awal.');
      C.store.commit('rules');
      afterRulesChanged();
      C.ui.toast('Aturan awal dikembalikan.', { type: 'success' });
    });
  }

  function resetModule() {
    C.ui.confirm({
      title: 'Reset Simulasi Firewall?',
      body: 'Aturan, progres kelima misi, skor, dan penghitung paket dikembalikan ke kondisi awal. Tindakan ini tidak bisa dibatalkan.',
      confirmLabel: 'Reset Modul', tone: 'danger'
    }).then(function (ok) {
      if (!ok || !ui) return;
      stopAuto(true);
      C.store.resetModule(MOD);
      C.log.add(MOD, 'info', 'Simulasi Firewall direset ke kondisi awal.');
      ui.runs = {}; ui.hintOpen = {}; ui.audit = null; ui.last = null; ui.editing = null;
      ui.topo.clear();
      renderAll();
      C.ui.toast('Simulasi Firewall direset.', { type: 'success' });
    });
  }

  function renderAll() {
    renderStatus();
    renderMission();
    renderForm();
    renderRules();
    renderResult();
    renderAuto();
    renderLog();
    renderNodeInfo();
    syncTopo();
  }

  /* ---------------- Event ---------------- */
  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || !ui.root.contains(btn) || btn.disabled) return;
    var a = btn.getAttribute('data-action');
    var id = Number(btn.getAttribute('data-id'));
    switch (a) {
      case 'policy': setPolicy(btn.getAttribute('data-value')); break;
      case 'rule-new': openForm('new'); break;
      case 'rule-edit': openForm(id); break;
      case 'rule-cancel': closeForm(); C.$('[data-action="rule-new"]', ui.root).focus(); break;
      case 'rule-up': moveRule(id, -1); break;
      case 'rule-down': moveRule(id, 1); break;
      case 'rule-delete': deleteRule(id); break;
      case 'reset-rules': resetRules(); break;
      case 'reset-module': resetModule(); break;
      case 'mission-view': viewMission(Number(btn.getAttribute('data-index'))); break;
      case 'mission-test': testMission(); break;
      case 'mission-hint': showHint(); break;
      case 'mission-audit': runAudit(); break;
      case 'test-replay': {
        var t = D.missions[Number(btn.getAttribute('data-mi'))].tests[Number(btn.getAttribute('data-ti'))];
        setSenderFromSpec(t);
        sendManual();
        C.$('#fw-sender-card', ui.root).scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
        break;
      }
      case 'ps-swap': {
        var s = C.$('#ps-src', ui.root), d = C.$('#ps-dst', ui.root);
        var tmp = s.value; s.value = d.value; d.value = tmp;
        syncTopo();
        break;
      }
      case 'node-src': if (ui.node) { C.$('#ps-src', ui.root).value = ui.node; syncTopo(); C.ui.toast(S.node(ui.node).name + ' menjadi sumber paket uji.'); } break;
      case 'node-dst': if (ui.node) { C.$('#ps-dst', ui.root).value = ui.node; syncTopo(); C.ui.toast(S.node(ui.node).name + ' menjadi tujuan paket uji.'); } break;
      case 'node-close': ui.node = null; ui.topo.focusNode(null); renderNodeInfo(); break;
      case 'auto-toggle': if (ui.auto.running) stopAuto(); else startAuto(); break;
      case 'counters-reset': {
        var m = mod();
        m.counters = freshCounters();
        m.rules.forEach(function (r) { r.hits = 0; });
        C.store.commit('counters');
        renderAuto();
        updateHits();
        C.ui.toast('Penghitung paket dan jumlah kecocokan aturan dinolkan.');
        break;
      }
      case 'log-copy': {
        var entries = C.log.list(MOD, ui.logFilter);
        if (!entries.length) { C.ui.toast('Log masih kosong.'); break; }
        C.ui.copyText(C.log.toText(entries)).then(function (ok) { if (ok) C.ui.toast(entries.length + ' baris log disalin.', { type: 'success' }); });
        break;
      }
      case 'log-clear':
        C.ui.confirm({ title: 'Bersihkan log firewall?', body: 'Semua catatan peristiwa Simulasi Firewall dihapus. Aturan dan skor tidak berubah.', confirmLabel: 'Bersihkan', tone: 'danger' })
          .then(function (ok) { if (!ok || !ui) return; C.log.clear(MOD); renderLog(); C.ui.toast('Log firewall dibersihkan.'); });
        break;
      default: break;
    }
  }

  function onChange(e) {
    var t = e.target;
    if (t.getAttribute('data-change') === 'rule-toggle') { toggleRule(Number(t.getAttribute('data-id')), t.checked); return; }
    switch (t.id) {
      case 'rf-proto': onProtoChange(); break;
      case 'ps-svc': case 'ps-proto': onSvcChange(); senderError(''); break;
      case 'ps-src': case 'ps-dst': syncTopo(); senderError(''); break;
      case 'auto-speed':
        ui.auto.speed = t.value;
        if (ui.auto.running) { clearInterval(ui.auto.timer); ui.auto.timer = setInterval(tickAuto, SPEEDS[ui.auto.speed]); }
        break;
      case 'fw-log-filter': ui.logFilter = t.value; renderLog(); break;
      default: break;
    }
  }

  function onInput(e) {
    var id = e.target.id;
    if (id === 'rf-src' || id === 'rf-dst' || id === 'rf-port') setErr(id, '');
  }

  function onSubmit(e) {
    if (e.target.id === 'fw-rule-form-el') { e.preventDefault(); saveRule(); }
    else if (e.target.id === 'fw-sender-form') { e.preventDefault(); sendManual(); }
  }

  function onKey(e) {
    if (e.key === 'Escape' && ui && ui.editing !== null && C.$('#fw-rule-form-el', ui.root) && C.$('#fw-rule-form-el', ui.root).contains(e.target)) {
      closeForm();
      C.$('[data-action="rule-new"]', ui.root).focus();
    }
  }

  /* ---------------- Mount / unmount ---------------- */
  function mount(root) {
    var m = mod();
    if (!isUnlocked(m, m.viewMission)) m.viewMission = highestUnlocked(m);
    ui = {
      root: root, topo: null, editing: null, flashId: null, last: null,
      runs: {}, hintOpen: {}, audit: null, testTimers: [],
      auto: { running: false, timer: 0, speed: 'normal' },
      logFilter: 'all', node: null, detailsOpen: false
    };
    root.innerHTML = template();
    ui.topo = C.Topology.create(C.$('#fw-topo', root), { onNodeClick: selectNode });
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    root.addEventListener('input', onInput);
    root.addEventListener('submit', onSubmit);
    root.addEventListener('keydown', onKey);
    renderAll();
  }

  function unmount() {
    if (!ui) return;
    stopAuto(true);
    clearTestTimers();
    if (ui.topo) ui.topo.destroy();
    ui = null;
  }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/deteksi-intrusi.js">
/* ==========================================================================
   Menu 6 — Simulasi Deteksi Intrusi
   Siswa membaca 17 baris log buatan, menandai Normal/Mencurigakan,
   lalu menentukan prioritas peringatan dan tindakan awal.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var ID = C.IdsData;
  var esc = C.esc;
  var MOD = 'deteksi-intrusi';
  var N = ID.lines.length;
  var PASS = Math.ceil(N * 0.8);

  function fresh() { return { labels: {}, checked: false, last: 0, best: 0, attempts: 0, answers: {}, revealed: false, qBest: {} }; }
  function valid(m) { return m && typeof m.labels === 'object' && typeof m.qBest === 'object'; }
  C.store.registerModule(MOD, fresh, valid);

  C.store.registerScore(MOD, function (m) {
    var earned = Math.round(m.best / N * 70) + (m.qBest.i1 ? 15 : 0) + (m.qBest.i2 ? 15 : 0);
    var ind = [
      { label: 'Akurasi klasifikasi log minimal 80% (terbaik ' + Math.round(m.best / N * 100) + '%).', met: m.best >= PASS },
      { label: 'Menentukan peringatan dengan prioritas tertinggi secara benar.', met: !!m.qBest.i1 },
      { label: 'Memilih tindakan awal yang tepat untuk peringatan tersebut.', met: !!m.qBest.i2 }
    ];
    return {
      earned: earned, max: 100, label: 'Simulasi Deteksi Intrusi',
      done: ind.filter(function (x) { return x.met; }).length, total: ind.length,
      started: Object.keys(m.labels).length > 0 || m.attempts > 0,
      tuntas: ind.every(function (x) { return x.met; }), indicators: ind
    };
  });

  var ui = null;
  function mod() { return C.store.mod(MOD); }

  function template() {
    var meta = C.moduleMeta(MOD);
    return '<section class="page page--ids" aria-labelledby="page-title-' + MOD + '">' +
      C.page.head(meta, 'Baca log buatan dari server web, sistem autentikasi, dan firewall. Tandai setiap baris sebagai normal atau mencurigakan, lalu tentukan peringatan yang paling mendesak.', C.page.resetButton()) +
      '<div class="two-col two-col--wide">' +
        '<article class="card hud" aria-labelledby="ids-log-h">' +
          '<header class="card-head"><div><h2 id="ids-log-h">Log Gabungan 9 Oktober 2026</h2>' +
            '<p class="card-sub" id="ids-count"></p></div></header>' +
          '<div class="ids-tools">' +
            '<div class="field"><label for="ids-src">Sumber log</label><select id="ids-src" class="input input--sm"><option value="all">Semua sumber</option>' +
              Object.keys(ID.sources).map(function (k) { return '<option value="' + k + '">' + ID.sources[k] + '</option>'; }).join('') + '</select></div>' +
            '<div class="field ids-tools__search"><label for="ids-q">Cari teks atau IP</label><input id="ids-q" class="input input--sm mono" type="search" placeholder="contoh: 198.51.100.66" autocomplete="off" spellcheck="false"></div>' +
            '<div class="field"><label for="ids-show">Tampilkan</label><select id="ids-show" class="input input--sm"><option value="all">Semua baris</option><option value="todo">Belum ditandai</option></select></div>' +
          '</div>' +
          '<ol class="ids-list" id="ids-list"></ol>' +
          '<p class="field-err" id="ids-err" hidden></p>' +
          '<div class="actions-row" id="ids-actions"></div>' +
        '</article>' +
        '<div class="stack">' +
          '<article class="card" id="ids-progress" aria-label="Indikator keberhasilan"></article>' +
          '<article class="card" aria-labelledby="ids-learn-h">' +
            '<details class="learn" open>' +
              '<summary><h2 id="ids-learn-h">Petunjuk Membaca Log</h2></summary>' +
              '<ol class="learn-list">' +
                '<li><strong>Frekuensi:</strong> banyak kegagalan login atau banyak port dalam waktu singkat menandakan serangan otomatis.</li>' +
                '<li><strong>Asal dan waktu:</strong> login admin dari IP luar atau di luar jam kerja patut dicurigai.</li>' +
                '<li><strong>Isi permintaan web:</strong> karakter aneh seperti <code>\'--</code> atau <code>../</code> adalah ciri percobaan serangan.</li>' +
                '<li><strong>Arah koneksi:</strong> server yang tiba-tiba menghubungi internet di port tidak umum bisa jadi sudah dikendalikan pihak luar.</li>' +
                '<li><strong>Satu kali salah ketik</strong> lalu berhasil biasanya normal.</li>' +
              '</ol>' +
            '</details>' +
          '</article>' +
        '</div>' +
      '</div>' +
      '<article class="card" id="ids-q-card" aria-labelledby="ids-qh"></article>' +
      C.page.cpCard(meta) +
    '</section>';
  }

  function renderList() {
    var m = mod();
    C.$('#ids-list', ui.root).innerHTML = ID.lines.map(function (l) {
      var lab = m.labels[l.id];
      var right = m.checked && lab === (l.susp ? 'susp' : 'normal');
      return '<li class="ids-row' + (m.checked ? (right ? ' is-right' : ' is-wrong') : '') + (lab ? ' is-labeled' : '') + '" data-line="' + l.id + '" data-src="' + l.src + '">' +
        '<div class="ids-row__meta"><time class="num">' + l.time + '</time><span class="tag tag--muted">' + esc(ID.sources[l.src]) + '</span><span class="ids-row__host">' + esc(l.host) + '</span></div>' +
        '<code class="ids-row__text">' + esc(l.text) + '</code>' +
        '<div class="seg seg--form ids-row__seg" role="radiogroup" aria-label="Label untuk log pukul ' + l.time + '">' +
          '<label class="seg__opt seg__opt--allow"><input type="radio" name="ids-' + l.id + '" value="normal" data-line="' + l.id + '"' + (lab === 'normal' ? ' checked' : '') + (m.checked ? ' disabled' : '') + '><span>NORMAL</span></label>' +
          '<label class="seg__opt seg__opt--drop"><input type="radio" name="ids-' + l.id + '" value="susp" data-line="' + l.id + '"' + (lab === 'susp' ? ' checked' : '') + (m.checked ? ' disabled' : '') + '><span>MENCURIGAKAN</span></label>' +
        '</div>' +
        (m.checked ? '<p class="ids-row__fb">' + C.icon(right ? 'check' : 'x') + '<span><strong>' + (l.susp ? 'Mencurigakan' : 'Normal') + ': ' + esc(l.pattern) + '.</strong> ' + esc(l.explain) + '</span></p>' : '') +
      '</li>';
    }).join('');
    applyFilter();
    renderCount();
    renderActions();
  }

  function renderCount() {
    var m = mod();
    var labeled = ID.lines.filter(function (l) { return m.labels[l.id]; }).length;
    C.$('#ids-count', ui.root).textContent = m.checked
      ? 'Hasil: ' + m.last + ' dari ' + N + ' baris benar (' + Math.round(m.last / N * 100) + '%).'
      : labeled + ' dari ' + N + ' baris sudah ditandai.';
  }

  function renderActions() {
    var m = mod();
    C.$('#ids-actions', ui.root).innerHTML = m.checked
      ? '<button type="button" class="btn btn--ghost" data-action="ids-retry">' + C.icon('reset') + '<span>Ulangi Klasifikasi</span></button>' +
        '<p class="small ' + (m.last >= PASS ? 'text-ok' : 'text-warn') + '">' + (m.last >= PASS ? 'Akurasi mencapai 80%.' : 'Akurasi belum 80%. Baca penjelasan tiap baris lalu ulangi.') + ' Terbaik: ' + m.best + '/' + N + '.</p>'
      : '<button type="button" class="btn btn--accent" data-action="ids-check">' + C.icon('checklist') + '<span>Periksa Klasifikasi</span></button>';
  }

  function applyFilter() {
    var m = mod();
    var src = C.$('#ids-src', ui.root).value;
    var q = C.$('#ids-q', ui.root).value.trim().toLowerCase();
    var show = C.$('#ids-show', ui.root).value;
    var visible = 0;
    C.$$('.ids-row', ui.root).forEach(function (row) {
      var l = ID.lines.filter(function (x) { return x.id === row.getAttribute('data-line'); })[0];
      var ok = (src === 'all' || l.src === src) &&
        (!q || (l.text + ' ' + l.host + ' ' + l.time).toLowerCase().indexOf(q) >= 0) &&
        (show === 'all' || !m.labels[l.id]);
      row.hidden = !ok;
      if (ok) visible++;
    });
    var list = C.$('#ids-list', ui.root);
    var empty = C.$('.ids-empty', ui.root);
    if (!visible && !empty) list.insertAdjacentHTML('afterend', '<p class="empty ids-empty">Tidak ada baris yang cocok dengan filter.</p>');
    if (visible && empty) empty.remove();
  }

  function renderProgress() { C.$('#ids-progress', ui.root).innerHTML = C.page.progressCard(MOD); }

  function renderQuestions() {
    var m = mod();
    var el = C.$('#ids-q-card', ui.root);
    var head = '<header class="card-head"><div><h2 id="ids-qh">Prioritas Peringatan</h2><p class="card-sub">Tim keamanan harus memilih apa yang ditangani lebih dulu.</p></div></header>';
    if (!m.attempts) {
      el.innerHTML = head + '<p class="locked-note">' + C.icon('lock') + '<span>Terbuka setelah kamu memeriksa klasifikasi log minimal satu kali.</span></p>';
      return;
    }
    el.innerHTML = head + '<div class="q-stack">' + ID.questions.map(function (q, i) {
      return C.page.choice(q, { picked: m.answers[q.id], reveal: m.revealed, no: i + 1, name: 'iq-' + q.id });
    }).join('') + '</div><p class="field-err" id="iq-err" hidden></p>' +
      '<div class="actions-row">' + (m.revealed
        ? '<button type="button" class="btn btn--ghost" data-action="iq-retry">' + C.icon('reset') + '<span>Ulangi Pertanyaan</span></button>'
        : '<button type="button" class="btn btn--accent" data-action="iq-check">' + C.icon('checklist') + '<span>Periksa Jawaban</span></button>') + '</div>';
  }

  function check() {
    var m = mod();
    var missing = ID.lines.filter(function (l) { return !m.labels[l.id]; }).length;
    if (missing) {
      var err = C.$('#ids-err', ui.root);
      err.textContent = 'Masih ada ' + missing + ' baris yang belum ditandai. Pilih "Belum ditandai" pada filter Tampilkan untuk menemukannya.';
      err.hidden = false;
      return;
    }
    var correct = ID.lines.filter(function (l) { return m.labels[l.id] === (l.susp ? 'susp' : 'normal'); }).length;
    m.checked = true; m.last = correct; m.attempts++;
    m.best = Math.max(m.best, correct);
    C.log.add(MOD, correct >= PASS ? 'success' : 'warn', 'Klasifikasi log: ' + correct + ' dari ' + N + ' benar (percobaan ke-' + m.attempts + ').');
    C.store.commit('ids-check');
    renderList(); renderProgress(); renderQuestions();
    C.$('#ids-count', ui.root).scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'center' });
  }

  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || !ui || !ui.root.contains(btn) || btn.disabled) return;
    var m = mod();
    switch (btn.getAttribute('data-action')) {
      case 'ids-check': check(); break;
      case 'ids-retry': m.labels = {}; m.checked = false; C.store.commit('ids'); renderList(); break;
      case 'iq-check': {
        var missing = ID.questions.filter(function (q) { return !m.answers[q.id]; }).length;
        if (missing) { var er = C.$('#iq-err', ui.root); er.textContent = 'Jawab kedua pertanyaan dulu.'; er.hidden = false; return; }
        m.revealed = true;
        ID.questions.forEach(function (q) { if (m.answers[q.id] === q.answer) m.qBest[q.id] = true; });
        var c = ID.questions.filter(function (q) { return m.answers[q.id] === q.answer; }).length;
        C.log.add(MOD, c === 2 ? 'success' : 'warn', 'Prioritas peringatan: ' + c + ' dari 2 jawaban benar.');
        C.store.commit('iq'); renderQuestions(); renderProgress();
        break;
      }
      case 'iq-retry': m.answers = {}; m.revealed = false; C.store.commit('iq'); renderQuestions(); break;
      case 'module-reset': C.page.confirmReset(MOD, 'Simulasi Deteksi Intrusi', function () { if (ui) renderAll(); }); break;
      default: break;
    }
  }

  function onChange(e) {
    var t = e.target;
    var m = mod();
    if (t.hasAttribute('data-line') && t.type === 'radio') {
      if (m.checked) return;
      m.labels[t.getAttribute('data-line')] = t.value;
      var row = t.closest('.ids-row'); if (row) row.classList.add('is-labeled');
      C.store.commit('ids-label');
      renderCount();
      var err = C.$('#ids-err', ui.root); if (err) err.hidden = true;
      if (C.$('#ids-show', ui.root).value === 'todo') setTimeout(function () { if (ui) applyFilter(); }, 250);
    } else if (t.id === 'ids-src' || t.id === 'ids-show') applyFilter();
    else if (t.name && t.name.indexOf('iq-') === 0) {
      if (m.revealed) return;
      m.answers[t.getAttribute('data-q')] = t.value;
      C.$$('#ids-q-card [data-qid="' + t.getAttribute('data-q') + '"] .opt', ui.root).forEach(function (l) { l.classList.toggle('is-picked', l.querySelector('input').checked); });
      C.store.commit('iq');
    }
  }
  function onInput(e) { if (e.target.id === 'ids-q') applyFilter(); }

  function renderAll() { renderList(); renderProgress(); renderQuestions(); }

  function mount(root) {
    ui = { root: root };
    root.innerHTML = template();
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    root.addEventListener('input', onInput);
    renderAll();
  }
  function unmount() { ui = null; }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/ransomware.js">
/* ==========================================================================
   Menu 7 — Ransomware dan Backup
   Simulasi visual SAJA: berkas dummy berubah status menjadi ".locked".
   Tidak ada berkas nyata yang disentuh, tidak ada enkripsi sungguhan,
   dan tidak ada kode malware. Siswa berlatih: deteksi → isolasi →
   bersihkan sistem → pulihkan dari backup bersih → sambungkan kembali.
   Satu tick = 1 menit waktu simulasi (default 1,2 detik nyata).
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var esc = C.esc;
  var MOD = 'ransomware';
  var TICK_MS = 1200;
  var START_MIN = 9 * 60 + 12; // 09.12
  var ENC_EVERY = 2;           // satu berkas terkunci setiap 2 menit simulasi
  var SPREAD_FS = 5;           // menit setelah PC-TU terinfeksi
  var SPREAD_OTHERS = 4;       // menit setelah FILE-SERVER terinfeksi
  var CLEAN_TICKS = 3;

  var MACHINES = [
    { id: 'tu', name: 'PC-TU', role: 'Komputer Tata Usaha', files: ['Data_Siswa_2026.xlsx', 'Surat_Masuk_Okt.docx', 'Rekap_SPP_Okt.xlsx', 'Foto_Kegiatan.zip', 'Jadwal_Guru.pdf', 'Arsip_Surat.pdf'] },
    { id: 'fs', name: 'FILE-SERVER', role: 'Folder bersama sekolah', files: ['Nilai_XI_TKJ.xlsx', 'Materi_Jaringan.pptx', 'Absensi_Okt.xlsx', 'Modul_Ajar_TKJ.docx', 'Inventaris_Lab.xlsx', 'Kalender_Akademik.pdf'] },
    { id: 'kep', name: 'PC-KEPSEK', role: 'Komputer Kepala Sekolah', files: ['Laporan_BOS.xlsx', 'Notulen_Rapat.docx', 'SK_Pembagian_Tugas.pdf', 'Anggaran_2027.xlsx', 'Presentasi_Komite.pptx', 'Data_Guru.xlsx'] },
    { id: 'lab', name: 'PC-LAB-01', role: 'Komputer laboratorium', files: ['Tugas_Subnetting.docx', 'Topologi_Lab.pkt', 'Laporan_Praktik.pdf', 'Konfigurasi_Router.txt', 'Screenshot_Uji.png', 'Catatan_Kelompok.docx'] }
  ];

  var BACKUPS = [
    { id: 'b1', label: 'Backup harian, 8 Okt 2026 pukul 23.00', note: 'Dibuat malam sebelumnya.', kind: 'ok' },
    { id: 'b2', label: 'Backup otomatis, 9 Okt 2026 pukul 09.15', note: 'Dibuat otomatis pagi ini.', kind: 'locked' },
    { id: 'b3', label: 'Backup mingguan, 4 Okt 2026 pukul 23.00', note: 'Dibuat lima hari lalu.', kind: 'old' }
  ];

  function freshMachine() {
    return { connected: true, infected: false, infectedAt: null, enc: 0, cleaning: 0, cleaned: false, everIsolated: false, restore: null, restoreKind: null, everInfected: false };
  }
  function freshScenario() {
    var ms = {};
    MACHINES.forEach(function (x) { ms[x.id] = freshMachine(); });
    return { phase: 'idle', tick: 0, machines: ms, ransom: null, ransomShown: false, isoBeforeSpread: null, restoreBeforeClean: false, reconnectInfected: false, events: [], result: null };
  }
  function fresh() { return { scn: freshScenario(), best: 0, bestInd: { iso: false, ransom: false, backup: false }, runs: 0 }; }
  function valid(m) { return m && m.scn && m.scn.machines && MACHINES.every(function (x) { return m.scn.machines[x.id]; }); }
  C.store.registerModule(MOD, fresh, valid);

  C.store.registerScore(MOD, function (m) {
    var ind = [
      { label: 'Isolasi PC sumber infeksi sebelum penyebaran ke perangkat lain.', met: m.bestInd.iso },
      { label: 'Tidak membayar tebusan.', met: m.bestInd.ransom },
      { label: 'Semua berkas dummy pulih dari backup bersih terbaru.', met: m.bestInd.backup }
    ];
    return {
      earned: m.best, max: 100, label: 'Ransomware dan Backup',
      done: ind.filter(function (x) { return x.met; }).length, total: ind.length,
      started: m.runs > 0 || m.scn.phase !== 'idle',
      tuntas: ind.every(function (x) { return x.met; }), indicators: ind
    };
  });

  var ui = null;
  function mod() { return C.store.mod(MOD); }
  function scn() { return mod().scn; }
  function mdef(id) { return MACHINES.filter(function (x) { return x.id === id; })[0]; }

  function clock(t) {
    var min = START_MIN + t;
    return String(Math.floor(min / 60)).padStart(2, '0') + '.' + String(min % 60).padStart(2, '0');
  }

  function event(level, text) {
    var s = scn();
    s.events.unshift({ t: s.tick, level: level, text: text });
    if (s.events.length > 40) s.events.length = 40;
  }

  /* ---------- Mesin skenario ---------- */
  function infect(id) {
    var s = scn();
    var x = s.machines[id];
    if (x.infected) return;
    x.infected = true; x.everInfected = true; x.infectedAt = s.tick; x.cleaned = false;
  }

  function tick() {
    var s = scn();
    if (s.phase !== 'running') return;
    s.tick++;
    MACHINES.forEach(function (d) {
      var x = s.machines[d.id];
      if (x.cleaning > 0) {
        x.cleaning--;
        if (x.cleaning === 0) {
          if (x.infected) { x.infected = false; event('success', d.name + ' selesai dibersihkan. Malware dihapus, tetapi berkas yang terkunci perlu dipulihkan dari backup.'); }
          else event('info', d.name + ' selesai diperiksa. Tidak ditemukan malware.');
          x.cleaned = true;
        }
        return;
      }
      if (x.infected && (s.tick - x.infectedAt) % ENC_EVERY === 0 && x.enc < 6) {
        x.enc++;
        if (x.enc === 6) event('bad', 'Semua berkas di ' + d.name + ' sudah terkunci.');
      }
    });
    var tu = s.machines.tu, fs = s.machines.fs;
    if (tu.infected && tu.connected && fs.connected && !fs.infected && s.tick - tu.infectedAt >= SPREAD_FS) {
      infect('fs');
      if (s.isoBeforeSpread === null) s.isoBeforeSpread = false;
      event('bad', 'Ransomware menyebar dari PC-TU ke FILE-SERVER melalui folder bersama.');
    }
    if (fs.infected && fs.connected) {
      ['kep', 'lab'].forEach(function (id) {
        var x = s.machines[id];
        if (x.connected && !x.infected && !x.cleaned && s.tick - fs.infectedAt >= SPREAD_OTHERS) {
          infect(id);
          event('bad', 'Ransomware menyebar dari FILE-SERVER ke ' + mdef(id).name + '.');
        }
      });
    }
    if (!s.ransomShown && tu.enc >= 2) {
      s.ransomShown = true;
      s.phase = 'paused';
      stopTimer();
      event('bad', 'Catatan tebusan muncul di layar PC-TU. Simulasi dijeda sampai kamu mengambil keputusan.');
    }
    C.store.commit('rw-tick');
    renderAll(true);
  }

  function startTimer() { stopTimer(); ui.timer = setInterval(tick, TICK_MS); }
  function stopTimer() { if (ui && ui.timer) { clearInterval(ui.timer); ui.timer = 0; } }

  function start() {
    var m = mod();
    m.scn = freshScenario();
    var s = m.scn;
    s.phase = 'running';
    infect('tu');
    event('info', 'Pukul 09.12 staf TU membuka lampiran email "Rekap_SPP.pdf.exe" di PC-TU.');
    event('warn', 'Peringatan antivirus: PC-TU mengubah banyak berkas dalam waktu singkat. Kemungkinan ransomware.');
    C.log.add(MOD, 'info', 'Skenario ransomware dimulai.');
    C.store.commit('rw-start');
    startTimer();
    renderAll();
  }

  function setPhase(p) {
    var s = scn();
    s.phase = p;
    if (p === 'running') startTimer(); else stopTimer();
    C.store.commit('rw-phase');
    renderAll();
  }

  /* ---------- Tindakan siswa ---------- */
  function toggleNet(id) {
    var s = scn();
    var x = s.machines[id];
    var d = mdef(id);
    if (x.connected) {
      x.connected = false; x.everIsolated = true;
      if (id === 'tu' && s.isoBeforeSpread === null) s.isoBeforeSpread = !s.machines.fs.infected;
      event(x.infected ? 'success' : 'info', d.name + ' diisolasi dari jaringan' + (x.infected ? '. Penyebaran dari perangkat ini terhenti.' : ' (perangkat ini belum terinfeksi).'));
    } else {
      if (x.infected) {
        s.reconnectInfected = true;
        event('bad', d.name + ' disambungkan kembali padahal masih terinfeksi. Malware bisa menyebar lagi.');
      } else if (x.cleaning > 0) {
        event('warn', d.name + ' disambungkan saat pembersihan belum selesai.');
      } else {
        event('info', d.name + ' disambungkan kembali ke jaringan.');
      }
      x.connected = true;
    }
    C.store.commit('rw-net');
    renderAll();
  }

  function clean(id) {
    var s = scn();
    var x = s.machines[id];
    var d = mdef(id);
    if (x.connected) { event('warn', 'Isolasi ' + d.name + ' dulu sebelum dibersihkan agar malware tidak menyebar selama proses.'); renderAll(); return; }
    if (s.phase !== 'running') { event('warn', 'Lanjutkan simulasi agar proses pembersihan berjalan.'); }
    x.cleaning = CLEAN_TICKS;
    event('info', 'Membersihkan ' + d.name + ' (instal ulang sistem dan pindai malware), butuh ' + CLEAN_TICKS + ' menit.');
    C.store.commit('rw-clean');
    renderAll();
  }

  function restore(id, bid) {
    var s = scn();
    var x = s.machines[id];
    var d = mdef(id);
    var b = BACKUPS.filter(function (k) { return k.id === bid; })[0];
    if (!b) return;
    if (x.cleaning > 0) { event('warn', 'Tunggu pembersihan ' + d.name + ' selesai sebelum memulihkan berkas.'); renderAll(); return; }
    if (x.infected) {
      s.restoreBeforeClean = true;
      x.enc = 0; x.restore = bid; x.restoreKind = b.kind;
      x.infectedAt = s.tick;
      event('bad', 'Berkas ' + d.name + ' dipulihkan, tetapi malware masih aktif sehingga berkas akan terkunci lagi. Bersihkan sistem lebih dulu.');
    } else if (b.kind === 'locked') {
      x.enc = 6; x.restore = bid; x.restoreKind = 'locked';
      event('bad', 'Backup 09.15 dibuat setelah infeksi dimulai, sehingga berkas di dalamnya sudah terkunci. Pilih backup sebelum pukul 09.12.');
    } else if (b.kind === 'old') {
      x.enc = 0; x.restore = bid; x.restoreKind = 'old';
      event('warn', 'Berkas ' + d.name + ' pulih dari backup 4 Oktober. Perubahan lima hari terakhir hilang.');
    } else {
      x.enc = 0; x.restore = bid; x.restoreKind = 'ok';
      event('success', 'Berkas ' + d.name + ' pulih dari backup bersih terbaru (8 Okt 23.00).');
    }
    C.store.commit('rw-restore');
    renderAll();
  }

  function decideRansom(pay) {
    var s = scn();
    s.ransom = pay ? 'paid' : 'refused';
    if (pay) {
      event('bad', 'Tebusan dibayar (simulasi). Penyerang tidak mengirim kunci, dan tidak ada jaminan data kembali. Lanjutkan penanganan.');
      C.log.add(MOD, 'warn', 'Siswa memilih membayar tebusan pada simulasi ransomware.');
    } else {
      event('success', 'Tebusan ditolak. Penanganan dilanjutkan dengan isolasi dan pemulihan dari backup.');
    }
    s.phase = 'running';
    C.store.commit('rw-ransom');
    startTimer();
    renderAll();
  }

  /* ---------- Penilaian ---------- */
  function evaluate() {
    var s = scn();
    var infected = MACHINES.filter(function (d) { return s.machines[d.id].everInfected; });
    var tu = s.machines.tu;
    var items = [];
    var iso = s.isoBeforeSpread === true ? 25 : tu.everIsolated ? 10 : 0;
    items.push({ label: 'Isolasi PC-TU', pts: iso, max: 25,
      note: s.isoBeforeSpread === true ? 'PC-TU diisolasi sebelum ransomware menyebar.' : tu.everIsolated ? 'PC-TU diisolasi setelah ransomware sempat menyebar.' : 'PC-TU tidak pernah diisolasi.' });
    var allIso = infected.every(function (d) { return s.machines[d.id].everIsolated; });
    items.push({ label: 'Isolasi semua perangkat terinfeksi', pts: allIso ? 10 : 0, max: 10,
      note: allIso ? 'Semua perangkat yang terinfeksi sempat diisolasi (' + infected.length + ' perangkat).' : 'Ada perangkat terinfeksi yang tidak diisolasi.' });
    items.push({ label: 'Keputusan tebusan', pts: s.ransom === 'paid' ? 0 : 15, max: 15,
      note: s.ransom === 'paid' ? 'Membayar tebusan tidak menjamin data kembali dan mendanai penjahat.' : 'Tidak membayar tebusan.' });
    var restored = infected.filter(function (d) { return s.machines[d.id].restore; });
    var order = restored.length > 0 && !s.restoreBeforeClean;
    items.push({ label: 'Urutan bersihkan lalu pulihkan', pts: order ? 15 : 0, max: 15,
      note: s.restoreBeforeClean ? 'Ada pemulihan sebelum sistem dibersihkan.' : restored.length ? 'Sistem dibersihkan sebelum berkas dipulihkan.' : 'Belum ada berkas yang dipulihkan.' });
    var kinds = infected.map(function (d) { return s.machines[d.id].restoreKind; });
    var allOk = infected.length > 0 && kinds.every(function (k) { return k === 'ok'; }) && infected.every(function (d) { return s.machines[d.id].enc === 0; });
    var anyLocked = kinds.some(function (k) { return k === 'locked' || k === null; }) || infected.some(function (d) { return s.machines[d.id].enc > 0; });
    var bk = allOk ? 25 : (!anyLocked && kinds.some(function (k) { return k === 'old'; })) ? 10 : 0;
    items.push({ label: 'Pemilihan backup', pts: bk, max: 25,
      note: allOk ? 'Semua berkas pulih dari backup bersih terbaru.' : bk === 10 ? 'Berkas pulih, tetapi sebagian dari backup lama sehingga ada data yang hilang.' : 'Masih ada berkas terkunci atau dipulihkan dari backup yang sudah terinfeksi.' });
    var healthy = MACHINES.every(function (d) { var x = s.machines[d.id]; return x.connected && !x.infected && x.cleaning === 0 && x.enc === 0; });
    items.push({ label: 'Layanan kembali normal', pts: healthy ? 10 : 0, max: 10,
      note: healthy ? 'Semua perangkat bersih, berkas utuh, dan terhubung kembali.' : 'Belum semua perangkat bersih, utuh, dan tersambung kembali.' });
    var total = items.reduce(function (a, b) { return a + b.pts; }, 0);
    var locked = MACHINES.reduce(function (a, d) { return a + s.machines[d.id].enc; }, 0);
    return { items: items, total: total, infected: infected.length, lockedFiles: locked, ind: { iso: s.isoBeforeSpread === true, ransom: s.ransom !== 'paid', backup: allOk } };
  }

  function finish() {
    var m = mod();
    var s = m.scn;
    stopTimer();
    s.phase = 'finished';
    s.result = evaluate();
    m.runs++;
    m.best = Math.max(m.best, s.result.total);
    m.bestInd.iso = m.bestInd.iso || s.result.ind.iso;
    m.bestInd.ransom = m.bestInd.ransom || (s.result.ind.ransom && s.result.total > 0);
    m.bestInd.backup = m.bestInd.backup || s.result.ind.backup;
    C.log.add(MOD, s.result.total >= 75 ? 'success' : 'warn', 'Penanganan ransomware dinilai ' + s.result.total + '/100 (percobaan ke-' + m.runs + ').');
    C.store.commit('rw-finish');
    renderAll();
    var r = C.$('#rw-result', ui.root);
    if (r) r.scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  }

  /* ---------- Render ---------- */
  function template() {
    var meta = C.moduleMeta(MOD);
    return '<section class="page page--rw" aria-labelledby="page-title-' + MOD + '">' +
      C.page.head(meta, 'Sebuah komputer Tata Usaha terkena ransomware sintetis. Hentikan penyebarannya, bersihkan sistem, dan pulihkan berkas dummy dari backup yang tepat.', C.page.resetButton()) +
      '<p class="note">' + C.icon('shield') + ' Simulasi visual saja: berkas di sini hanya nama dummy yang berubah status. Tidak ada berkas nyata, enkripsi, atau malware sungguhan.</p>' +
      '<article class="card hud rw-control" id="rw-control"></article>' +
      '<div id="rw-ransom"></div>' +
      '<div class="rw-grid" id="rw-grid"></div>' +
      '<div class="two-col">' +
        '<article class="card" aria-labelledby="rw-bk-h">' +
          '<header class="card-head"><div><h2 id="rw-bk-h">Daftar Backup</h2><p class="card-sub">Infeksi dimulai pukul 09.12. Pilih backup dengan cermat.</p></div></header>' +
          '<ul class="bk-list">' + BACKUPS.map(function (b) {
            return '<li><strong>' + esc(b.label) + '</strong><span class="small muted">' + esc(b.note) + '</span></li>';
          }).join('') + '</ul>' +
          '<details class="learn"><summary><h3 class="h-sub">Langkah penanganan ransomware</h3></summary>' +
            '<ol class="learn-list">' +
              '<li><strong>Deteksi</strong> peringatan perubahan berkas massal.</li>' +
              '<li><strong>Isolasi</strong> perangkat terinfeksi dari jaringan secepatnya.</li>' +
              '<li><strong>Jangan bayar</strong> tebusan; tidak ada jaminan data kembali.</li>' +
              '<li><strong>Bersihkan</strong> sistem (instal ulang dan pindai) sebelum memulihkan.</li>' +
              '<li><strong>Pulihkan</strong> dari backup bersih terbaru, yaitu backup sebelum infeksi.</li>' +
              '<li><strong>Sambungkan kembali</strong> setelah perangkat bersih, lalu laporkan insiden.</li>' +
            '</ol></details>' +
        '</article>' +
        '<article class="card" id="rw-progress" aria-label="Indikator keberhasilan"></article>' +
      '</div>' +
      '<div id="rw-result"></div>' +
      C.page.cpCard(meta) +
    '</section>';
  }

  function renderControl() {
    var s = scn();
    var phaseTxt = { idle: 'Belum dimulai', running: 'Berjalan', paused: 'Dijeda', finished: 'Selesai dinilai' }[s.phase];
    var buttons = '';
    if (s.phase === 'idle' || s.phase === 'finished') {
      buttons = '<button type="button" class="btn btn--accent" data-action="rw-start">' + C.icon('play') + '<span>' + (s.phase === 'idle' ? 'Mulai Skenario' : 'Ulangi Skenario') + '</span></button>';
    } else {
      buttons = (s.phase === 'running'
          ? '<button type="button" class="btn btn--ghost" data-action="rw-pause">' + C.icon('pause') + '<span>Jeda</span></button>'
          : '<button type="button" class="btn btn--primary" data-action="rw-resume"' + (s.ransomShown && !s.ransom ? ' disabled' : '') + '>' + C.icon('play') + '<span>Lanjutkan</span></button>') +
        '<button type="button" class="btn btn--accent" data-action="rw-finish">' + C.icon('checklist') + '<span>Selesaikan dan Nilai Penanganan</span></button>';
    }
    C.$('#rw-control', ui.root).innerHTML =
      '<div class="rw-control__top">' +
        '<div class="rw-clock"><span class="small muted">Waktu simulasi</span><span class="rw-clock__t num">' + clock(s.tick) + '</span></div>' +
        '<div class="rw-phase"><span class="small muted">Status</span><span class="tag ' + (s.phase === 'running' ? 'tag--draft' : 'tag--muted') + '">' + phaseTxt + '</span></div>' +
        '<div class="actions-row rw-control__btns">' + buttons + '</div>' +
      '</div>' +
      '<ol class="rw-events" aria-live="polite">' + (s.events.length ? s.events.map(function (ev) {
        return '<li class="log log--' + (ev.level === 'bad' ? 'block' : ev.level) + '"><time class="log__t num">' + clock(ev.t) + '</time><span class="log__msg">' + esc(ev.text) + '</span></li>';
      }).join('') : '<li class="empty">Tekan Mulai Skenario. Setiap 1,2 detik nyata = 1 menit simulasi.</li>') + '</ol>';
  }

  function renderRansom() {
    var s = scn();
    var el = C.$('#rw-ransom', ui.root);
    if (!s.ransomShown || s.ransom || s.phase === 'finished') { el.innerHTML = ''; return; }
    el.innerHTML =
      '<article class="ransom" role="alertdialog" aria-labelledby="ransom-h" aria-describedby="ransom-d">' +
        '<h2 id="ransom-h">' + C.icon('lock') + ' Berkas Anda telah dikunci</h2>' +
        '<p id="ransom-d">Catatan sintetis di layar PC-TU: "Bayar tebusan dalam 48 jam untuk mendapatkan kunci. Jika tidak, berkas akan hilang selamanya." Apa keputusanmu?</p>' +
        '<div class="actions-row">' +
          '<button type="button" class="btn btn--primary" data-action="rw-refuse">Tolak dan lanjutkan penanganan</button>' +
          '<button type="button" class="btn btn--danger-ghost" data-action="rw-pay">Bayar tebusan</button>' +
        '</div>' +
      '</article>';
  }

  function statusOf(x) {
    if (x.cleaning > 0) return ['Dibersihkan (' + x.cleaning + ' menit lagi)', 'draft'];
    if (x.infected) return [x.enc === 6 ? 'Terinfeksi, semua berkas terkunci' : 'Terinfeksi', 'drop'];
    if (x.enc > 0) return [x.enc + ' berkas terkunci', 'drop'];
    if (x.restoreKind === 'old') return ['Pulih (versi lama)', 'muted'];
    if (x.restoreKind === 'ok') return ['Pulih', 'allow'];
    if (x.cleaned) return ['Bersih', 'allow'];
    return ['Normal', 'allow'];
  }

  function renderGrid(keepSelects) {
    var s = scn();
    var picked = {};
    if (keepSelects) C.$$('.rw-bk', ui.root).forEach(function (sel) { picked[sel.getAttribute('data-m')] = sel.value; });
    var active = s.phase === 'running' || s.phase === 'paused';
    C.$('#rw-grid', ui.root).innerHTML = MACHINES.map(function (d) {
      var x = s.machines[d.id];
      var st = statusOf(x);
      var files = d.files.map(function (f, i) {
        var locked = i < x.enc;
        return '<li class="file' + (locked ? ' is-locked' : '') + '">' + C.icon(locked ? 'lock' : 'report') +
          '<span>' + esc(f) + (locked ? '<b>.locked</b>' : '') + '</span></li>';
      }).join('');
      var sel = picked[d.id] || '';
      return '<article class="card machine' + (x.infected ? ' is-infected' : '') + (x.connected ? '' : ' is-isolated') + '" aria-labelledby="mc-' + d.id + '">' +
        '<header class="machine__head"><div><h3 id="mc-' + d.id + '">' + esc(d.name) + '</h3><p class="small muted">' + esc(d.role) + '</p></div>' +
          '<span class="tag tag--' + st[1] + '">' + esc(st[0]) + '</span></header>' +
        '<p class="machine__net ' + (x.connected ? 'is-on' : 'is-off') + '">' + '<span class="net-dot" aria-hidden="true"></span>' + (x.connected ? 'Terhubung ke jaringan sekolah' : 'Terisolasi dari jaringan') + '</p>' +
        '<ul class="files" aria-label="Berkas di ' + esc(d.name) + '">' + files + '</ul>' +
        '<div class="machine__acts">' +
          '<button type="button" class="btn btn--sm ' + (x.connected ? 'btn--danger-ghost' : 'btn--ghost') + '" data-action="rw-net" data-m="' + d.id + '"' + (active ? '' : ' disabled') + '>' + (x.connected ? 'Isolasi dari Jaringan' : 'Sambungkan Kembali') + '</button>' +
          '<button type="button" class="btn btn--sm btn--ghost" data-action="rw-clean" data-m="' + d.id + '"' + (active && x.cleaning === 0 ? '' : ' disabled') + '>Bersihkan Sistem</button>' +
        '</div>' +
        '<div class="machine__restore">' +
          '<label class="sr-only" for="rw-bk-' + d.id + '">Backup untuk ' + esc(d.name) + '</label>' +
          '<select id="rw-bk-' + d.id + '" class="input input--sm rw-bk" data-m="' + d.id + '"' + (active ? '' : ' disabled') + '>' +
            '<option value="">Pilih backup…</option>' + BACKUPS.map(function (b) { return '<option value="' + b.id + '"' + (sel === b.id ? ' selected' : '') + '>' + esc(b.label) + '</option>'; }).join('') +
          '</select>' +
          '<button type="button" class="btn btn--sm btn--primary" data-action="rw-restore" data-m="' + d.id + '"' + (active ? '' : ' disabled') + '>Pulihkan</button>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  function renderResult() {
    var s = scn();
    var el = C.$('#rw-result', ui.root);
    if (s.phase !== 'finished' || !s.result) { el.innerHTML = ''; return; }
    var r = s.result;
    el.innerHTML = '<article class="card hud" aria-labelledby="rw-res-h">' +
      '<header class="card-head"><div><h2 id="rw-res-h">Hasil Penanganan</h2><p class="card-sub">' + r.infected + ' perangkat sempat terinfeksi, ' + r.lockedFiles + ' berkas masih terkunci.</p></div>' +
        '<span class="score-pill num">' + r.total + '<small>/100</small></span></header>' +
      '<div class="table-scroll"><table class="tbl"><thead><tr><th scope="col">Aspek</th><th scope="col">Poin</th><th scope="col">Catatan</th></tr></thead><tbody>' +
        r.items.map(function (it) {
          return '<tr><td>' + esc(it.label) + '</td><td class="num"><strong class="' + (it.pts === it.max ? 'text-ok' : 'text-warn') + '">' + it.pts + '</strong>/' + it.max + '</td><td>' + esc(it.note) + '</td></tr>';
        }).join('') +
      '</tbody></table></div>' +
      '<p class="small muted">Tekan Ulangi Skenario untuk mencoba lagi. Skor terbaik yang dicatat di laporan.</p>' +
    '</article>';
  }

  function renderProgress() { C.$('#rw-progress', ui.root).innerHTML = C.page.progressCard(MOD); }

  function renderAll(fromTick) {
    if (!ui) return;
    renderControl();
    renderRansom();
    renderGrid(true);
    if (!fromTick) { renderResult(); renderProgress(); }
  }

  /* ---------- Event ---------- */
  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || !ui || !ui.root.contains(btn) || btn.disabled) return;
    var id = btn.getAttribute('data-m');
    switch (btn.getAttribute('data-action')) {
      case 'rw-start': start(); break;
      case 'rw-pause': setPhase('paused'); break;
      case 'rw-resume': setPhase('running'); break;
      case 'rw-finish':
        C.ui.confirm({ title: 'Selesaikan penanganan?', body: 'Simulasi dihentikan dan penanganan dinilai berdasarkan kondisi saat ini.', confirmLabel: 'Nilai Penanganan', tone: 'primary' })
          .then(function (ok) { if (ok && ui) finish(); });
        break;
      case 'rw-net': toggleNet(id); break;
      case 'rw-clean': clean(id); break;
      case 'rw-restore': {
        var sel = C.$('#rw-bk-' + id, ui.root);
        if (!sel.value) { event('warn', 'Pilih backup untuk ' + mdef(id).name + ' terlebih dahulu.'); renderAll(); sel.focus(); return; }
        restore(id, sel.value);
        break;
      }
      case 'rw-refuse': decideRansom(false); break;
      case 'rw-pay':
        C.ui.confirm({ title: 'Bayar tebusan?', body: 'Ini hanya simulasi. Pikirkan lagi: apakah membayar menjamin berkas kembali?', confirmLabel: 'Tetap bayar', cancelLabel: 'Batal', tone: 'danger' })
          .then(function (ok) { if (ok && ui) decideRansom(true); });
        break;
      case 'module-reset':
        if (scn().phase === 'running') setPhase('paused');
        C.page.confirmReset(MOD, 'Ransomware dan Backup', function () { if (ui) { stopTimer(); renderAll(); } });
        break;
      default: break;
    }
  }

  function mount(root) {
    ui = { root: root, timer: 0 };
    var s = scn();
    if (s.phase === 'running') { s.phase = 'paused'; C.store.commit('rw-phase'); }
    root.innerHTML = template();
    root.addEventListener('click', onClick);
    renderAll();
  }
  function unmount() {
    if (!ui) return;
    stopTimer();
    var s = scn();
    if (s.phase === 'running') { s.phase = 'paused'; C.store.commit('rw-phase'); }
    ui = null;
  }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/respons-insiden.js">
/* ==========================================================================
   Menu 8 — Respons Insiden
   (A) Urutkan enam tindakan sesuai tahapan respons insiden.
   (B) Isi laporan insiden berdasarkan bukti, lalu terima umpan balik.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var R = C.InsidenData;
  var F = R.form;
  var esc = C.esc;
  var MOD = 'respons-insiden';
  var CORRECT = R.steps.map(function (s) { return s.id; });

  function initialOrder() {
    var o = C.page.seededShuffle(CORRECT, 11);
    if (o.join() === CORRECT.join()) o.reverse();
    return o;
  }
  function freshForm() {
    return { jenis: '', mulai: '', deteksi: '', sistem: [], dampak: '', kronologi: '', penahanan: [], rekomendasi: [], pelapor: '' };
  }
  function fresh() {
    return {
