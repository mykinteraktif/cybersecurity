/* ==========================================================================
   Token desain + dasar tipografi
   Konsep: ruang kendali keamanan (security operations) — navy pekat,
   biru sebagai warna kerja, kuning sebagai aksen tindakan utama.
   Tampilan sengaja satu tema (gelap) agar konsisten di proyektor kelas.
   ========================================================================== */
:root {
  color-scheme: dark;

  /* Warna dasar */
  --navy-950: #050d1c;
  --navy-900: #081630;
  --navy-850: #0b1d3d;
  --navy-800: #10264c;
  --navy-700: #183462;
  --line: #1d3b69;
  --line-strong: #2c5592;

  --white: #eef4ff;
  --text: #e6eefc;
  --text-2: #a9bddc;
  --text-3: #7f97bd;

  --blue: #3b8cff;
  --blue-strong: #2470ef;
  --blue-300: #8dbbff;
  --blue-soft: rgba(59, 140, 255, 0.14);

  --yellow: #ffc93c;
  --yellow-strong: #ffb703;
  --yellow-soft: rgba(255, 201, 60, 0.14);

  /* Warna semantik (terpisah dari aksen) */
  --ok: #34e0a1;
  --ok-soft: rgba(52, 224, 161, 0.14);
  --bad: #ff5c73;
  --bad-soft: rgba(255, 92, 115, 0.14);
  --warn: #ff9a3d;
  --warn-soft: rgba(255, 154, 61, 0.15);

  /* Kertas laporan (tampilan cetak) */
  --paper: #ffffff;
  --ink: #0d1a30;
  --ink-2: #46546d;
  --paper-line: #c7d1e2;
  --paper-accent: #1f5fd1;

  /* Permukaan */
  --bg: var(--navy-950);
  --surface: var(--navy-900);
  --surface-2: var(--navy-850);
  --surface-3: var(--navy-800);

  /* Tipografi */
  --font-display: "Chakra Petch", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;

  /* Skala: 12 / 13.5 / 15 / 17 / 20 / 26 / 34 */
  --fs-xs: 0.8rem;
  --fs-sm: 0.9rem;
  --fs-md: 1rem;
  --fs-lg: 1.133rem;
  --fs-xl: 1.333rem;
  --fs-2xl: 1.733rem;
  --fs-3xl: clamp(1.75rem, 1.25rem + 1.6vw, 2.27rem);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --gap: 16px;
  --sidebar-w: 280px;
  --shadow: 0 10px 30px rgba(1, 6, 18, 0.45);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  font-size: 15px;
}

body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Kisi halus ala layar pemantauan */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(1200px 600px at 78% -10%, rgba(59, 140, 255, 0.16), transparent 60%),
    linear-gradient(rgba(141, 187, 255, 0.045) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, rgba(141, 187, 255, 0.045) 1px, transparent 1px) 0 0 / 32px 32px,
    var(--bg);
}

h1, h2, h3, h4 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.2;
  color: var(--white);
  text-wrap: balance;
}
h1 { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: 0.005em; }
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-lg); }
h4 { font-size: var(--fs-md); }

p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--blue-300); }
a:hover { color: var(--white); }
strong { color: var(--white); font-weight: 600; }
small { font-size: 0.78em; color: var(--text-2); font-weight: 400; }

code, .mono {
  font-family: var(--font-mono);
  font-size: 0.86em;
}
code {
  color: var(--blue-300);
  overflow-wrap: anywhere;
}

.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: var(--fs-sm); }
.text-ok { color: var(--ok); }
.text-warn { color: var(--warn); }

:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: 2px;
}
#view:focus { outline: none; }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute;
  left: 12px; top: -60px;
  z-index: 100;
  padding: 10px 14px;
  background: var(--yellow);
  color: var(--navy-950);
  font-weight: 600;
  border-radius: var(--r-sm);
  text-decoration: none;
}
.skip-link:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

.noscript {
  margin: 24px;
  padding: 16px;
  border: 1px solid var(--warn);
  border-radius: var(--r-md);
}

[hidden] { display: none !important; }

.ico {
  width: 18px; height: 18px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ico--xl { width: 44px; height: 44px; stroke-width: 1.4; }
.ico--accent { color: var(--yellow); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>

/* ==========================================================================
   Kerangka aplikasi: sidebar menu, topbar status, area konten, footer
   ========================================================================== */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 14px calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, var(--navy-900), var(--navy-950));
  border-right: 1px solid var(--line);
  overflow-y: auto;
  z-index: 40;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 6px 16px;
  border-bottom: 1px solid var(--line);
}
.brand__mark { width: 40px; height: 44px; flex: none; }
.brand__shield { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
.brand__bricks { fill: none; stroke: var(--yellow); stroke-width: 1.8; stroke-linecap: round; }
.brand__text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.brand__name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.1;
  color: var(--white);
  letter-spacing: 0.02em;
}
.brand__sub {
  font-family: var(--font-display);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--yellow);
  letter-spacing: 0.08em;
}

.nav { flex: 1; }
.nav__list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.nav__item {
  display: grid;
  grid-template-columns: 22px 20px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--r-sm);
  color: var(--text-2);
  text-decoration: none;
  font-size: var(--fs-sm);
  font-weight: 500;
  border: 1px solid transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.nav__item:hover { background: var(--surface-2); color: var(--white); }
.nav__item .ico { width: 18px; height: 18px; }
.nav__no {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-3);
  text-align: right;
}
.nav__label { line-height: 1.3; overflow-wrap: anywhere; }
.nav__item.is-active {
  background: linear-gradient(90deg, var(--blue-soft), transparent);
  border-color: var(--line);
  color: var(--white);
  box-shadow: inset 3px 0 0 var(--yellow);
}
.nav__item.is-active .nav__no { color: var(--yellow); }
.nav__item.is-active .ico { color: var(--blue-300); }
.nav__chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 999px;
  color: var(--yellow);
  border: 1px solid rgba(255, 201, 60, 0.4);
  white-space: nowrap;
}
.nav__chip:empty { display: none; }
.nav__chip--done { color: var(--ok); border-color: rgba(52, 224, 161, 0.45); background: var(--ok-soft); padding: 2px 5px; }
.nav__chip .ico { width: 13px; height: 13px; stroke-width: 2.4; }

.sidebar__foot { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.credit { font-size: var(--fs-xs); color: var(--text-3); line-height: 1.45; padding: 0 4px; }

.scrim { display: none; }

/* ---------- Area utama ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 10px 28px;
  background: rgba(5, 13, 28, 0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .topbar__menu { display: none; }
.topbar__title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--fs-lg);
  color: var(--white);
}
.topbar__title span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar__no {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--yellow);
}
.topbar__chips { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.view {
  flex: 1;
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding-block: 24px 40px;
  padding-inline: 28px;
}
.view-host { min-width: 0; }

.foot {
  padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-inline: 28px;
  border-top: 1px solid var(--line);
  color: var(--text-3);
  font-size: var(--fs-xs);
}

/* ---------- Kepala halaman ---------- */
.page { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 6px;
}
.page-head__text { display: flex; flex-direction: column; gap: 8px; max-width: 70ch; min-width: 0; }
.page-head__actions { display: flex; gap: 8px; flex-wrap: wrap; }
.page-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--fs-sm);
  color: var(--text-2);
  font-weight: 500;
}
.page-kicker__no {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--navy-950);
  background: var(--yellow);
  padding: 2px 8px;
  border-radius: 3px;
  font-weight: 500;
}
.page-lede { color: var(--text-2); max-width: 68ch; }

/* ---------- Responsif ---------- */
@media (max-width: 1024px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: min(300px, 86vw);
    height: 100%;
    transform: translateX(-102%);
    transition: transform 0.22s ease;
    box-shadow: var(--shadow);
  }
  .app.nav-open .sidebar { transform: none; }
  .scrim {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 35;
    background: rgba(2, 7, 18, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .app.nav-open .scrim { opacity: 1; pointer-events: auto; }
  .topbar .topbar__menu { display: inline-flex; }
  .topbar { padding: 8px 16px; }
  .view { padding-block: 18px 32px; padding-inline: 16px; }
  .foot { padding-inline: 16px; }
}

@media (max-width: 560px) {
  .topbar__title { font-size: var(--fs-md); }
  .topbar__title .topbar__no { display: none; }
  .chip__k { display: none; }
  .chip--user { display: none; }
}

</style>
  <style data-file="css/components.css">
/* ==========================================================================
   Komponen umum
   ========================================================================== */

/* ---------- Tombol ---------- */
.btn {
  --btn-bg: transparent;
  --btn-fg: var(--text);
  --btn-bd: var(--line-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 16px;
  border: 1px solid var(--btn-bd);
  border-radius: var(--r-sm);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font: 600 var(--fs-sm)/1.2 var(--font-body);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.08s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { border-color: var(--blue-300); color: var(--white); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn .ico { width: 17px; height: 17px; }

.btn--primary { --btn-bg: var(--blue-strong); --btn-bd: var(--blue); --btn-fg: #fff; }
.btn--primary:hover { --btn-bg: var(--blue); border-color: var(--blue-300); }
.btn--accent { --btn-bg: var(--yellow); --btn-bd: var(--yellow); --btn-fg: var(--navy-950); }
.btn--accent:hover { --btn-bg: var(--yellow-strong); color: var(--navy-950); border-color: var(--yellow-strong); }
.btn--ghost { --btn-bg: rgba(16, 38, 76, 0.5); }
.btn--ghost:hover { --btn-bg: var(--surface-3); }
.btn--danger { --btn-bg: var(--bad); --btn-bd: var(--bad); --btn-fg: #2a0610; }
.btn--danger:hover { --btn-bg: #ff7a8d; color: #2a0610; border-color: #ff7a8d; }
.btn--danger-ghost { --btn-fg: #ffb3bd; --btn-bd: rgba(255, 92, 115, 0.45); }
.btn--danger-ghost:hover { --btn-bg: var(--bad-soft); color: #ffd6dc; border-color: var(--bad); }
.btn--sm { min-height: 32px; padding: 5px 11px; font-size: var(--fs-xs); }
.btn--sm .ico { width: 15px; height: 15px; }
.btn--block { width: 100%; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.icon-btn:hover:not(:disabled) { color: var(--white); border-color: var(--blue-300); background: var(--surface-3); }
.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.icon-btn--danger:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }

/* ---------- Kartu ---------- */
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
  padding: 18px;
  background: linear-gradient(180deg, rgba(16, 38, 76, 0.55), rgba(8, 22, 48, 0.85));
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
/* Sudut penanda HUD — hanya untuk panel utama */
.hud::before,
.hud::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  pointer-events: none;
}
.hud::before { top: -1px; left: -1px; border-top: 2px solid var(--yellow); border-left: 2px solid var(--yellow); border-top-left-radius: var(--r-md); }
.hud::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--blue); border-right: 2px solid var(--blue); border-bottom-right-radius: var(--r-md); }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.card-head > div:first-child { min-width: 0; flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px; }
.card-sub { color: var(--text-2); font-size: var(--fs-sm); }
.card-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.h-sub {
  font-family: var(--font-display);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--blue-300);
  letter-spacing: 0.03em;
}

/* ---------- Tag, level, chip ---------- */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--font-display);
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1.5;
  white-space: nowrap;
  border: 1px solid transparent;
}
.tag--allow { color: var(--ok); background: var(--ok-soft); border-color: rgba(52, 224, 161, 0.35); }
.tag--drop { color: var(--bad); background: var(--bad-soft); border-color: rgba(255, 92, 115, 0.35); }
.tag--muted { color: var(--text-2); background: rgba(127, 151, 189, 0.12); border-color: var(--line); font-weight: 600; letter-spacing: 0.02em; }
.tag--ready { color: var(--ok); background: var(--ok-soft); border-color: rgba(52, 224, 161, 0.35); letter-spacing: 0.02em; }
.tag--draft { color: var(--yellow); background: var(--yellow-soft); border-color: rgba(255, 201, 60, 0.4); letter-spacing: 0.02em; }
.tag--lg { font-size: var(--fs-xs); padding: 5px 10px; }

.level {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 9px;
  border-radius: 4px;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.level::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.level--low { color: var(--ok); background: var(--ok-soft); }
.level--mid { color: var(--warn); background: var(--warn-soft); }
.level--high { color: var(--bad); background: var(--bad-soft); }
.level--high::before { animation: pulse 1.4s ease-in-out infinite; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: var(--fs-xs);
  color: var(--text-2);
  white-space: nowrap;
}
.chip b { color: var(--yellow); font-weight: 600; font-size: var(--fs-sm); }
.chip--user { color: var(--white); }

.score-pill {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--fs-xl);
  color: var(--yellow);
  padding: 2px 12px;
  border: 1px solid rgba(255, 201, 60, 0.4);
  border-radius: var(--r-sm);
  background: var(--yellow-soft);
  line-height: 1.3;
}

@keyframes pulse { 50% { opacity: 0.35; } }

/* ---------- Form ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field > label, .field > legend { font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); letter-spacing: 0.02em; padding: 0; }
.field--inline { flex-direction: row; align-items: center; gap: 8px; }
.input {
  width: 100%;
  min-height: 40px;
  padding: 8px 11px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--navy-950);
  color: var(--white);
  font: 400 var(--fs-sm)/1.3 var(--font-body);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input.mono { font-family: var(--font-mono); font-size: 0.86rem; }
.input::placeholder { color: var(--text-3); opacity: 1; }
.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 140, 255, 0.25); }
.input:disabled { opacity: 0.55; cursor: not-allowed; }
.input[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.input--sm { min-height: 32px; padding: 4px 8px; font-size: var(--fs-xs); width: auto; }
select.input { cursor: pointer; }
.field-err { color: #ff8a9b; font-size: var(--fs-xs); line-height: 1.4; }
.field-help { color: var(--text-3); font-size: var(--fs-xs); line-height: 1.4; }

/* Segmented control */
.seg {
  display: inline-flex;
  padding: 3px;
  gap: 3px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--navy-950);
}
.seg__btn, .seg__opt span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 30px;
  padding: 4px 12px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text-3);
  font: 700 0.76rem/1 var(--font-display);
  letter-spacing: 0.06em;
  cursor: pointer;
}
.seg__btn:hover, .seg__opt:hover span { color: var(--white); }
.seg__btn--allow.is-on { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1px rgba(52, 224, 161, 0.45); }
.seg__btn--drop.is-on { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1px rgba(255, 92, 115, 0.45); }
.seg__opt { position: relative; display: inline-flex; }
.seg__opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg__opt--allow input:checked + span { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1px rgba(52, 224, 161, 0.45); }
.seg__opt--drop input:checked + span { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1px rgba(255, 92, 115, 0.45); }
.seg__opt input:focus-visible + span { outline: 2px solid var(--yellow); outline-offset: 1px; }

.switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
.switch input { position: absolute; z-index: 1; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch__track {
  width: 38px; height: 22px;
  border-radius: 999px;
  background: var(--navy-700);
  border: 1px solid var(--line-strong);
  position: relative;
  transition: background 0.15s;
}

  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;

  background: var(--text-3);

  align-items: center;
  gap: 10px;

  background: var(--blue-soft);
  border: 1px solid rgba(59, 140, 255, 0.3);
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.note--draft { background: var(--yellow-soft); border-color: rgba(255, 201, 60, 0.35); color: #f4e2b0; }

.empty { color: var(--text-3); font-size: var(--fs-sm); list-style: none; padding: 6px 0; }

.plain-list { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--text-2); }
.plain-list li::marker { color: var(--blue-300); }

/* Tabel */

.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }

.bar { display: block; height: 6px; border-radius: 999px; background: var(--navy-700); overflow: hidden; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--yellow)); border-radius: inherit; transition: width 0.4s ease; }
.pips { display: flex; gap: 4px; }
.pips i { flex: 1; height: 6px; border-radius: 2px; background: var(--navy-700); }
.pips i.on { background: var(--ok); }
.pips i.off-bad { background: var(--bad); opacity: 0.75; }

.log-list {

.log--allow { border-left-color: var(--ok); } .log--allow .log__lv { color: var(--ok); }
.log--block { border-left-color: var(--bad); } .log--block .log__lv { color: var(--bad); }

.log-list--compact { max-height: none; }

.toasts {
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 8px;

.toast {

.toast--success { border-left-color: var(--ok); }
.toast--warn { border-left-color: var(--warn); }
.toast--error { border-left-color: var(--bad); }
.toast__msg { flex: 1; min-width: 0; }
.toast__close {

.toast__close:hover { color: var(--white); background: var(--navy-700); }
.toast.is-leaving { opacity: 0; transform: translateY(6px); transition: opacity 0.2s, transform 0.2s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Dialog ---------- */
.dialog {
  width: min(460px, calc(100vw - 32px));
  padding: 0;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);

.dialog__inner { display: flex; flex-direction: column; gap: 14px; padding: 22px; }
.dialog__title { font-size: var(--fs-xl); }
.dialog--danger .dialog__title { color: #ffc2cb; }
.dialog--warn .dialog__title { color: var(--yellow); }
.dialog__body { color: var(--text-2); display: flex; flex-direction: column; gap: 10px; }
.dialog__actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dialog__text {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  background: var(--navy-950);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 8px;
}

.burst circle { fill: none; stroke: var(--bad); stroke-width: 2; }
.burst path { stroke: var(--bad); stroke-width: 2.6; stroke-linecap: round; }

  };

  C.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function pad(n) { return String(n).padStart(2, '0'); }

  };

    var last = 0, timer = null;
    return function () {
      var now = Date.now();
      var remaining = wait - (now - last);
      if (remaining <= 0) { last = now; fn(); }
      else if (!timer) {
        timer = setTimeout(function () { timer = null; last = Date.now(); fn(); }, remaining);

    };
  };

  <script data-file="js/core/store.js">
/* ==========================================================================
   Store: satu sumber state untuk seluruh aplikasi.
   - Disimpan di localStorage (kunci csvl.state.v1); jika tidak tersedia,
     aplikasi tetap berjalan dan progres hanya bertahan selama halaman terbuka.
   - Setiap modul mendaftarkan state awal, validator, dan fungsi skornya sendiri.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var KEY = 'csvl.state.v1';
  var VERSION = 1;
  var LOG_MAX = 250;

  var factories = {};   // id -> { factory, validate }
  var scorers = {};     // id -> fn(moduleState) -> { earned, max, done, total, label }
  var state = null;
  var saveTimer = null;
  var persistent = true;

  function base() {
    return {
      version: VERSION,
      createdAt: Date.now(),
      student: { nama: '', kelas: '', absen: '' },
      log: [],
      modules: {}
    };
  }

  function freshModule(id) { return factories[id].factory(); }

  function hydrate(saved) {
    var s = base();
    Object.keys(factories).forEach(function (id) { s.modules[id] = freshModule(id); });
    if (!saved || typeof saved !== 'object' || saved.version !== VERSION) return s;

    if (saved.createdAt) s.createdAt = saved.createdAt;
    if (saved.student && typeof saved.student === 'object') {
      ['nama', 'kelas', 'absen'].forEach(function (k) {
        if (typeof saved.student[k] === 'string') s.student[k] = saved.student[k].slice(0, 80);
      });
    }
    if (Array.isArray(saved.log)) {
      s.log = saved.log.filter(function (e) { return e && typeof e.msg === 'string'; }).slice(0, LOG_MAX);
    }
    Object.keys(factories).forEach(function (id) {
      var old = saved.modules && saved.modules[id];
      var f = factories[id];
      if (old && typeof old === 'object' && (!f.validate || f.validate(old))) {
        s.modules[id] = Object.assign(freshModule(id), old);
      }
    });
    return s;
  }

  function writeNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!state) return;
    persistent = C.storage.set(KEY, JSON.stringify(state));
  }

  function scheduleSave() {
    if (saveTimer) return;
    saveTimer = setTimeout(writeNow, 200);
  }

  var store = {
    LOG_MAX: LOG_MAX,

    registerModule: function (id, factory, validate) {
      factories[id] = { factory: factory, validate: validate };
    },
    registerScore: function (id, fn) { scorers[id] = fn; },

    init: function () {
      var saved = null;
      var raw = C.storage.get(KEY);
      if (raw) { try { saved = JSON.parse(raw); } catch (e) { saved = null; } }
      state = hydrate(saved);
      writeNow();
      window.addEventListener('pagehide', writeNow);
      window.addEventListener('beforeunload', writeNow);
    },

    get state() { return state; },
    get persistent() { return persistent; },

    mod: function (id) {
      if (!state.modules[id]) state.modules[id] = freshModule(id);
      return state.modules[id];
    },

    commit: function (reason) {
      scheduleSave();
      C.bus.emit('change', { reason: reason || '' });
    },

    saveNow: writeNow,

    resetModule: function (id) {
      state.modules[id] = freshModule(id);
      writeNow();
      C.bus.emit('change', { reason: 'reset-module', id: id });
    },

    resetAll: function () {
      var fresh = base();
      Object.keys(factories).forEach(function (id) { fresh.modules[id] = freshModule(id); });
      state = fresh;
      writeNow();
      C.bus.emit('change', { reason: 'reset-all' });
    },

    score: function () {
      var earned = 0, max = 0, parts = {};
      Object.keys(scorers).forEach(function (id) {
        var r = scorers[id](store.mod(id));
        parts[id] = r;
        earned += r.earned;
        max += r.max;
      });
      return { earned: earned, max: max, parts: parts };
    }
  };

  C.store = store;
})();

</script>
  <script data-file="js/core/logger.js">
/* ==========================================================================
   Log peristiwa global. Setiap modul menulis ke sini; Dashboard dan
   halaman modul menampilkan log sesuai filter.
   level: info | allow | block | warn | success
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;

  var LEVELS = {
    info: 'Info',
    allow: 'Diizinkan',
    block: 'Diblokir',
    warn: 'Peringatan',
    success: 'Berhasil'
  };

  C.log = {
    LEVELS: LEVELS,

    add: function (module, level, msg) {
      var s = C.store.state;
      var entry = { t: Date.now(), module: module, level: LEVELS[level] ? level : 'info', msg: String(msg) };
      s.log.unshift(entry);
      if (s.log.length > C.store.LOG_MAX) s.log.length = C.store.LOG_MAX;
      C.store.commit('log');
      C.bus.emit('log', entry);
      return entry;
    },

    list: function (module, level) {
      return C.store.state.log.filter(function (e) {
        return (!module || e.module === module) && (!level || level === 'all' || e.level === level);
      });
    },

    clear: function (module) {
      var s = C.store.state;
      s.log = module ? s.log.filter(function (e) { return e.module !== module; }) : [];
      C.store.commit('log-clear');
    },

    toText: function (entries) {
      return entries.slice().reverse().map(function (e) {
        return '[' + C.dateStr(e.t) + '] [' + (LEVELS[e.level] || e.level).toUpperCase() + '] ' + e.msg;
      }).join('\n');
    }
  };
})();

</script>
  <script data-file="js/core/ui.js">
/* ==========================================================================
   Komponen UI umum: toast, dialog konfirmasi (tanpa window.confirm),
   dan salin teks ke clipboard.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var esc = C.esc;

  function toast(msg, opts) {
    opts = opts || {};
    var wrap = document.getElementById('toasts');
    if (!wrap) return;
    var el = document.createElement('div');
    var type = opts.type || 'info';
    el.className = 'toast toast--' + type;
    el.setAttribute('role', type === 'warn' || type === 'error' ? 'alert' : 'status');
    el.innerHTML =
      '<span class="toast__msg">' + esc(msg) + '</span>' +
      (opts.action ? '<button type="button" class="btn btn--sm btn--ghost toast__act">' + esc(opts.action.label) + '</button>' : '') +
      '<button type="button" class="toast__close" aria-label="Tutup notifikasi">' + C.icon('x') + '</button>';

    var closed = false;
    function close() {
      if (closed) return;
      closed = true;
      el.classList.add('is-leaving');
      setTimeout(function () { el.remove(); }, 220);
    }
    el.querySelector('.toast__close').addEventListener('click', close);
    if (opts.action) {
      el.querySelector('.toast__act').addEventListener('click', function () { opts.action.fn(); close(); });
    }
    wrap.appendChild(el);
    while (wrap.children.length > 4) wrap.firstElementChild.remove();
    setTimeout(close, opts.timeout || (opts.action ? 6500 : 4200));
  }

  /* Dialog konfirmasi berbasis <dialog>. Mengembalikan Promise<boolean>. */
  function confirmDialog(o) {
    return new Promise(function (resolve) {
      var dlg = document.getElementById('dialog');
      if (!dlg) { resolve(false); return; }
      var tone = o.tone || 'primary';
      dlg.className = 'dialog dialog--' + tone;
      var confirmCls = tone === 'danger' ? 'btn--danger' : tone === 'warn' ? 'btn--accent' : 'btn--primary';
      dlg.innerHTML =
        '<form method="dialog" class="dialog__inner">' +
          '<h2 class="dialog__title" id="dialog-title">' + esc(o.title) + '</h2>' +
          '<div class="dialog__body">' + (o.html || '<p>' + esc(o.body || '') + '</p>') + '</div>' +
          '<div class="dialog__actions">' +
            (o.hideCancel ? '' : '<button value="cancel" class="btn btn--ghost">' + esc(o.cancelLabel || 'Batal') + '</button>') +
            '<button value="confirm" class="btn ' + confirmCls + '">' + esc(o.confirmLabel || 'Lanjutkan') + '</button>' +
          '</div>' +
        '</form>';

      var native = typeof dlg.showModal === 'function';
      var settled = false;
      function finish(val) {
        if (settled) return;
        settled = true;
        dlg.removeEventListener('close', onClose);
        resolve(val);
      }
      function onClose() { finish(dlg.returnValue === 'confirm'); }
      dlg.returnValue = '';
      dlg.addEventListener('close', onClose);

      if (!native) {
        C.$$('button[value]', dlg).forEach(function (b) {
          b.addEventListener('click', function (ev) {
            ev.preventDefault();
            dlg.removeAttribute('open');
            finish(b.value === 'confirm');
          });
        });
        dlg.setAttribute('open', '');
      } else {
        dlg.showModal();
      }
      var first = dlg.querySelector('button[value="cancel"]') || dlg.querySelector('button[value="confirm"]');
      if (first) first.focus();
    });
  }

  function showText(title, text) {
    return confirmDialog({
      title: title,
      html: '<p>Salin otomatis tidak tersedia di browser ini. Pilih teks di bawah lalu salin secara manual.</p>' +
            '<textarea class="dialog__text" id="dlg-copy-text" readonly rows="8">' + esc(text) + '</textarea>',
      confirmLabel: 'Tutup',
      hideCancel: true
    });
  }

  function copyText(text) {
    // writeText dipanggil langsung di dalam handler klik (sebelum await apa pun)
    var p = null;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) p = navigator.clipboard.writeText(text);
    } catch (e) { p = null; }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        ta.remove();
        if (ok) return true;
      } catch (e) { /* lanjut ke salin manual */ }
      showText('Salin manual', text);
      return false;
    }
    if (!p) return Promise.resolve(fallback());
    return p.then(function () { return true; }, function () { return fallback(); });
  }

  C.ui = { toast: toast, confirm: confirmDialog, copyText: copyText, showText: showText };
})();

</script>

   Setiap tampilan: { mount(hostElement), unmount() }.

(function () {
  'use strict';
  var C = window.CSVL;

  var router = {
    routes: {},
    currentId: null,
    currentView: null,
    host: null,

    register: function (id, view) { this.routes[id] = view; },

    parse: function () {
      var id = (window.location.hash || '').replace(/^#\/?/, '').trim();
      return this.routes[id] ? id : 'dashboard';
    },

    start: function () {
      var self = this;
      window.addEventListener('hashchange', function () { self.resolve(); });
      this.resolve();
    },

    go: function (id) {
      if (!this.routes[id]) id = 'dashboard';
      if (window.location.hash === '#' + id) this.resolve(true);
      else window.location.hash = id;
    },

    reload: function () { this.resolve(true); },

    resolve: function (force) {
      var id = this.parse();
      if (!force && id === this.currentId && this.host) return;

      if (this.currentView && typeof this.currentView.unmount === 'function') {
        try { this.currentView.unmount(); } catch (e) { console.error('[CSVL router] unmount', e); }
      }
      var viewEl = document.getElementById('view');
      viewEl.innerHTML = '';
      this.host = document.createElement('div');
      this.host.className = 'view-host';
      viewEl.appendChild(this.host);

      this.currentId = id;
      this.currentView = this.routes[id];
      try {
        this.currentView.mount(this.host);
      } catch (e) {
        console.error('[CSVL router] mount', e);
        this.host.innerHTML = '<div class="card"><h2>Halaman gagal dimuat</h2><p>Muat ulang halaman. Jika masih gagal, gunakan tombol Reset Semua Data.</p></div>';
      }

      var meta = (C.MODULES || []).filter(function (m) { return m.id === id; })[0];
      document.title = (meta ? meta.title + ' — ' : '') + 'Cyber Security Virtual Lab';
      C.bus.emit('route', { id: id, meta: meta });
      window.scrollTo(0, 0);
      try { viewEl.focus({ preventScroll: true }); } catch (e) { viewEl.focus(); }
    }
  };

  C.router = router;
})();

</script>

  <script data-file="js/engine/firewall-engine.js">
/* ==========================================================================
   Mesin Firewall — logika murni tanpa DOM dan tanpa koneksi jaringan.
   Paket hanyalah objek data: { src, dst, protocol, port }.
   Bisa dipakai di browser (window.CSVL.FirewallEngine) maupun Node.js (uji unit).
   ========================================================================== */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) { root.CSVL = root.CSVL || {}; root.CSVL.FirewallEngine = api; }
})(typeof window !== 'undefined' ? window : null, function () {
  'use strict';

  var PROTOCOLS = ['TCP', 'UDP', 'ICMP', 'ANY'];
  var ACTION_LABEL = { ALLOW: 'IZINKAN', DROP: 'BLOKIR' };
  var DECISION_LABEL = { ALLOW: 'DIIZINKAN', DROP: 'DIBLOKIR' };

  /* ---------- Alamat IPv4 ---------- */
  function ipToInt(ip) {
    var parts = String(ip).trim().split('.');
    if (parts.length !== 4) return null;
    var n = 0;
    for (var i = 0; i < 4; i++) {
      if (!/^\d{1,3}$/.test(parts[i])) return null;
      var v = Number(parts[i]);
      if (v > 255) return null;
      n = n * 256 + v;
    }
    return n;
  }

  function intToIp(n) {
    return [24, 16, 8, 0].map(function (s) { return (n >>> s) & 255; }).join('.');
  }

  function isAnyWord(s) {
    var u = String(s == null ? '' : s).trim().toUpperCase();
    return u === 'ANY' || u === '*' || u === 'SEMUA';
  }

  /* Hasil: { any:true, text:'ANY' } | { any:false, network, mask, prefix, text } | { error } */
  function parseAddress(input) {
    var raw = String(input == null ? '' : input).trim();
    if (raw === '') return { error: 'Alamat wajib diisi. Tulis ANY untuk semua alamat.' };
    if (isAnyWord(raw) || raw === '0.0.0.0/0') return { any: true, text: 'ANY' };
    var m = raw.match(/^(\d{1,3}(?:\.\d{1,3}){3})(?:\/(\d{1,2}))?$/);
    if (!m) return { error: '"' + raw + '" bukan alamat IPv4 yang valid. Contoh: 172.16.20.10 atau 192.168.10.0/24.' };
    var ip = ipToInt(m[1]);
    if (ip === null) return { error: 'Setiap bagian alamat "' + raw + '" harus bernilai 0 sampai 255.' };
    var prefix = m[2] === undefined ? 32 : Number(m[2]);
    if (prefix > 32) return { error: 'Prefix CIDR harus di antara 0 dan 32.' };
    var mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32 - prefix)) >>> 0;
    var network = (ip & mask) >>> 0;
    if (network !== ip) {
      return { error: raw + ' bukan alamat jaringan yang tepat. Untuk /' + prefix + ' gunakan ' + intToIp(network) + '/' + prefix + '.' };
    }
    return { any: false, network: network, mask: mask, prefix: prefix, text: prefix === 32 ? m[1] : m[1] + '/' + prefix };
  }

  function matchAddress(addr, ipInt) {
    if (addr.any) return true;
    if (ipInt === null || ipInt === undefined) return false;
    return ((ipInt & addr.mask) >>> 0) === addr.network;
  }

  /* ---------- Port ---------- */
  /* Hasil: { any:true, text:'ANY' } | { any:false, ranges:[[a,b]], text } | { error } */
  function parsePorts(input) {
    var raw = String(input == null ? '' : input).trim();
    if (raw === '' || isAnyWord(raw)) return { any: true, text: 'ANY' };
    var parts = raw.split(',').map(function (p) { return p.trim(); }).filter(Boolean);
    var ranges = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var m = p.match(/^(\d{1,5})(?:\s*-\s*(\d{1,5}))?$/);
      if (!m) return { error: 'Port "' + p + '" tidak dikenali. Gunakan angka (80), daftar (80,443), rentang (1024-65535), atau ANY.' };
      var a = Number(m[1]);
      var b = m[2] === undefined ? a : Number(m[2]);
      if (a < 1 || a > 65535 || b < 1 || b > 65535) return { error: 'Nomor port harus di antara 1 dan 65535.' };
      if (b < a) return { error: 'Rentang ' + p + ' terbalik. Tulis angka kecil lebih dulu, misalnya ' + b + '-' + a + '.' };
      ranges.push([a, b]);
    }
    if (!ranges.length) return { any: true, text: 'ANY' };
    var text = ranges.map(function (r) { return r[0] === r[1] ? String(r[0]) : r[0] + '-' + r[1]; }).join(',');
    return { any: false, ranges: ranges, text: text };
  }

  function matchPort(spec, port) {
    if (spec.any) return true;
    if (port === null || port === undefined) return false;
    return spec.ranges.some(function (r) { return port >= r[0] && port <= r[1]; });
  }

  /* ---------- Validasi aturan ---------- */
  function validateRule(input) {
    input = input || {};
    var errors = {};
    var action = input.action === 'ALLOW' || input.action === 'DROP' ? input.action : null;
    if (!action) errors.action = 'Pilih aksi IZINKAN atau BLOKIR.';

    var protocol = String(input.protocol || '').toUpperCase();
    if (PROTOCOLS.indexOf(protocol) < 0) errors.protocol = 'Pilih protokol TCP, UDP, ICMP, atau ANY.';

    var src = parseAddress(input.src);
    if (src.error) errors.src = src.error;
    var dst = parseAddress(input.dst);
    if (dst.error) errors.dst = dst.error;

    var port = { any: true, text: 'ANY' };
    if (protocol === 'TCP' || protocol === 'UDP') {
      port = parsePorts(input.port);
      if (port.error) errors.port = port.error;
    } else if (protocol === 'ANY' && !isAnyWord(input.port) && String(input.port || '').trim() !== '') {
      errors.port = 'Port hanya berlaku untuk TCP atau UDP. Pilih protokol TCP/UDP, atau isi port dengan ANY.';
    }

    var note = String(input.note || '').trim().slice(0, 80);
    if (Object.keys(errors).length) return { ok: false, errors: errors };
    return {
      ok: true,
      rule: { action: action, protocol: protocol, src: src.text, dst: dst.text, port: port.text, note: note }
    };
  }

  var cache = {};
  var cacheSize = 0;
  function compileRule(rule) {
    var key = [rule.action, rule.protocol, rule.src, rule.dst, rule.port].join('|');
    if (cache[key]) return cache[key];
    var v = validateRule(rule);
    var out;
    if (!v.ok) out = { error: true };
    else {
      out = {
        action: v.rule.action,
        protocol: v.rule.protocol,
        src: parseAddress(v.rule.src),
        dst: parseAddress(v.rule.dst),
        port: v.rule.protocol === 'TCP' || v.rule.protocol === 'UDP' ? parsePorts(v.rule.port) : { any: true, text: 'ANY' }
      };
    }
    if (cacheSize > 500) { cache = {}; cacheSize = 0; }
    cache[key] = out;
    cacheSize++;
    return out;
  }

  function describeRule(rule) {
    var portTxt = rule.protocol === 'TCP' || rule.protocol === 'UDP' ? ' port ' + rule.port : '';
    return ACTION_LABEL[rule.action] + ' ' + rule.protocol + ' ' + rule.src + ' → ' + rule.dst + portTxt;
  }

  /* ---------- Evaluasi paket (first match) ----------
     Mengembalikan { decision, matchedNo, matchedId, byDefault, trace[] } */
  function evaluate(packet, rules, defaultPolicy) {
    var proto = String(packet.protocol).toUpperCase();
    var port = proto === 'ICMP' ? null : Number(packet.port);
    var srcInt = ipToInt(packet.src);
    var dstInt = ipToInt(packet.dst);
    var trace = [];
    var portLabel = proto === 'ICMP' ? 'ICMP' : proto + '/' + port;

    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      var no = i + 1;
      if (!r.enabled) {
        trace.push({ no: no, id: r.id, status: 'skip', reason: 'Aturan nonaktif, dilewati.' });
        continue;
      }
      var c = compileRule(r);
      if (c.error) {
        trace.push({ no: no, id: r.id, status: 'skip', reason: 'Aturan tidak valid, dilewati.' });
        continue;
      }
      if (c.protocol !== 'ANY' && c.protocol !== proto) {
        trace.push({ no: no, id: r.id, status: 'miss', reason: 'Protokol tidak cocok (aturan ' + c.protocol + ', paket ' + proto + ').' });
        continue;
      }
      if (!matchAddress(c.src, srcInt)) {
        trace.push({ no: no, id: r.id, status: 'miss', reason: 'Sumber ' + packet.src + ' tidak termasuk ' + c.src.text + '.' });
        continue;
      }
      if (!matchAddress(c.dst, dstInt)) {
        trace.push({ no: no, id: r.id, status: 'miss', reason: 'Tujuan ' + packet.dst + ' tidak termasuk ' + c.dst.text + '.' });
        continue;
      }
      if (!matchPort(c.port, port)) {
        trace.push({ no: no, id: r.id, status: 'miss', reason: 'Port ' + portLabel + ' tidak termasuk port ' + c.port.text + '.' });
        continue;
      }
      trace.push({ no: no, id: r.id, status: 'match', reason: 'Semua kondisi cocok, aksi ' + ACTION_LABEL[c.action] + '.' });
      return { decision: c.action, matchedNo: no, matchedId: r.id, byDefault: false, trace: trace };
    }

    var policy = defaultPolicy === 'ALLOW' ? 'ALLOW' : 'DROP';
    trace.push({ no: null, id: null, status: 'default', reason: 'Tidak ada aturan yang cocok, kebijakan default ' + ACTION_LABEL[policy] + ' berlaku.' });
    return { decision: policy, matchedNo: null, matchedId: null, byDefault: true, trace: trace };
  }

  function runTests(tests, rules, defaultPolicy) {
    return tests.map(function (t) {
      var r = evaluate(t.packet, rules, defaultPolicy);
      return { test: t, result: r, actual: r.decision, pass: r.decision === t.expect };
    });
  }

  return {
    PROTOCOLS: PROTOCOLS,
    ACTION_LABEL: ACTION_LABEL,
    DECISION_LABEL: DECISION_LABEL,
    ipToInt: ipToInt,
    intToIp: intToIp,
    parseAddress: parseAddress,
    parsePorts: parsePorts,
    validateRule: validateRule,
    compileRule: compileRule,
    describeRule: describeRule,
    evaluate: evaluate,
    runTests: runTests
  };
});

</script>
  <script data-file="js/engine/firewall-sim.js">
/* ==========================================================================
   Logika skenario Simulasi Firewall: menerjemahkan perangkat sintetis
   menjadi paket, menghitung tingkat ancaman, menguji misi, dan membuat
   lalu lintas acak. Tidak menyentuh DOM, penyimpanan, atau jaringan.
   ========================================================================== */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) {
    root.CSVL = root.CSVL || {};
    if (root.CSVL.FirewallEngine && root.CSVL.FirewallData) {
      root.CSVL.FirewallSim = api.create(root.CSVL.FirewallEngine, root.CSVL.FirewallData);
    }
  }
})(typeof window !== 'undefined' ? window : null, function () {
  'use strict';

  function create(E, D) {
    var nodeMap = {};
    D.nodes.forEach(function (n) { nodeMap[n.id] = n; });

    function node(id) { return nodeMap[id]; }

    function protoLabel(spec) {
      return spec.protocol === 'ICMP' ? 'ICMP' : spec.protocol + '/' + spec.port;
    }

    function describe(spec) {
      return node(spec.src).name + ' → ' + node(spec.dst).name + ' ' + protoLabel(spec);
    }

    function toPacket(spec) {
      return {
        src: node(spec.src).ip,
        dst: node(spec.dst).ip,
        protocol: spec.protocol,
        port: spec.protocol === 'ICMP' ? null : Number(spec.port)
      };
    }

    function sameZone(spec) { return node(spec.src).zone === node(spec.dst).zone; }

    function evaluate(spec, m) {
      if (sameZone(spec)) {
        return {
          decision: 'ALLOW', sameZone: true, byDefault: false, matchedNo: null, matchedId: null,
          trace: [{ no: null, status: 'info', reason: 'Sumber dan tujuan berada di zona yang sama, sehingga paket hanya lewat switch dan tidak diperiksa firewall.' }]
        };
      }
      var r = E.evaluate(toPacket(spec), m.rules, m.defaultPolicy);
      r.sameZone = false;
      return r;
    }

    function status(m) {
      var exposures = D.probes.filter(function (p) { return evaluate(p, m).decision === 'ALLOW'; });
      var services = D.healthChecks.map(function (s) {
        return { label: s.label, spec: s, up: evaluate(s, m).decision === 'ALLOW' };
      });
      var n = exposures.length;
      var levelKey = n === 0 ? 'low' : n <= 2 ? 'mid' : 'high';
      var level = { low: 'RENDAH', mid: 'SEDANG', high: 'TINGGI' }[levelKey];
      return {
        exposures: exposures,
        level: level,
        levelKey: levelKey,
        services: services,
        servicesUp: services.filter(function (s) { return s.up; }).length
      };
    }

    /* Uji misi ke-i beserta uji regresi misi sebelumnya */
    function testMission(index, m) {
      var results = [];
      for (var i = 0; i <= index; i++) {
        D.missions[i].tests.forEach(function (test, ti) {
          var r = evaluate(test, m);
          results.push({
            test: test, mission: i, testIndex: ti, regression: i < index,
            actual: r.decision, pass: r.decision === test.expect, result: r
          });
        });
      }
      var failed = results.filter(function (x) { return !x.pass; }).length;
      return { index: index, results: results, passed: failed === 0, failed: failed, total: results.length, at: Date.now() };
    }

    /* Audit: cek target setiap misi terhadap aturan saat ini */
    function audit(m) {
      return D.missions.map(function (ms, i) {
        var ok = ms.tests.filter(function (test) { return evaluate(test, m).decision === test.expect; }).length;
        return { index: i, title: ms.title, pass: ok === ms.tests.length, passCount: ok, total: ms.tests.length };
      });
    }

    function weighted(list, rand) {
      var total = list.reduce(function (s, x) { return s + x.w; }, 0);
      var r = rand() * total;
      for (var i = 0; i < list.length; i++) {
        r -= list[i].w;
        if (r < 0) return list[i];
      }
      return list[list.length - 1];
    }

    function randomPacket(rand) {
      rand = rand || Math.random;
      var threat = rand() < D.traffic.threatRatio;
      var pick = weighted(threat ? D.traffic.threat : D.traffic.legit, rand);
      var port = pick.protocol === 'ICMP' ? null
        : pick.ports ? pick.ports[Math.floor(rand() * pick.ports.length)] : pick.port;
      return { src: pick.src, dst: pick.dst, protocol: pick.protocol, port: port, threat: threat, tag: pick.tag };
    }

    return {
      node: node,
      nodes: D.nodes,
      describe: describe,
      protoLabel: protoLabel,
      toPacket: toPacket,
      sameZone: sameZone,
      evaluate: evaluate,
      status: status,
      testMission: testMission,
      audit: audit,
      randomPacket: randomPacket
    };
  }

  return { create: create };
});

    o = o || {};
    var name = o.name || ('q-' + q.id);
    var picked = o.picked;
    var reveal = !!o.reveal;
    var opts = q.options.map(function (op, i) {
      var cls = 'opt';
      if (picked === op.id) cls += ' is-picked';
      if (reveal && op.id === q.answer) cls += ' is-correct';
      if (reveal && picked === op.id && op.id !== q.answer) cls += ' is-wrong';
      return '<label class="' + cls + '">' +
        '<input type="radio" name="' + esc(name) + '" value="' + esc(op.id) + '"' + (picked === op.id ? ' checked' : '') + (o.disabled || reveal ? ' disabled' : '') + ' data-q="' + esc(q.id) + '">' +
        '<span class="opt__key" aria-hidden="true">' + KEYS[i] + '</span>' +
        '<span class="opt__text">' + esc(op.text) + '</span>' +
        (reveal && op.id === q.answer ? '<span class="opt__mark">' + C.icon('check') + '<span class="sr-only">Jawaban benar</span></span>' : '') +
        (reveal && picked === op.id && op.id !== q.answer ? '<span class="opt__mark">' + C.icon('x') + '<span class="sr-only">Jawaban kamu salah</span></span>' : '') +
      '</label>';
    }).join('');
    var verdict = '';
    if (reveal) {
      var right = picked === q.answer;
      verdict = '<div class="q__exp ' + (right ? 'is-right' : 'is-wrong') + '">' +
        '<p><strong>' + (right ? 'Benar.' : picked ? 'Belum tepat.' : 'Tidak dijawab.') + '</strong> ' + esc(q.explain) + '</p></div>';
    }
    var tid = 'qt-' + name;
    return '<fieldset class="q" data-qid="' + esc(q.id) + '" aria-labelledby="' + esc(tid) + '">' +
      '<p class="q__text" id="' + esc(tid) + '">' + (o.no ? '<span class="q__no num">' + o.no + '</span>' : '') + '<span>' + esc(q.text) + '</span></p>' +
      (q.context ? '<p class="q__ctx">' + esc(q.context) + '</p>' : '') +
      '<div class="q__opts">' + opts + '</div>' + verdict +
    '</fieldset>';
  }

  /* Konfirmasi + reset modul standar */
  function confirmReset(id, title, after) {
    C.ui.confirm({
      title: 'Reset ' + title + '?',
      body: 'Semua jawaban, skor, dan progres pada modul ini dikembalikan ke kondisi awal. Tindakan ini tidak bisa dibatalkan.',
      confirmLabel: 'Reset Modul',
      tone: 'danger'
    }).then(function (ok) {
      if (!ok) return;
      C.store.resetModule(id);
      C.log.add(id, 'info', title + ' direset ke kondisi awal.');
      C.ui.toast(title + ' direset.', { type: 'success' });
      if (after) after();
    });
  }

  /* Acak deterministik (agar urutan awal sama untuk semua siswa) */
  function seededShuffle(arr, seed) {
    var a = arr.slice();
    var s = seed || 7;
    for (var i = a.length - 1; i > 0; i--) {
      s = (s * 9301 + 49297) % 233280;
      var j = Math.floor(s / 233280 * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  C.page = {
    head: head,
    resetButton: resetButton,
    cpCard: cpCard,
    indicatorList: indicatorList,
    progressCard: progressCard,
    choice: choice,
    confirmReset: confirmReset,
    seededShuffle: seededShuffle
  };
})();

  <script data-file="js/components/topology.js">
/* ==========================================================================
   Diagram topologi jaringan (SVG) + animasi paket.
   Hanya visual: tidak ada koneksi jaringan. Paket bergerak dari perangkat
   sumber → switch/cloud → firewall → switch/cloud → perangkat tujuan.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var D = C.FirewallData;
  var esc = C.esc;

  function icon(kind) {
    switch (kind) {
      case 'pc':
        return '<rect class="i-body" x="-18" y="-15" width="36" height="24" rx="3"/>' +
               '<rect class="i-screen" x="-14" y="-11" width="28" height="16" rx="1.5"/>' +
               '<path class="i-line" d="M-7 13h14M0 9v4"/>';
      case 'attacker':
        return icon('pc') +
               '<path class="i-badge" d="M14 -27l9 15h-18z"/><path class="i-badge-mark" d="M14 -22v5M14 -14.6v.4"/>';
      case 'server':
        return '<rect class="i-body" x="-16" y="-17" width="32" height="10" rx="2"/>' +
               '<rect class="i-body" x="-16" y="-5" width="32" height="10" rx="2"/>' +
               '<rect class="i-body" x="-16" y="7" width="32" height="10" rx="2"/>' +
               '<circle class="i-led" cx="-10" cy="-12" r="1.7"/><circle class="i-led" cx="-10" cy="0" r="1.7"/><circle class="i-led" cx="-10" cy="12" r="1.7"/>' +
               '<path class="i-line" d="M-3 -12h13M-3 0h13M-3 12h13"/>';
      case 'db':
        return '<path class="i-body" d="M-15 -12v24c0 3.3 6.7 6 15 6s15-2.7 15-6v-24"/>' +
               '<ellipse class="i-body" cx="0" cy="-12" rx="15" ry="5.5"/>' +
               '<path class="i-line" d="M-15 0c0 3.3 6.7 6 15 6s15-2.7 15-6"/>';
      case 'user':
        return '<circle class="i-body" cx="0" cy="-8" r="7.5"/><path class="i-body" d="M-15 16c0-8.5 6.7-14 15-14s15 5.5 15 14z"/>';
      case 'cloud':
        return '<path class="i-body i-cloud" d="M-24 13h46a11 11 0 0 0 1-21.9 15 15 0 0 0-28.5-4.5A11.5 11.5 0 0 0-24 13z"/>' +
               '<text class="hub-label" x="0" y="7" text-anchor="middle">Internet</text>';
      case 'switch':
        return '<rect class="i-body" x="-21" y="-8" width="42" height="16" rx="3"/>' +
               '<path class="i-ports" d="M-13 0h.01M-6.5 0h.01M0 0h.01M6.5 0h.01M13 0h.01"/>';
      default:
        return '<circle class="i-body" r="12"/>';
    }
  }

  function markup(opts) {
    var L = D.layout;
    var fw = L.firewall;
    var vb = L.viewBox;
    var interactive = !!opts.onNodeClick;
    var s = [];
    s.push('<svg class="topo-svg' + (opts.compact ? ' topo-svg--compact' : '') + '" viewBox="0 0 ' + vb[0] + ' ' + vb[1] + '" role="img" aria-labelledby="' + opts.uid + '-t ' + opts.uid + '-d">');
    s.push('<title id="' + opts.uid + '-t">Topologi jaringan sekolah sintetis</title>');
    s.push('<desc id="' + opts.uid + '-d">Firewall FW-01 di tengah menghubungkan Internet, LAN Sekolah 192.168.10.0/24, DMZ Server 172.16.20.0/24, dan Zona Data 172.16.30.0/24.</desc>');

    // Zona
    s.push('<g class="zones">');
    L.zoneBoxes.forEach(function (z) {
      s.push('<g class="zone zone--' + z.zone.toLowerCase() + '"><rect x="' + z.x + '" y="' + z.y + '" width="' + z.w + '" height="' + z.h + '" rx="10"/>');
      z.labels.forEach(function (lb) {
        s.push('<text class="zone__' + lb.cls + '" x="' + lb.x + '" y="' + lb.y + '"' + (lb.anchor ? ' text-anchor="' + lb.anchor + '"' : '') + '>' + esc(lb.text) + '</text>');
      });
      s.push('</g>');
    });
    s.push('</g>');

    // Link: perangkat → hub, hub → firewall
    s.push('<g class="links">');
    D.nodes.forEach(function (n) {
      var h = L.hubs[n.zone];
      s.push('<line class="link" x1="' + n.x + '" y1="' + n.y + '" x2="' + h.x + '" y2="' + h.y + '"/>');
    });
    Object.keys(L.hubs).forEach(function (k) {
      var h = L.hubs[k];
      s.push('<line class="link link--trunk" x1="' + h.x + '" y1="' + h.y + '" x2="' + fw.x + '" y2="' + fw.y + '"/>');
    });
    s.push('</g>');

    // Hub
    s.push('<g class="hubs">');
    Object.keys(L.hubs).forEach(function (k) {
      var h = L.hubs[k];
      s.push('<g class="hub hub--' + h.kind + '" transform="translate(' + h.x + ' ' + h.y + ')">' + icon(h.kind) + '</g>');
    });
    s.push('</g>');

    // Pelat status firewall
    s.push('<g class="fw-plate" transform="translate(' + fw.x + ' 200)">' +
      '<rect x="-92" y="-13" width="184" height="26" rx="4"/>' +
      '<text x="-80" y="4.5" class="fw-plate__name">' + esc(fw.name) + '</text>' +
      '<text x="80" y="4.5" text-anchor="end" class="fw-plate__policy" data-fw-policy>Default BLOKIR</text>' +
      '</g>');

    // Firewall
    s.push('<g class="fw" data-fw transform="translate(' + fw.x + ' ' + fw.y + ')">' +
      '<circle class="fw__ring" r="42"/>' +
      '<rect class="fw__body" x="-30" y="-24" width="60" height="48" rx="4"/>' +
      '<path class="fw__bricks" d="M-30 -8h60M-30 8h60M-10 -24v16M10 -24v16M-20 -8v16M0 -8v16M20 -8v16M-10 8v16M10 8v16"/>' +
      '<text class="fw__count" y="62" text-anchor="middle" data-fw-rules>1 aturan aktif</text>' +
      '</g>');

    // Perangkat
    s.push('<g class="nodes">');
    D.nodes.forEach(function (n) {
      var right = n.label === 'right';
      var tx = right ? 32 : 0;
      var ty1 = right ? -3 : 42;
      var ty2 = right ? 12 : 57;
      var anchor = right ? 'start' : 'middle';
      var attrs = interactive
        ? ' tabindex="0" role="button" aria-label="' + esc(n.name + ', ' + n.ip + ', ' + D.zones[n.zone].label + '. Tekan untuk melihat detail.') + '"'
        : '';
      s.push('<g class="node node--' + n.kind + (interactive ? ' node--interactive' : '') + '" data-node="' + n.id + '" transform="translate(' + n.x + ' ' + n.y + ')"' + attrs + '>' +
        '<rect class="node__hit" x="-32" y="-28" width="64" height="56" rx="8"/>' +
        '<circle class="node__ring" r="27"/>' +
        '<g class="node__icon">' + icon(n.kind) + '</g>' +
        '<text class="node__name" x="' + tx + '" y="' + ty1 + '" text-anchor="' + anchor + '">' + esc(n.name) + '</text>' +
        '<text class="node__ip" x="' + tx + '" y="' + ty2 + '" text-anchor="' + anchor + '">' + esc(n.ip) + '</text>' +
        '</g>');
    });
    s.push('</g>');

    s.push('<g class="pkt-layer"></g><g class="burst-layer"></g>');
    s.push('</svg>');
    return s.join('');
  }

  /* ---------- Lintasan ---------- */
  function makePath(points) {
    var segs = [];
    var total = 0;
    for (var i = 0; i < points.length - 1; i++) {
      var a = points[i], b = points[i + 1];
      var len = Math.hypot(b.x - a.x, b.y - a.y);
      segs.push({ a: a, b: b, len: len, start: total });
      total += len;
    }
    return {
      total: total,
      at: function (d) {
        d = Math.max(0, Math.min(total, d));
        for (var i = 0; i < segs.length; i++) {
          var sg = segs[i];
          if (d <= sg.start + sg.len || i === segs.length - 1) {
            var t = sg.len === 0 ? 0 : (d - sg.start) / sg.len;
            return { x: sg.a.x + (sg.b.x - sg.a.x) * t, y: sg.a.y + (sg.b.y - sg.a.y) * t };
          }
        }
        return points[points.length - 1];
      },
      lengthTo: function (index) {
        var d = 0;
        for (var i = 0; i < index && i < segs.length; i++) d += segs[i].len;
        return d;
      }
    };
  }

  var uidCounter = 0;

  function create(container, opts) {
    opts = opts || {};
    opts.uid = 'topo' + (++uidCounter);
    container.innerHTML = markup(opts);
    var svg = container.querySelector('svg');
    var layer = svg.querySelector('.pkt-layer');
    var burstLayer = svg.querySelector('.burst-layer');
    var fwG = svg.querySelector('[data-fw]');
    var policyText = svg.querySelector('[data-fw-policy]');
    var rulesText = svg.querySelector('[data-fw-rules]');
    var nodeEls = {};
    C.$$('[data-node]', svg).forEach(function (g) { nodeEls[g.getAttribute('data-node')] = g; });

    var L = D.layout;
    var FW = { x: L.firewall.x, y: L.firewall.y };
    var reduce = C.reducedMotion();
    var speed = reduce ? 5000 : (opts.speed || 300);
    var holdMs = reduce ? 120 : 260;
    var packets = [];
    var raf = 0;
    var last = 0;
    var fwTimer = 0;
    var destroyed = false;
    var nodeTimers = {};

    function onActivate(e) {
      var g = e.target.closest ? e.target.closest('[data-node]') : null;
      if (!g) return;
      if (e.type === 'keydown') {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
      }
      opts.onNodeClick(g.getAttribute('data-node'));
    }
    if (opts.onNodeClick) {
      svg.addEventListener('click', onActivate);
      svg.addEventListener('keydown', onActivate);
    }

    function pointsFor(spec) {
      var a = C.FirewallSim.node(spec.src);
      var b = C.FirewallSim.node(spec.dst);
      var ha = L.hubs[a.zone];
      var hb = L.hubs[b.zone];
      if (a.zone === b.zone) return { pts: [a, ha, b], fwIndex: -1 };
      return { pts: [a, ha, FW, hb, b], fwIndex: 2 };
    }

    function flashFirewall(decision) {
      fwG.classList.remove('fw--allow', 'fw--block');
      // paksa reflow agar animasi bisa diulang
      void fwG.getBoundingClientRect();
      fwG.classList.add(decision === 'ALLOW' ? 'fw--allow' : 'fw--block');
      clearTimeout(fwTimer);
      fwTimer = setTimeout(function () { fwG.classList.remove('fw--allow', 'fw--block'); }, 650);
    }

    function flashNode(id, cls) {
      var g = nodeEls[id];
      if (!g) return;
      g.classList.remove('flash-ok', 'flash-bad');
      void g.getBoundingClientRect();
      g.classList.add(cls);
      clearTimeout(nodeTimers[id]);
      nodeTimers[id] = setTimeout(function () { g.classList.remove('flash-ok', 'flash-bad'); }, 750);
    }

    function burst(x, y) {
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'burst');
      g.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
      g.innerHTML = '<circle r="11"/><path d="M-6 -6L6 6M6 -6L-6 6"/>';
      burstLayer.appendChild(g);
      setTimeout(function () { g.remove(); }, 700);
    }

    /* variant: manual | legit | threat | test ; result: hasil evaluasi */
    function send(spec, result, o) {
      if (destroyed) return;
      o = o || {};
      var route = pointsFor(spec);
      var path = makePath(route.pts);
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'pkt pkt--' + (o.variant || 'legit'));
      g.innerHTML = '<circle class="pkt__halo" r="10"/><circle class="pkt__dot" r="5.5"/>' +
        (o.label ? '<text class="pkt__label" y="-12" text-anchor="middle">' + esc(o.label) + '</text>' : '');
      layer.appendChild(g);

      var stopAt = route.fwIndex < 0 ? path.total : Math.max(0, path.lengthTo(route.fwIndex) - 40);
      var p = {
        g: g, path: path, d: 0, stopAt: stopAt, state: 'go1', hold: 0, fade: 0,
        decision: result.decision, sameZone: route.fwIndex < 0, spec: spec, variant: o.variant || 'legit'
      };
      packets.push(p);
      if (packets.length > 45) {
        var old = packets.shift();
        old.g.remove();
      }
      place(p);
      if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
    }

    function place(p) {
      var pt = p.path.at(p.d);
      p.g.setAttribute('transform', 'translate(' + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1) + ')');
    }

    function arrive(p) {
      var bad = p.variant === 'threat';
      flashNode(p.spec.dst, bad ? 'flash-bad' : 'flash-ok');
    }

    function loop(now) {
      if (destroyed) return;
      var dt = last ? Math.min(64, now - last) : 16;
      last = now;
      var step = speed * dt / 1000;
      for (var i = packets.length - 1; i >= 0; i--) {
        var p = packets[i];
        if (p.state === 'go1') {
          p.d += step;
          if (p.d >= p.stopAt) {
            p.d = p.stopAt;
            if (p.sameZone) { p.state = 'done'; arrive(p); }
            else { p.state = 'hold'; p.hold = 0; flashFirewall(p.decision); }
          }
        } else if (p.state === 'hold') {
          p.hold += dt;
          if (p.hold >= holdMs) {
            if (p.decision === 'ALLOW') { p.state = 'go2'; p.g.classList.add('is-pass'); }
            else {
              p.state = 'drop';
              p.g.classList.add('is-drop');
              var pt = p.path.at(p.d);
              burst(pt.x, pt.y);
            }
          }
        } else if (p.state === 'go2') {
          p.d += step;
          if (p.d >= p.path.total) { p.d = p.path.total; p.state = 'done'; arrive(p); }
        } else if (p.state === 'drop') {
          p.fade += dt;
          p.g.style.opacity = String(Math.max(0, 1 - p.fade / 420));
          if (p.fade >= 420) p.state = 'done';
        }
        if (p.state === 'done') {
          p.g.remove();
          packets.splice(i, 1);
        } else {
          place(p);
        }
      }
      raf = packets.length ? requestAnimationFrame(loop) : 0;
    }

    function select(src, dst) {
      Object.keys(nodeEls).forEach(function (id) {
        nodeEls[id].classList.toggle('is-src', id === src);
        nodeEls[id].classList.toggle('is-dst', id === dst);
      });
    }

    function focusNode(id) {
      Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.toggle('is-focus', k === id); });
    }

    function setFirewall(policy, activeCount) {
      policyText.textContent = 'Default ' + (policy === 'ALLOW' ? 'IZINKAN' : 'BLOKIR');
      policyText.setAttribute('class', 'fw-plate__policy ' + (policy === 'ALLOW' ? 'is-allow' : 'is-drop'));
      rulesText.textContent = activeCount + ' aturan aktif';
    }

    function clear() {
      packets.forEach(function (p) { p.g.remove(); });
      packets = [];
    }

    function destroy() {
      destroyed = true;
      if (raf) cancelAnimationFrame(raf);
      clearTimeout(fwTimer);
      Object.keys(nodeTimers).forEach(function (k) { clearTimeout(nodeTimers[k]); });
      if (opts.onNodeClick) {
        svg.removeEventListener('click', onActivate);
        svg.removeEventListener('keydown', onActivate);
      }
      container.innerHTML = '';
    }

    return {
      send: send, select: select, focusNode: focusNode, setFirewall: setFirewall,
      flashNode: flashNode, clear: clear, destroy: destroy,
      get activeCount() { return packets.length; }
    };
  }

  C.Topology = { create: create };
})();

  <script data-file="js/modules/dashboard.js">
/* ==========================================================================
   Menu 1 — Dashboard
   Ringkasan status lab, identitas siswa, peta modul, pratinjau lalu lintas
   berdasarkan aturan firewall saat ini, dan log terbaru.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var esc = C.esc;

  var ui = null;

  function continueTarget() {
    var sc = C.store.score();
    var next = C.MODULES.filter(function (m) { return m.scored && !sc.parts[m.id].tuntas; })[0];
    if (!next) return { route: 'laporan', icon: 'report', label: 'Lihat Laporan Hasil Belajar' };
    var r = sc.parts[next.id];
    if (next.id === 'firewall') {
      var p = C.Firewall.progress();
      if (p.next >= 0 && p.done > 0) return { route: 'firewall', icon: 'firewall', label: 'Lanjutkan Misi ' + (p.next + 1) + ': ' + p.nextTitle };
    }
    return { route: next.id, icon: next.icon, label: (r.started ? 'Lanjutkan: ' : 'Mulai: ') + next.title };
  }

  function template() {
    var s = C.store.state.student;
    var cta = continueTarget();
    return '' +
    '<section class="page page--dash" aria-labelledby="dash-title">' +
      '<div class="dash-hero card hud">' +
        '<div class="dash-hero__text">' +
          '<p class="page-kicker"><span class="page-kicker__no">Lab Maya TKJ</span> Kelas XI</p>' +
          '<h1 id="dash-title" class="dash-title">Cyber Security Virtual Lab<span class="dash-title__sub">Attack &amp; Defense</span></h1>' +
