          '<p class="page-lede">Pelajari cara serangan siber bekerja dan latih langkah pertahanannya pada jaringan sekolah sintetis. Semua serangan di sini hanya simulasi di dalam browser.</p>' +
          '<div class="dash-hero__actions">' +
            '<button type="button" class="btn btn--accent" data-action="go" data-route="' + cta.route + '">' + C.icon(cta.icon) + '<span>' + esc(cta.label) + '</span></button>' +
            (cta.route !== 'laporan' ? '<a class="btn btn--ghost" href="#laporan">' + C.icon('report') + '<span>Lihat Laporan</span></a>' : '') +
          '</div>' +
        '</div>' +
        '<figure class="dash-hero__viz">' +
          '<div class="topo topo--mini" id="dash-topo"></div>' +
          '<figcaption class="viz-cap"><span>Pratinjau lalu lintas sesuai aturan firewall saat ini.</span>' +
            '<button type="button" class="btn btn--sm btn--ghost" data-action="preview-toggle" id="dash-preview-btn"></button></figcaption>' +
        '</figure>' +
      '</div>' +

      '<div class="dash-stats" id="dash-stats"></div>' +

      '<div class="dash-grid">' +
        '<section class="card dash-modules" aria-labelledby="dash-mod-h">' +
          '<header class="card-head"><div><h2 id="dash-mod-h">Modul Lab</h2>' +
            '<p class="card-sub">Ikuti urutan menu. Skor dan indikator setiap modul diperbarui otomatis.</p></div></header>' +
          '<div class="mod-grid" id="dash-mod-grid"></div>' +
        '</section>' +

        '<div class="dash-side">' +
          '<section class="card" aria-labelledby="dash-id-h">' +
            '<header class="card-head"><div><h2 id="dash-id-h">Identitas Siswa</h2>' +
              '<p class="card-sub">Dipakai pada Laporan Hasil Belajar. Disimpan hanya di browser perangkat ini.</p></div></header>' +
            '<form class="id-form" id="dash-id-form" novalidate>' +
              '<div class="field"><label for="id-nama">Nama lengkap</label><input id="id-nama" class="input" maxlength="80" autocomplete="name" value="' + esc(s.nama) + '"></div>' +
              '<div class="id-form__row">' +
                '<div class="field"><label for="id-kelas">Kelas</label><input id="id-kelas" class="input" maxlength="20" placeholder="XI TKJ 1" value="' + esc(s.kelas) + '"></div>' +
                '<div class="field"><label for="id-absen">No. absen</label><input id="id-absen" class="input" maxlength="3" inputmode="numeric" value="' + esc(s.absen) + '"></div>' +
              '</div>' +
              '<p class="field-err" id="id-err" hidden></p>' +
              '<button type="submit" class="btn btn--primary">' + C.icon('check') + '<span>Simpan Identitas</span></button>' +
            '</form>' +
          '</section>' +

          '<section class="card" aria-labelledby="dash-log-h">' +
            '<header class="card-head"><div><h2 id="dash-log-h">Log Terbaru</h2></div>' +
              '<a class="btn btn--sm btn--ghost" href="#laporan">Lihat laporan</a></header>' +
            '<ol class="log-list log-list--compact" id="dash-log"></ol>' +
          '</section>' +

          '<section class="card card--rules" aria-labelledby="dash-safe-h">' +
            '<header class="card-head"><div><h2 id="dash-safe-h">Aturan Main Lab</h2></div>' + C.icon('shield', 'ico--accent') + '</header>' +
            '<ul class="safe-list">' +
              '<li>Semua serangan hanya visualisasi dan logika di browser. Tidak ada koneksi ke host atau jaringan nyata.</li>' +
              '<li>Alamat IP, akun, email, dan paket adalah data sintetis.</li>' +
              '<li>Lab ini tidak pernah meminta kata sandi asli. Jangan menuliskannya di kolom mana pun.</li>' +
              '<li>Semua data simulasi bisa dikembalikan ke awal dengan tombol Reset Semua Data.</li>' +
            '</ul>' +
          '</section>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  function greet(s) {
    if (s.nama) return 'Selamat datang, <strong>' + esc(s.nama) + '</strong>' + (s.kelas ? ' (' + esc(s.kelas) + ')' : '') + '.';
    return 'Isi identitas di panel kanan agar namamu tercantum pada laporan.';
  }

  function renderStats() {
    var st = C.Firewall.status();
    var sc = C.store.score();
    var mods = C.MODULES.filter(function (m) { return m.scored; });
    var tuntas = mods.filter(function (m) { return sc.parts[m.id].tuntas; }).length;
    var pct = sc.max ? Math.round(sc.earned / sc.max * 100) : 0;
    C.$('#dash-stats', ui.root).innerHTML =
      '<div class="stat">' +
        '<span class="stat__k">Skor total</span>' +
        '<span class="stat__v num">' + sc.earned + '<small>/' + sc.max + '</small></span>' +
        '<span class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></span>' +
      '</div>' +
      '<div class="stat">' +
        '<span class="stat__k">Modul tuntas</span>' +
        '<span class="stat__v num">' + tuntas + '<small>/' + mods.length + ' modul</small></span>' +
        '<span class="pips" aria-hidden="true">' + mods.map(function (m) { var r = sc.parts[m.id]; return '<i class="' + (r.tuntas ? 'on' : r.started ? 'mid' : '') + '"></i>'; }).join('') + '</span>' +
      '</div>' +
      '<div class="stat">' +
        '<span class="stat__k">Tingkat ancaman jaringan</span>' +
        '<span class="stat__v"><span class="level level--' + st.levelKey + '">' + st.level + '</span></span>' +
        '<span class="stat__sub">' + st.exposures.length + ' celah terbuka pada aturan firewall saat ini</span>' +
      '</div>' +
      '<div class="stat">' +
        '<span class="stat__k">Layanan sah</span>' +
        '<span class="stat__v num">' + st.servicesUp + '<small>/' + st.services.length + ' berjalan</small></span>' +
        '<span class="pips" aria-hidden="true">' + st.services.map(function (s) { return '<i class="' + (s.up ? 'on' : 'off-bad') + '"></i>'; }).join('') + '</span>' +
      '</div>';
  }

  function pips(n, total) {
    var out = '';
    for (var i = 0; i < total; i++) out += '<i class="' + (i < n ? 'on' : '') + '"></i>';
    return out;
  }

  function renderModules() {
    var sc = C.store.score();
    C.$('#dash-mod-grid', ui.root).innerHTML = C.MODULES.filter(function (m) { return m.id !== 'dashboard'; }).map(function (m) {
      var r = m.scored ? sc.parts[m.id] : null;
      var tag = !r ? '<span class="tag tag--muted">Rekap</span>'
        : r.tuntas ? '<span class="tag tag--ready">Tuntas</span>'
        : r.started ? '<span class="tag tag--draft">Berjalan</span>'
        : '<span class="tag tag--muted">Belum mulai</span>';
      var prog = r
        ? '<span class="mod-tile__prog"><span class="bar" aria-hidden="true"><span style="width:' + Math.round(r.earned / r.max * 100) + '%"></span></span><span class="num">' + r.earned + '/' + r.max + '</span></span>'
        : '<span class="mod-tile__prog"><span class="num">' + sc.earned + '/' + sc.max + ' total</span></span>';
      return '<a class="mod-tile' + (r && r.tuntas ? ' is-done' : '') + '" href="#' + m.id + '">' +
        '<span class="mod-tile__top"><span class="mod-tile__no num">' + m.no + '</span>' + C.icon(m.icon) + tag + '</span>' +
        '<span class="mod-tile__title">' + esc(m.title) + '</span>' +
        '<span class="mod-tile__desc">' + esc(m.short) + '</span>' +
        prog +
      '</a>';
    }).join('');
  }

  function renderLog() {
    var list = C.store.state.log.slice(0, 6);
    C.$('#dash-log', ui.root).innerHTML = list.length
      ? list.map(function (e) {
          return '<li class="log log--' + e.level + '"><time class="log__t">' + C.timeStr(e.t) + '</time><span class="log__msg">' + esc(e.msg) + '</span></li>';
        }).join('')
      : '<li class="empty">Belum ada peristiwa. Mulai dari Peta Jaringan Virtual.</li>';
  }

  function renderPreviewBtn() {
    var b = C.$('#dash-preview-btn', ui.root);
    b.innerHTML = C.icon(ui.playing ? 'pause' : 'play') + '<span>' + (ui.playing ? 'Jeda pratinjau' : 'Putar pratinjau') + '</span>';
    b.setAttribute('aria-pressed', String(ui.playing));
  }

  function previewTick() {
    if (!ui || document.hidden) return;
    var m = C.store.mod('firewall');
    var spec = C.FirewallSim.randomPacket();
    ui.topo.send(spec, C.FirewallSim.evaluate(spec, m), { variant: spec.threat ? 'threat' : 'legit' });
  }

  function play() {
    if (ui.playing) return;
    ui.playing = true;
    previewTick();
    ui.timer = setInterval(previewTick, 1100);
    renderPreviewBtn();
  }
  function pause() {
    clearInterval(ui.timer);
    ui.playing = false;
    renderPreviewBtn();
  }

  function saveIdentity() {
    var nama = C.$('#id-nama', ui.root).value.trim();
    var kelas = C.$('#id-kelas', ui.root).value.trim();
    var absen = C.$('#id-absen', ui.root).value.trim();
    var err = C.$('#id-err', ui.root);
    if (!nama) { err.textContent = 'Nama lengkap wajib diisi.'; err.hidden = false; C.$('#id-nama', ui.root).focus(); return; }
    if (absen && !/^\d{1,3}$/.test(absen)) { err.textContent = 'No. absen diisi angka, misalnya 7.'; err.hidden = false; C.$('#id-absen', ui.root).focus(); return; }
    err.hidden = true;
    var s = C.store.state.student;
    s.nama = nama; s.kelas = kelas; s.absen = absen;
    C.log.add('dashboard', 'info', 'Identitas siswa disimpan: ' + nama + (kelas ? ', ' + kelas : '') + (absen ? ', absen ' + absen : '') + '.');
    C.$('#dash-greet', ui.root).innerHTML = greet(s);
    renderLog();
    C.ui.toast('Identitas disimpan.', { type: 'success' });
  }

  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    if (btn.getAttribute('data-action') === 'preview-toggle') { if (ui.playing) pause(); else play(); }
  }
  function onSubmit(e) {
    if (e.target.id === 'dash-id-form') { e.preventDefault(); saveIdentity(); }
  }

  function mount(root) {
    ui = { root: root, topo: null, timer: 0, playing: false };
    root.innerHTML = template();
    ui.topo = C.Topology.create(C.$('#dash-topo', root), { compact: true, speed: 260 });
    var m = C.store.mod('firewall');
    ui.topo.setFirewall(m.defaultPolicy, m.rules.filter(function (r) { return r.enabled; }).length);
    renderStats();
    renderModules();
    renderLog();
    root.addEventListener('click', onClick);
    root.addEventListener('submit', onSubmit);
    if (C.reducedMotion()) renderPreviewBtn(); else play();
  }

  function unmount() {
    if (!ui) return;
    clearInterval(ui.timer);
    if (ui.topo) ui.topo.destroy();
    ui = null;
  }

  C.router.register('dashboard', { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/peta-jaringan.js">
/* ==========================================================================
   Menu 2 — Peta Jaringan Virtual
   Aktivitas: (1) jelajahi 7 perangkat, (2) tempatkan 8 perangkat baru ke
   zona berdasarkan IP/CIDR, (3) jawab 5 pertanyaan jalur paket beranimasi.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var D = C.FirewallData;
  var P = C.PetaData;
  var esc = C.esc;
  var MOD = 'peta-jaringan';
  var NODES = D.nodes.map(function (n) { return n.id; });

  function fresh() {
    return {
      explored: [],
      zoneAnswers: {}, zoneChecked: false, zoneLast: 0, zoneBest: 0, zoneAttempts: 0,
      pathAnswers: {}, pathRevealed: {}, pathBest: 0, pathAttempts: 0
    };
  }
  function valid(m) { return m && Array.isArray(m.explored) && typeof m.zoneAnswers === 'object' && typeof m.pathAnswers === 'object'; }
  C.store.registerModule(MOD, fresh, valid);

  function pathCorrect(m) {
    return P.pathQuiz.filter(function (q) { return m.pathRevealed[q.id] && m.pathAnswers[q.id] === q.answer; }).length;
  }

  C.store.registerScore(MOD, function (m) {
    var exp = m.explored.filter(function (id) { return NODES.indexOf(id) >= 0; }).length;
    var earned = Math.round(exp / NODES.length * 20) + m.zoneBest * 5 + m.pathBest * 8;
    var ind = [
      { label: 'Menjelajahi ketujuh perangkat (' + exp + '/7).', met: exp === NODES.length },
      { label: 'Penempatan zona benar minimal 7 dari 8 (terbaik ' + m.zoneBest + '/8).', met: m.zoneBest >= 7 },
      { label: 'Pertanyaan jalur paket benar minimal 4 dari 5 (terbaik ' + m.pathBest + '/5).', met: m.pathBest >= 4 }
    ];
    return {
      earned: earned, max: 100, label: 'Peta Jaringan Virtual',
      done: ind.filter(function (x) { return x.met; }).length, total: ind.length,
      started: exp > 0 || m.zoneAttempts > 0 || m.pathAttempts > 0 || Object.keys(m.pathRevealed).length > 0,
      tuntas: ind.every(function (x) { return x.met; }), indicators: ind
    };
  });

  var ui = null;
  function mod() { return C.store.mod(MOD); }

  function template() {
    var meta = C.moduleMeta(MOD);
    return '<section class="page page--peta" aria-labelledby="page-title-' + MOD + '">' +
      C.page.head(meta, 'Kenali zona jaringan sekolah sintetis, tentukan zona perangkat dari alamat IP-nya, lalu telusuri jalur yang dilalui paket.', C.page.resetButton()) +
      '<div class="two-col">' +
        '<article class="card hud" aria-labelledby="peta-explore-h">' +
          '<header class="card-head"><div><h2 id="peta-explore-h">1. Jelajahi Perangkat</h2>' +
            '<p class="card-sub">Klik setiap perangkat pada diagram untuk membaca peran dan alamatnya.</p></div></header>' +
          '<div class="topo-scroll" tabindex="0" aria-label="Diagram topologi, dapat digeser ke samping"><div class="topo" id="peta-topo"></div></div>' +
          '<p class="topo-hint small muted">Geser diagram ke kiri atau kanan untuk melihat seluruh jaringan.</p>' +
          '<div class="node-info" id="peta-info" aria-live="polite"></div>' +
        '</article>' +
        '<div class="stack">' +
          '<article class="card" id="peta-progress" aria-label="Indikator keberhasilan"></article>' +
          '<article class="card" aria-labelledby="peta-zones-h">' +
            '<header class="card-head"><div><h2 id="peta-zones-h">Ringkasan Zona</h2></div></header>' +
            '<div class="table-scroll"><table class="tbl"><thead><tr><th scope="col">Zona</th><th scope="col">Alamat jaringan</th><th scope="col">Isi</th></tr></thead><tbody>' +
              '<tr><td>LAN Sekolah</td><td><code>192.168.10.0/24</code></td><td>Komputer pengguna</td></tr>' +
              '<tr><td>DMZ</td><td><code>172.16.20.0/24</code></td><td>Layanan untuk publik</td></tr>' +
              '<tr><td>Zona Data</td><td><code>172.16.30.0/24</code></td><td>Data penting</td></tr>' +
              '<tr><td>Internet</td><td><code>alamat lain</code></td><td>Di luar sekolah</td></tr>' +
            '</tbody></table></div>' +
            '<p class="small muted">Notasi <code>/24</code> berarti tiga angka pertama alamat harus sama dengan alamat jaringan. Contoh: 192.168.10.<b>1</b> sampai 192.168.10.<b>254</b> termasuk 192.168.10.0/24.</p>' +
          '</article>' +
        '</div>' +
      '</div>' +
      '<article class="card" id="peta-zone-card" aria-labelledby="peta-zq-h"></article>' +
      '<article class="card" id="peta-path-card" aria-labelledby="peta-pq-h"></article>' +
      C.page.cpCard(meta) +
    '</section>';
  }

  /* ---------- Eksplorasi ---------- */
  function renderInfo() {
    var m = mod();
    var el = C.$('#peta-info', ui.root);
    var checklist = '<ul class="chip-list" aria-label="Perangkat yang sudah dijelajahi">' + D.nodes.map(function (n) {
      var done = m.explored.indexOf(n.id) >= 0;
      return '<li class="chip-mini' + (done ? ' is-done' : '') + '">' + (done ? C.icon('check') : '') + esc(n.name) + '</li>';
    }).join('') + '</ul>';
    if (!ui.node) {
      el.innerHTML = '<p class="small muted">' + C.icon('info') + ' Pilih perangkat pada diagram. Dijelajahi: ' + m.explored.length + ' dari 7.</p>' + checklist;
      return;
    }
    var n = C.FirewallSim.node(ui.node);
    var z = D.zones[n.zone];
    el.innerHTML =
      '<div class="node-card">' +
        '<div class="node-card__head"><strong>' + esc(n.name) + '</strong><code>' + esc(n.ip) + '</code><span class="tag tag--muted">' + esc(z.label) + (z.cidr ? ' ' + esc(z.cidr) : '') + '</span></div>' +
        '<p class="small"><strong>Peran:</strong> ' + esc(n.role) + '.</p>' +
        '<p class="small">' + esc(P.explain[n.id]) + '</p>' +
        '<p class="small muted">Layanan: ' + (n.services.length ? esc(n.services.join(', ')) : 'tidak menyediakan layanan') + '</p>' +
      '</div>' + checklist;
  }

  function selectNode(id) {
    var m = mod();
    ui.node = id;
    ui.topo.focusNode(id);
    if (m.explored.indexOf(id) < 0) {
      m.explored.push(id);
      if (m.explored.length === NODES.length) {
        C.log.add(MOD, 'success', 'Ketujuh perangkat pada peta jaringan sudah dijelajahi.');
        C.ui.toast('Semua perangkat sudah dijelajahi.', { type: 'success' });
      }
      C.store.commit('explore');
      renderProgress();
    }
    renderInfo();
  }

  function renderProgress() {
    C.$('#peta-progress', ui.root).innerHTML = C.page.progressCard(MOD);
  }

  /* ---------- Kuis zona ---------- */
  function renderZone() {
    var m = mod();
    var checked = m.zoneChecked;
    var answered = P.zoneQuiz.filter(function (q) { return m.zoneAnswers[q.id]; }).length;
    var items = P.zoneQuiz.map(function (q) {
      var ans = m.zoneAnswers[q.id];
      var right = checked && ans === q.zone;
      var opts = P.zoneOptions.map(function (z) {
        return '<label class="seg__opt seg__opt--zone"><input type="radio" name="zq-' + q.id + '" value="' + z.id + '" data-zq="' + q.id + '"' +
          (ans === z.id ? ' checked' : '') + (checked ? ' disabled' : '') + '><span>' + esc(z.label) + '</span></label>';
      }).join('');
      return '<li class="zq' + (checked ? (right ? ' is-right' : ' is-wrong') : '') + '">' +
        '<div class="zq__head"><strong>' + esc(q.name) + '</strong><code>' + esc(q.ip) + '</code>' +
          (checked ? '<span class="zq__mark">' + C.icon(right ? 'check' : 'x') + '<span class="sr-only">' + (right ? 'benar' : 'salah') + '</span></span>' : '') + '</div>' +
        '<p class="small muted">' + esc(q.role) + '</p>' +
        '<fieldset class="zq__opts"><legend class="sr-only">Zona untuk ' + esc(q.name) + '</legend><div class="seg seg--wrap">' + opts + '</div></fieldset>' +
        (checked ? '<p class="small zq__why">' + (right ? '' : '<strong>Jawaban: ' + esc(zoneLabel(q.zone)) + '.</strong> ') + esc(q.why) + '</p>' : '') +
      '</li>';
    }).join('');

    C.$('#peta-zone-card', ui.root).innerHTML =
      '<header class="card-head"><div><h2 id="peta-zq-h">2. Tempatkan Perangkat ke Zona</h2>' +
        '<p class="card-sub">Sekolah menambah 8 perangkat baru. Tentukan zonanya dari alamat IP dan perannya.</p></div>' +
        '<span class="tag tag--muted num">' + (checked ? 'Benar ' + m.zoneLast + '/8' : 'Terjawab ' + answered + '/8') + '</span></header>' +
      '<ol class="zq-list">' + items + '</ol>' +
      '<p class="field-err" id="zq-err" hidden></p>' +
      '<div class="actions-row">' +
        (checked
          ? '<button type="button" class="btn btn--ghost" data-action="zone-retry">' + C.icon('reset') + '<span>Ulangi Penempatan</span></button>' +
            '<p class="small ' + (m.zoneLast >= 7 ? 'text-ok' : 'text-warn') + '">' + (m.zoneLast >= 7 ? 'Indikator tercapai.' : 'Belum mencapai 7 dari 8. Baca penjelasan lalu ulangi.') + ' Skor terbaik: ' + m.zoneBest + '/8.</p>'
          : '<button type="button" class="btn btn--accent" data-action="zone-check">' + C.icon('checklist') + '<span>Periksa Penempatan</span></button>') +
      '</div>';
  }

  function zoneLabel(id) {
    return P.zoneOptions.filter(function (z) { return z.id === id; })[0].label;
  }

  function checkZones() {
    var m = mod();
    var missing = P.zoneQuiz.filter(function (q) { return !m.zoneAnswers[q.id]; }).length;
    if (missing) {
      var err = C.$('#zq-err', ui.root);
      err.textContent = 'Masih ada ' + missing + ' perangkat yang belum diberi zona.';
      err.hidden = false;
      return;
    }
    var correct = P.zoneQuiz.filter(function (q) { return m.zoneAnswers[q.id] === q.zone; }).length;
    m.zoneChecked = true;
    m.zoneLast = correct;
    m.zoneAttempts++;
    m.zoneBest = Math.max(m.zoneBest, correct);
    C.log.add(MOD, correct >= 7 ? 'success' : 'warn', 'Penempatan zona: ' + correct + ' dari 8 benar (percobaan ke-' + m.zoneAttempts + ').');
    C.store.commit('zone');
    renderZone();
    renderProgress();
    C.$('#peta-zone-card', ui.root).scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  }

  /* ---------- Pertanyaan jalur ---------- */
  function renderPath() {
    var m = mod();
    var allRevealed = P.pathQuiz.every(function (q) { return m.pathRevealed[q.id]; });
    var correct = pathCorrect(m);
    var qs = P.pathQuiz.map(function (q, i) {
      var revealed = !!m.pathRevealed[q.id];
      return '<div class="q-block">' + C.page.choice(q, { picked: m.pathAnswers[q.id], reveal: revealed, no: i + 1, name: 'pq-' + q.id }) +
        (revealed
          ? '<button type="button" class="btn btn--sm btn--ghost" data-action="path-replay" data-q="' + q.id + '">' + C.icon('play') + '<span>Putar ulang jalur paket</span></button>'
          : '<button type="button" class="btn btn--sm btn--primary" data-action="path-answer" data-q="' + q.id + '">Jawab</button>') +
        '<p class="field-err" id="pq-err-' + q.id + '" hidden></p>' +
      '</div>';
    }).join('');
    C.$('#peta-path-card', ui.root).innerHTML =
      '<header class="card-head"><div><h2 id="peta-pq-h">3. Telusuri Jalur Paket</h2>' +
        '<p class="card-sub">Jawab satu per satu. Setelah menjawab, jalur paket diputar pada diagram di atas.</p></div>' +
        '<span class="tag tag--muted num">Benar ' + correct + '/5</span></header>' +
      '<div class="q-stack">' + qs + '</div>' +
      (allRevealed
        ? '<div class="actions-row"><button type="button" class="btn btn--ghost" data-action="path-retry">' + C.icon('reset') + '<span>Ulangi Pertanyaan Jalur</span></button>' +
          '<p class="small ' + (correct >= 4 ? 'text-ok' : 'text-warn') + '">' + (correct >= 4 ? 'Indikator tercapai.' : 'Belum mencapai 4 dari 5.') + ' Skor terbaik: ' + m.pathBest + '/5.</p></div>'
        : '');
  }

  function animatePath(q) {
    var spec = q.anim;
    ui.topo.select(spec.src, spec.dst);
    ui.topo.send(spec, { decision: 'ALLOW' }, { variant: 'manual', label: 'jalur' });
  }

  function answerPath(qid) {
    var m = mod();
    var q = P.pathQuiz.filter(function (x) { return x.id === qid; })[0];
    if (!m.pathAnswers[qid]) {
      var err = C.$('#pq-err-' + qid, ui.root);
      err.textContent = 'Pilih salah satu jawaban dulu.';
      err.hidden = false;
      return;
    }
    m.pathRevealed[qid] = true;
    var right = m.pathAnswers[qid] === q.answer;
    var allDone = P.pathQuiz.every(function (x) { return m.pathRevealed[x.id]; });
    if (allDone) {
      var correct = pathCorrect(m);
      m.pathAttempts++;
      m.pathBest = Math.max(m.pathBest, correct);
      C.log.add(MOD, correct >= 4 ? 'success' : 'warn', 'Pertanyaan jalur paket: ' + correct + ' dari 5 benar (percobaan ke-' + m.pathAttempts + ').');
    }
    C.store.commit('path');
    animatePath(q);
    renderPath();
    renderProgress();
    var block = C.$('[data-qid="' + qid + '"]', ui.root);
    if (block) block.scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'nearest' });
    C.ui.toast(right ? 'Benar. Perhatikan jalur paket pada diagram.' : 'Belum tepat. Baca penjelasannya dan perhatikan jalur pada diagram.', { type: right ? 'success' : 'warn', timeout: 3000 });
  }

  /* ---------- Event ---------- */
  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || !ui || !ui.root.contains(btn) || btn.disabled) return;
    var a = btn.getAttribute('data-action');
    var m = mod();
    switch (a) {
      case 'zone-check': checkZones(); break;
      case 'zone-retry':
        m.zoneAnswers = {}; m.zoneChecked = false; C.store.commit('zone'); renderZone();
        var first = C.$('[data-zq]', ui.root); if (first) first.focus();
        break;
      case 'path-answer': answerPath(btn.getAttribute('data-q')); break;
      case 'path-replay': animatePath(P.pathQuiz.filter(function (x) { return x.id === btn.getAttribute('data-q'); })[0]); break;
      case 'path-retry':
        m.pathAnswers = {}; m.pathRevealed = {}; C.store.commit('path'); renderPath(); renderProgress();
        break;
      case 'module-reset':
        C.page.confirmReset(MOD, 'Peta Jaringan Virtual', function () { if (ui) { ui.node = null; ui.topo.focusNode(null); renderAll(); } });
        break;
      default: break;
    }
  }

  function onChange(e) {
    var t = e.target;
    var m = mod();
    if (t.hasAttribute('data-zq')) {
      m.zoneAnswers[t.getAttribute('data-zq')] = t.value;
      C.store.commit('zone-answer');
      var err = C.$('#zq-err', ui.root); if (err) err.hidden = true;
      var tag = C.$('#peta-zone-card .card-head .tag', ui.root);
      if (tag) tag.textContent = 'Terjawab ' + P.zoneQuiz.filter(function (q) { return m.zoneAnswers[q.id]; }).length + '/8';
    } else if (t.name && t.name.indexOf('pq-') === 0) {
      var qid = t.getAttribute('data-q');
      if (m.pathRevealed[qid]) return;
      m.pathAnswers[qid] = t.value;
      C.store.commit('path-answer');
      C.$$('[data-qid="' + qid + '"] .opt', ui.root).forEach(function (l) { l.classList.toggle('is-picked', l.querySelector('input').checked); });
      var pe = C.$('#pq-err-' + qid, ui.root); if (pe) pe.hidden = true;
    }
  }

  function renderAll() { renderInfo(); renderProgress(); renderZone(); renderPath(); }

  function mount(root) {
    ui = { root: root, topo: null, node: null };
    root.innerHTML = template();
    ui.topo = C.Topology.create(C.$('#peta-topo', root), { onNodeClick: selectNode });
    var fm = C.store.mod('firewall');
    ui.topo.setFirewall(fm.defaultPolicy, fm.rules.filter(function (r) { return r.enabled; }).length);
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    renderAll();
  }
  function unmount() {
    if (!ui) return;
    if (ui.topo) ui.topo.destroy();
    ui = null;
  }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/phishing.js">
/* ==========================================================================
   Menu 3 — Simulasi Phishing
   Kotak masuk berisi 6 email sintetis. Untuk setiap email siswa menandai
   bagian mencurigakan, menentukan Phishing/Aman, memilih tindakan, lalu
   menerima penjelasan. Tidak ada email yang dikirim dan tidak ada tautan
   yang benar-benar bisa dibuka.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var PD = C.PhishingData;
  var esc = C.esc;
  var MOD = 'phishing';
  var PER_EMAIL = PD.points.verdict + PD.points.indicators + PD.points.action;
  var MAX_RAW = PER_EMAIL * PD.emails.length;

  function freshEmails() {
    var o = {};
    PD.emails.forEach(function (e) { o[e.id] = { marks: [], verdict: null, action: null, checked: false, res: null }; });
    return o;
  }
  function fresh() {
    return { emails: freshEmails(), current: PD.emails[0].id, best: 0, bestInd: { ratio: 0, verdicts: false, actions: false }, rounds: 0 };
  }
  function valid(m) { return m && m.emails && PD.emails.every(function (e) { return m.emails[e.id] && Array.isArray(m.emails[e.id].marks); }); }
  C.store.registerModule(MOD, fresh, valid);

  function emailById(id) { return PD.emails.filter(function (e) { return e.id === id; })[0]; }

  function roundStats(m) {
    var raw = 0, checked = 0, found = 0, totalInd = 0, phishChecked = 0, verdictOk = 0, actionOk = 0;
    PD.emails.forEach(function (e) {
      var st = m.emails[e.id];
      if (!st.checked || !st.res) return;
      checked++;
      raw += st.res.total;
      if (st.res.verdictOk) verdictOk++;
      if (st.res.actionOk) actionOk++;
      if (e.phish) { phishChecked++; found += st.res.found; totalInd += st.res.totalInd; }
    });
    var allPhish = PD.emails.filter(function (e) { return e.phish; }).length;
    return {
      earned: Math.round(raw / MAX_RAW * 100), checked: checked,
      ratio: phishChecked === allPhish && totalInd ? found / totalInd : 0,
      found: found, totalInd: totalInd,
      verdicts: checked === PD.emails.length && verdictOk === PD.emails.length,
      actions: checked === PD.emails.length && actionOk === PD.emails.length,
      verdictOk: verdictOk, actionOk: actionOk
    };
  }

  C.store.registerScore(MOD, function (m) {
    var r = roundStats(m);
    var ratio = Math.max(r.ratio, m.bestInd.ratio);
    var ind = [
      { label: 'Menemukan minimal 80% indikator pada email phishing (terbaik ' + Math.round(ratio * 100) + '%).', met: ratio >= 0.8 },
      { label: 'Keenam email diklasifikasikan dengan benar.', met: r.verdicts || m.bestInd.verdicts },
      { label: 'Tindakan aman dipilih pada setiap email.', met: r.actions || m.bestInd.actions }
    ];
    return {
      earned: Math.max(r.earned, m.best), max: 100, label: 'Simulasi Phishing',
      done: ind.filter(function (x) { return x.met; }).length, total: ind.length,
      started: r.checked > 0 || m.rounds > 0,
      tuntas: ind.every(function (x) { return x.met; }), indicators: ind
    };
  });

  var ui = null;
  function mod() { return C.store.mod(MOD); }

  /* ---------- Penilaian satu email ---------- */
  function grade(e, st) {
    var indIds = Object.keys(e.hotspots).filter(function (k) { return e.hotspots[k].ind; });
    var found = st.marks.filter(function (k) { return indIds.indexOf(k) >= 0; }).length;
    var falseM = st.marks.filter(function (k) { return indIds.indexOf(k) < 0; }).length;
    var indPts;
    if (e.phish) indPts = Math.max(0, found - 0.5 * falseM) / indIds.length * PD.points.indicators;
    else indPts = Math.max(0, PD.points.indicators - 2 * falseM);
    var verdictOk = st.verdict === (e.phish ? 'phish' : 'safe');
    var actionOk = st.action === e.answer;
    var total = (verdictOk ? PD.points.verdict : 0) + indPts + (actionOk ? PD.points.action : 0);
    return {
      verdictOk: verdictOk, actionOk: actionOk, found: found, totalInd: indIds.length, falseMarks: falseM,
      indPts: Math.round(indPts * 10) / 10, total: Math.round(total * 10) / 10
    };
  }

  /* ---------- Template ---------- */
  function template() {
    var meta = C.moduleMeta(MOD);
    return '<section class="page page--phish" aria-labelledby="page-title-' + MOD + '">' +
      C.page.head(meta, 'Periksa enam email sintetis di kotak masuk. Tandai bagian yang mencurigakan, tentukan apakah email itu phishing, lalu pilih tindakan yang aman.', C.page.resetButton()) +
      '<p class="note">' + C.icon('shield') + ' Semua email, nama, dan domain di sini fiktif (domain berakhiran .example). Tidak ada email yang dikirim dan tautan tidak bisa dibuka.</p>' +
      '<div class="mail-layout">' +
        '<div class="stack">' +
          '<article class="card mail-inbox" aria-labelledby="inbox-h">' +
            '<header class="card-head"><div><h2 id="inbox-h">Kotak Masuk</h2><p class="card-sub" id="inbox-sub"></p></div></header>' +
            '<ul class="inbox" id="inbox-list"></ul>' +
          '</article>' +
          '<article class="card" id="phish-progress" aria-label="Indikator keberhasilan"></article>' +
        '</div>' +
        '<article class="card hud mail-reader" id="mail-reader" aria-live="polite"></article>' +
      '</div>' +
      '<article class="card" aria-labelledby="phish-learn-h">' +
        '<details class="learn">' +
          '<summary><h2 id="phish-learn-h">Materi Singkat: Ciri Email Phishing</h2></summary>' +
          '<ol class="learn-list">' +
            '<li><strong>Pengirim:</strong> periksa domain setelah tanda @. Domain mirip (angka 0 untuk huruf o, tambahan kata) adalah tanda bahaya.</li>' +
            '<li><strong>Desakan dan ancaman:</strong> tenggat sangat singkat, denda, atau ancaman penghapusan akun.</li>' +
            '<li><strong>Tautan menyamar:</strong> arahkan kursor ke tautan (atau tekan lama di ponsel) untuk melihat alamat aslinya.</li>' +
            '<li><strong>Lampiran berbahaya:</strong> ekstensi ganda seperti .pdf.exe, atau dokumen yang meminta "Enable Content".</li>' +
            '<li><strong>Permintaan data rahasia:</strong> kata sandi, OTP, nomor rekening, atau nama ibu kandung.</li>' +
            '<li><strong>Sapaan umum atau hadiah tak terduga.</strong> Ingat: sapaan dengan nama tidak menjamin email aman.</li>' +
          '</ol>' +
        '</details>' +
      '</article>' +
      C.page.cpCard(meta) +
    '</section>';
  }

  function renderInbox() {
    var m = mod();
    var r = roundStats(m);
    C.$('#inbox-sub', ui.root).textContent = r.checked + ' dari ' + PD.emails.length + ' email sudah diperiksa.';
    C.$('#inbox-list', ui.root).innerHTML = PD.emails.map(function (e) {
      var st = m.emails[e.id];
      var status = st.checked
        ? '<span class="tag ' + (st.res.total >= PER_EMAIL * 0.75 ? 'tag--ready' : 'tag--muted') + ' num">' + fmt(st.res.total) + '/' + PER_EMAIL + '</span>'
        : '<span class="tag tag--muted">Belum diperiksa</span>';
      return '<li><button type="button" class="inbox__item' + (m.current === e.id ? ' is-active' : '') + (st.checked ? ' is-checked' : '') + '" data-action="open-mail" data-id="' + e.id + '"' + (m.current === e.id ? ' aria-current="true"' : '') + '>' +
        '<span class="inbox__top"><span class="inbox__from">' + esc(e.from.name) + '</span><span class="inbox__date">' + esc(e.date.split(' ').slice(1, 3).join(' ')) + '</span></span>' +
        '<span class="inbox__subj">' + esc(e.subject.t) + '</span>' +
        '<span class="inbox__prev">' + esc(e.preview) + '</span>' +
        '<span class="inbox__status">' + status + '</span>' +
      '</button></li>';
    }).join('');
  }

  function fmt(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }

  function hsClass(e, st, id) {
    var marked = st.marks.indexOf(id) >= 0;
    if (!st.checked) return 'hs' + (marked ? ' is-marked' : '');
    var ind = e.hotspots[id] && e.hotspots[id].ind;
    if (ind && marked) return 'hs hs--hit';
    if (ind && !marked) return 'hs hs--miss';
    if (!ind && marked) return 'hs hs--false';
    return 'hs hs--ok';
  }

  function hs(e, st, id, text, extra) {
    extra = extra || {};
    var label = esc(text);
    var attrs = ' data-hs="' + id + '"' + (extra.link ? ' data-link="' + esc(extra.link) + '"' : '') +
      ' aria-pressed="' + (st.marks.indexOf(id) >= 0) + '"' + (st.checked ? ' disabled' : '');
    var cls = hsClass(e, st, id) + (extra.kind === 'link' ? ' hs--link' : '') + (extra.kind === 'attach' ? ' hs--attach' : '');
    var icon = extra.kind === 'attach' ? C.icon('lockfile') : '';
    return '<button type="button" class="' + cls + '"' + attrs + '>' + icon + '<span>' + label + '</span></button>';
  }

  function renderReader() {
    var m = mod();
    var e = emailById(m.current);
    var st = m.emails[e.id];
    var body = e.body.map(function (para) {
      return '<p>' + para.map(function (seg) {
        if (typeof seg === 'string') return esc(seg);
        if (seg.br) return '<br>';
        return hs(e, st, seg.h, seg.t, { link: seg.link, kind: seg.kind });
      }).join('') + '</p>';
    }).join('');

    var q = {
      id: 'act-' + e.id, text: 'Apa tindakan yang paling tepat?',
      options: e.actions, answer: e.answer, explain: e.actionExplain
    };

    var feedback = '';
    if (st.checked) {
      var r = st.res;
      var items = Object.keys(e.hotspots).filter(function (k) {
        return e.hotspots[k].ind || st.marks.indexOf(k) >= 0;
      }).map(function (k) {
        var h = e.hotspots[k];
        var marked = st.marks.indexOf(k) >= 0;
        var state = h.ind ? (marked ? 'hit' : 'miss') : 'false';
        var lbl = { hit: 'Ditemukan', miss: 'Terlewat', false: 'Bukan tanda bahaya' }[state];
        return '<li class="fb fb--' + state + '"><span class="fb__tag">' + lbl + '</span><span><strong>' + esc(h.title) + '.</strong> ' + esc(h.explain) + '</span></li>';
      }).join('');
      feedback =
        '<section class="mail-fb" aria-label="Hasil pemeriksaan">' +
          '<p class="mail-fb__score"><span class="num">' + fmt(r.total) + '</span>/' + PER_EMAIL + ' poin</p>' +
          '<ul class="mail-fb__sum">' +
            '<li class="' + (r.verdictOk ? 'is-ok' : 'is-bad') + '">' + C.icon(r.verdictOk ? 'check' : 'x') + '<span>Email ini <strong>' + (e.phish ? 'PHISHING' : 'AMAN') + '</strong>. Jawabanmu: ' + (st.verdict === 'phish' ? 'Phishing' : 'Aman') + '.</span></li>' +
            (e.phish
              ? '<li class="' + (r.found === r.totalInd ? 'is-ok' : 'is-mid') + '">' + C.icon('checklist') + '<span>Indikator ditemukan ' + r.found + ' dari ' + r.totalInd + (r.falseMarks ? ', ' + r.falseMarks + ' tandai keliru' : '') + '.</span></li>'
              : '<li class="' + (r.falseMarks ? 'is-mid' : 'is-ok') + '">' + C.icon('checklist') + '<span>' + (r.falseMarks ? r.falseMarks + ' bagian wajar ditandai mencurigakan.' : 'Tidak ada bagian wajar yang ditandai keliru.') + '</span></li>') +
          '</ul>' +
          (items ? '<ul class="fb-list">' + items + '</ul>' : '') +
        '</section>';
    }

    var idx = PD.emails.indexOf(e);
    var next = PD.emails[(idx + 1) % PD.emails.length];
    var nextUnchecked = PD.emails.filter(function (x) { return !m.emails[x.id].checked; })[0];

    C.$('#mail-reader', ui.root).innerHTML =
      '<header class="card-head"><div><h2>' + esc(e.subject.t) + '</h2>' +
        '<p class="card-sub">Email ' + (idx + 1) + ' dari ' + PD.emails.length + (st.checked ? ', sudah diperiksa' : '') + '</p></div></header>' +
      (st.checked ? '' : '<p class="mail-hint">' + C.icon('info') + '<span><strong>Langkah 1.</strong> Klik bagian email yang mencurigakan (pengirim, subjek, kalimat, tautan, atau lampiran). Klik lagi untuk membatalkan.</span></p>') +
      '<div class="mail">' +
        '<dl class="mail__head">' +
          '<div><dt>Dari</dt><dd>' + hs(e, st, e.from.h, e.from.name + ' <' + e.from.addr + '>') + '</dd></div>' +
          '<div><dt>Kepada</dt><dd>' + hs(e, st, 'to', e.to) + '</dd></div>' +
          '<div><dt>Tanggal</dt><dd>' + esc(e.date) + '</dd></div>' +
          '<div><dt>Subjek</dt><dd>' + hs(e, st, e.subject.h, e.subject.t) + '</dd></div>' +
        '</dl>' +
        '<div class="mail__body">' + body + '</div>' +
        '<p class="mail__status" id="mail-status" aria-live="polite">Arahkan kursor atau fokus ke tautan untuk melihat alamat aslinya.</p>' +
      '</div>' +
      '<div class="mail-steps">' +
        '<fieldset class="field"><legend><strong>Langkah 2.</strong> Email ini...</legend>' +
          '<div class="seg seg--form">' +
            '<label class="seg__opt seg__opt--drop"><input type="radio" name="verdict" value="phish"' + (st.verdict === 'phish' ? ' checked' : '') + (st.checked ? ' disabled' : '') + '><span>PHISHING</span></label>' +
            '<label class="seg__opt seg__opt--allow"><input type="radio" name="verdict" value="safe"' + (st.verdict === 'safe' ? ' checked' : '') + (st.checked ? ' disabled' : '') + '><span>AMAN</span></label>' +
          '</div></fieldset>' +
        '<div class="mail-step3"><p class="small"><strong>Langkah 3.</strong> Pilih tindakan.</p>' +
          C.page.choice(q, { picked: st.action, reveal: st.checked, name: 'action-' + e.id }) + '</div>' +
        '<p class="field-err" id="mail-err" hidden></p>' +
        '<div class="actions-row">' +
          (st.checked
            ? (nextUnchecked
                ? '<button type="button" class="btn btn--primary" data-action="open-mail" data-id="' + nextUnchecked.id + '">Email berikutnya yang belum diperiksa' + C.icon('arrowRight') + '</button>'
                : '<button type="button" class="btn btn--ghost" data-action="open-mail" data-id="' + next.id + '">Lihat email berikutnya' + C.icon('arrowRight') + '</button>')
            : '<button type="button" class="btn btn--accent" data-action="check-mail">' + C.icon('checklist') + '<span>Periksa Email Ini</span></button>') +
        '</div>' +
      '</div>' +
      feedback;
  }

  function renderProgress() {
    var m = mod();
    var r = roundStats(m);
    var html = C.page.progressCard(MOD);
    if (r.checked === PD.emails.length) {
      html += '<div class="round-done"><p><strong>Semua email sudah diperiksa.</strong> Skor putaran ini ' + r.earned + '/100' +
        (m.rounds > 1 ? ', skor terbaik ' + Math.max(m.best, r.earned) + '/100' : '') + '.</p>' +
        '<button type="button" class="btn btn--ghost btn--sm" data-action="round-retry">' + C.icon('reset') + '<span>Ulangi Simulasi</span></button></div>';
    }
    C.$('#phish-progress', ui.root).innerHTML = html;
  }

  function checkMail() {
    var m = mod();
    var e = emailById(m.current);
    var st = m.emails[e.id];
    var err = C.$('#mail-err', ui.root);
    if (!st.verdict || !st.action) {
      err.textContent = !st.verdict ? 'Tentukan dulu apakah email ini phishing atau aman (Langkah 2).' : 'Pilih tindakan yang paling tepat (Langkah 3).';
      err.hidden = false;
      return;
    }
    st.res = grade(e, st);
    st.checked = true;
    C.log.add(MOD, st.res.verdictOk && st.res.actionOk ? 'success' : 'warn',
      'Email "' + e.subject.t + '" diperiksa: ' + fmt(st.res.total) + '/' + PER_EMAIL + ' poin (' + (e.phish ? 'phishing' : 'aman') + ').');
    var r = roundStats(m);
    if (r.checked === PD.emails.length) {
      m.rounds++;
      m.best = Math.max(m.best, r.earned);
      m.bestInd.ratio = Math.max(m.bestInd.ratio, r.ratio);
      m.bestInd.verdicts = m.bestInd.verdicts || r.verdicts;
      m.bestInd.actions = m.bestInd.actions || r.actions;
      C.log.add(MOD, 'success', 'Simulasi phishing putaran ke-' + m.rounds + ' selesai dengan skor ' + r.earned + '/100.');
      C.ui.toast('Semua email selesai diperiksa. Skor ' + r.earned + '/100.', { type: 'success' });
    }
    C.store.commit('mail-check');
    renderAll();
  }

  function openMail(id) {
    var m = mod();
    m.current = id;
    C.store.commit('mail-open');
    renderInbox();
    renderReader();
    var reader = C.$('#mail-reader', ui.root);
    if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) {
      reader.scrollIntoView({ behavior: C.reducedMotion() ? 'auto' : 'smooth', block: 'start' });
    }
    var h = C.$('#mail-reader h2', ui.root);
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }

  /* ---------- Event ---------- */
  function onClick(ev) {
    var t = ev.target.closest('[data-hs]');
    var m = mod();
    if (t && ui.root.contains(t) && !t.disabled) {
      var st = m.emails[m.current];
      var id = t.getAttribute('data-hs');
      var i = st.marks.indexOf(id);
      if (i >= 0) st.marks.splice(i, 1); else st.marks.push(id);
      t.classList.toggle('is-marked', i < 0);
      t.setAttribute('aria-pressed', String(i < 0));
      if (t.hasAttribute('data-link')) showLink(t);
      C.store.commit('mail-mark');
      return;
    }
    var btn = ev.target.closest('[data-action]');
    if (!btn || !ui.root.contains(btn) || btn.disabled) return;
    switch (btn.getAttribute('data-action')) {
      case 'open-mail': openMail(btn.getAttribute('data-id')); break;
      case 'check-mail': checkMail(); break;
      case 'round-retry':
        C.ui.confirm({ title: 'Ulangi simulasi phishing?', body: 'Semua tanda dan jawaban pada keenam email dihapus. Skor terbaik dan indikator yang sudah tercapai tetap tersimpan.', confirmLabel: 'Ulangi', tone: 'primary' })
          .then(function (ok) {
            if (!ok || !ui) return;
            m.emails = freshEmails(); m.current = PD.emails[0].id;
            C.log.add(MOD, 'info', 'Simulasi phishing diulang.');
            C.store.commit('round'); renderAll();
          });
        break;
      case 'module-reset': C.page.confirmReset(MOD, 'Simulasi Phishing', function () { if (ui) renderAll(); }); break;
      default: break;
    }
  }

  function onChange(ev) {
    var t = ev.target;
    var m = mod();
    var st = m.emails[m.current];
    if (st.checked) return;
    if (t.name === 'verdict') { st.verdict = t.value; }
    else if (t.name === 'action-' + m.current) {
      st.action = t.value;
      C.$$('#mail-reader .opt', ui.root).forEach(function (l) { l.classList.toggle('is-picked', l.querySelector('input').checked); });
    } else return;
    var err = C.$('#mail-err', ui.root); if (err) err.hidden = true;
    C.store.commit('mail-answer');
  }

  function showLink(el) {
    var s = C.$('#mail-status', ui.root);
    if (!s) return;
    s.innerHTML = 'Tautan mengarah ke: <code>' + esc(el.getAttribute('data-link')) + '</code>';
    s.classList.add('is-on');
  }
  function onOver(ev) {
    var t = ev.target.closest && ev.target.closest('[data-link]');
    if (t && ui.root.contains(t)) showLink(t);
  }
  function onOut(ev) {
    var t = ev.target.closest && ev.target.closest('[data-link]');
    if (!t) return;
    var s = C.$('#mail-status', ui.root);
    if (s) { s.textContent = 'Arahkan kursor atau fokus ke tautan untuk melihat alamat aslinya.'; s.classList.remove('is-on'); }
  }

  function renderAll() { renderInbox(); renderReader(); renderProgress(); }

  function mount(root) {
    ui = { root: root };
    root.innerHTML = template();
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    root.addEventListener('mouseover', onOver);
    root.addEventListener('focusin', onOver);
    root.addEventListener('mouseout', onOut);
    root.addEventListener('focusout', onOut);
    renderAll();
  }
  function unmount() { ui = null; }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/brute-force.js">
/* ==========================================================================
   Menu 4 — Simulasi Brute Force
   Visualisasi percobaan login sintetis terhadap akun "siswa01" di Portal
   Sekolah (simulasi). Tidak ada login sungguhan, tidak ada daftar kata
   sandi nyata (semua ditampilkan tersamar), dan siswa tidak diminta
   mengetik kata sandi apa pun. Hasil dihitung dengan model sederhana:
   - bot mencoba 20 kata sandi per detik dari daftar 10.000 kata sandi umum;
   - pembatasan: akun terkunci 15 menit setiap 5 kali gagal;
   - MFA: walau kata sandi benar, login butuh kode OTP dari ponsel pemilik.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var esc = C.esc;
  var MOD = 'brute-force';
  var RATE = 20;
  var LIST = 10000;
  var LOCK_AFTER = 5;
  var LOCK_MIN = 15;

  var STRENGTHS = [
    { id: 'lemah', label: 'Lemah', desc: 'Kata umum + angka. Ada di daftar kata sandi umum pada urutan ke-37.', pos: 37 },
    { id: 'sedang', label: 'Sedang', desc: '8 karakter, masih ada di daftar pada urutan ke-6.812.', pos: 6812 },
    { id: 'kuat', label: 'Kuat', desc: '14 karakter acak (huruf, angka, simbol). Tidak ada di daftar.', pos: null }
  ];
  var BASE = [
    { lock: false, mfa: false, label: 'Tanpa kontrol' },
    { lock: true, mfa: false, label: 'Pembatasan percobaan' },
    { lock: false, mfa: true, label: 'MFA' }
  ];

  var QUESTIONS = [
    {
      id: 'b1', text: 'Pada kondisi tanpa kontrol, mengapa kata sandi lemah tertebak dalam hitungan detik?',
      options: [
        { id: 'a', text: 'Karena server portal sedang rusak.' },
        { id: 'b', text: 'Karena kata sandi itu ada di urutan awal daftar kata sandi umum yang dicoba bot.' },
        { id: 'c', text: 'Karena penyerang mendapat kata sandi dari guru.' },
        { id: 'd', text: 'Karena MFA sedang aktif.' }
      ],
      answer: 'b',
      explain: 'Bot brute force mencoba daftar kata sandi yang paling sering dipakai. Kata sandi yang ada di urutan awal daftar itu tertebak paling cepat.'
    },
    {
      id: 'b2', text: 'Apa pengaruh utama pembatasan percobaan login (kunci 15 menit setiap 5 kali gagal)?',
      options: [
        { id: 'a', text: 'Serangan langsung berhenti selamanya.' },
        { id: 'b', text: 'Kata sandi otomatis berubah menjadi kuat.' },
        { id: 'c', text: 'Serangan jauh lebih lambat dan admin mendapat peringatan, tetapi kata sandi lemah tetap bisa tertebak jika dibiarkan.' },
        { id: 'd', text: 'Penyerang sama sekali tidak bisa mencoba login.' }
      ],
      answer: 'c',
      explain: 'Pembatasan memperlambat serangan dari detik menjadi jam atau hari dan memunculkan peringatan, sehingga admin punya waktu bertindak. Namun kata sandi lemah tetap berisiko.'
    },
    {
      id: 'b3', text: 'Kombinasi kontrol yang paling efektif untuk melindungi akun sekolah adalah...',
      options: [
        { id: 'a', text: 'Kata sandi kuat, pembatasan percobaan login, dan MFA.' },
        { id: 'b', text: 'Kata sandi pendek supaya mudah diingat.' },
        { id: 'c', text: 'Hanya MFA, kata sandi boleh lemah.' },
        { id: 'd', text: 'Mengganti kata sandi setiap hari tanpa kontrol lain.' }
      ],
      answer: 'a',
      explain: 'Setiap kontrol menutup celah yang berbeda: kata sandi kuat sulit ditebak, pembatasan memperlambat dan memberi peringatan, MFA mencegah login walau kata sandi bocor.'
    }
  ];

  function key(pw, lock, mfa) { return pw + '|' + (lock ? 1 : 0) + '|' + (mfa ? 1 : 0); }

  function fresh() { return { results: {}, answers: {}, revealed: false, qBest: 0, qAttempts: 0, pw: 'lemah', lock: false, mfa: false }; }
  function valid(m) { return m && typeof m.results === 'object' && typeof m.answers === 'object'; }
  C.store.registerModule(MOD, fresh, valid);

  function baseProgress(m) {
    var best = 0, bestPw = null;
    STRENGTHS.forEach(function (s) {
      var n = BASE.filter(function (b) { return m.results[key(s.id, b.lock, b.mfa)]; }).length;
      if (n > best) { best = n; bestPw = s.id; }
    });
    var strengths = STRENGTHS.filter(function (s) {
      return Object.keys(m.results).some(function (k) { return k.indexOf(s.id + '|') === 0; });
    }).length;
    return { best: best, bestPw: bestPw, strengths: strengths };
  }

  C.store.registerScore(MOD, function (m) {
    var p = baseProgress(m);
    var earned = p.best * 10 + (p.strengths >= 2 ? 10 : 0) + m.qBest * 20;
    var ind = [
      { label: 'Menjalankan tiga kondisi pada kekuatan kata sandi yang sama (' + p.best + '/3).', met: p.best === 3 },
      { label: 'Membandingkan minimal dua tingkat kekuatan kata sandi (' + p.strengths + '/2).', met: p.strengths >= 2 },
      { label: 'Menjawab benar ketiga pertanyaan simpulan (terbaik ' + m.qBest + '/3).', met: m.qBest === 3 }
    ];
    return {
      earned: earned, max: 100, label: 'Simulasi Brute Force',
      done: ind.filter(function (x) { return x.met; }).length, total: ind.length,
      started: Object.keys(m.results).length > 0,
      tuntas: ind.every(function (x) { return x.met; }), indicators: ind
    };
  });

  /* ---------- Model simulasi ---------- */
  function simulate(pwId, lock, mfa) {
    var s = STRENGTHS.filter(function (x) { return x.id === pwId; })[0];
    var found = s.pos !== null;
    var attempts = found ? s.pos : LIST;
    var fails = found ? attempts - 1 : attempts;
    var locks = lock ? Math.floor(fails / LOCK_AFTER) : 0;
    if (lock && found && fails % LOCK_AFTER === 0 && fails > 0) locks = fails / LOCK_AFTER;
    var seconds = attempts / RATE + locks * LOCK_MIN * 60;
    var outcome = !found ? 'exhausted' : mfa ? 'mfa' : 'breach';
    return { pw: pwId, lock: lock, mfa: mfa, attempts: attempts, locks: locks, seconds: seconds, outcome: outcome, at: Date.now() };
  }

  function duration(sec) {
    if (sec < 60) return (Math.round(sec * 10) / 10).toString().replace('.', ',') + ' detik';
    var min = Math.round(sec / 60);
    if (min < 60) return min + ' menit';
    var h = Math.floor(min / 60), mm = min % 60;
    if (h < 24) return h + ' jam' + (mm ? ' ' + mm + ' menit' : '');
    var d = Math.floor(h / 24), hh = h % 24;
    return d + ' hari' + (hh ? ' ' + hh + ' jam' : '');
  }

  function outcomeText(o) {
    return { breach: 'Akun dibobol', mfa: 'Gagal: butuh OTP', exhausted: 'Gagal: sandi tidak ada di daftar' }[o];
  }

  var ui = null;
  function mod() { return C.store.mod(MOD); }

  function template() {
    var meta = C.moduleMeta(MOD);
    return '<section class="page page--brute" aria-labelledby="page-title-' + MOD + '">' +
      C.page.head(meta, 'Amati bot yang mencoba menebak kata sandi akun sintetis siswa01. Bandingkan hasilnya tanpa kontrol, dengan pembatasan percobaan login, dan dengan MFA.', C.page.resetButton()) +
      '<p class="note">' + C.icon('shield') + ' Simulasi ini tidak melakukan login sungguhan. Kata sandi selalu ditampilkan tersamar, dan kamu tidak perlu mengetik kata sandi apa pun.</p>' +
      '<div class="two-col">' +
        '<article class="card hud" aria-labelledby="bf-setup-h">' +
          '<header class="card-head"><div><h2 id="bf-setup-h">Atur Skenario</h2><p class="card-sub">Pilih kekuatan kata sandi akun siswa01 dan kontrol keamanan portal.</p></div></header>' +
          '<fieldset class="field"><legend>Kekuatan kata sandi siswa01</legend><div class="pw-opts" id="bf-pw"></div></fieldset>' +
          '<fieldset class="field"><legend>Kontrol keamanan portal</legend>' +
            '<label class="check"><input type="checkbox" id="bf-lock"><span><strong>Pembatasan percobaan login</strong><small>Akun dikunci 15 menit setiap 5 kali gagal, dan admin menerima peringatan.</small></span></label>' +
            '<label class="check"><input type="checkbox" id="bf-mfa"><span><strong>MFA (kode OTP)</strong><small>Setelah kata sandi benar, login tetap butuh kode dari ponsel pemilik akun.</small></span></label>' +
          '</fieldset>' +
          '<div class="actions-row">' +
            '<button type="button" class="btn btn--accent" data-action="bf-run" id="bf-run">' + C.icon('play') + '<span>Jalankan Serangan Simulasi</span></button>' +
            '<button type="button" class="btn btn--ghost" data-action="bf-skip" id="bf-skip" hidden>Lewati Animasi</button>' +
          '</div>' +
        '</article>' +
        '<article class="card" id="bf-progress" aria-label="Indikator keberhasilan"></article>' +
      '</div>' +
      '<div class="bf-stage">' +
        '<article class="card bf-term-card" aria-labelledby="bf-term-h">' +
          '<header class="card-head"><div><h2 id="bf-term-h">Bot Penyerang</h2><p class="card-sub">Mencoba 20 kata sandi per detik dari daftar 10.000 kata sandi umum.</p></div></header>' +
          '<ol class="term" id="bf-term" aria-live="off"></ol>' +
          '<div class="bf-meter"><span class="small muted">Posisi dalam daftar</span><span class="bar" aria-hidden="true"><span id="bf-bar" style="width:0%"></span></span><span class="small num" id="bf-pos">0 / 10.000</span></div>' +
        '</article>' +
        '<article class="card bf-server" id="bf-server" aria-live="polite"></article>' +
      '</div>' +
      '<article class="card" aria-labelledby="bf-table-h">' +
        '<header class="card-head"><div><h2 id="bf-table-h">Tabel Perbandingan Hasil</h2><p class="card-sub">Terisi otomatis setiap kali serangan simulasi selesai.</p></div></header>' +
        '<div class="table-scroll"><table class="tbl" id="bf-table"></table></div>' +
      '</article>' +
      '<article class="card" id="bf-q" aria-labelledby="bf-q-h"></article>' +
      C.page.cpCard(meta) +
    '</section>';
  }

  function renderSetup() {
    var m = mod();
    C.$('#bf-pw', ui.root).innerHTML = STRENGTHS.map(function (s) {
      return '<label class="pw-opt pw-opt--' + s.id + '"><input type="radio" name="bf-pw" value="' + s.id + '"' + (m.pw === s.id ? ' checked' : '') + '>' +
        '<span><strong>' + s.label + '</strong><small>' + esc(s.desc) + '</small></span></label>';
    }).join('');
    C.$('#bf-lock', ui.root).checked = !!m.lock;
    C.$('#bf-mfa', ui.root).checked = !!m.mfa;
  }

  function renderServer(state) {
    var m = mod();
    state = state || { status: 'idle', fails: 0, locks: 0, clock: 0 };
    var map = {
      idle: ['Siap', 'muted', 'Belum ada serangan.'],
      run: ['Diserang', 'warn', 'Bot sedang mencoba kata sandi.'],
      locked: ['Terkunci', 'warn', 'Akun dikunci sementara. Peringatan dikirim ke admin.'],
      breach: ['Dibobol', 'bad', 'Kata sandi tertebak dan bot berhasil masuk.'],
      mfa: ['Bertahan', 'ok', 'Kata sandi tertebak, tetapi login ditolak karena bot tidak punya kode OTP.'],
      exhausted: ['Bertahan', 'ok', 'Seluruh daftar dicoba, kata sandi tidak ditemukan.']
    };
    var s = map[state.status];
    C.$('#bf-server', ui.root).innerHTML =
      '<header class="card-head"><div><h2>Server Login Portal</h2><p class="card-sub">Akun sintetis <code>siswa01</code></p></div>' +
        '<span class="level level--' + (s[1] === 'bad' ? 'high' : s[1] === 'warn' ? 'mid' : 'low') + '">' + s[0].toUpperCase() + '</span></header>' +
      '<p class="bf-status bf-status--' + s[1] + '">' + esc(s[2]) + '</p>' +
      '<dl class="counters counters--2">' +
        '<div class="counter"><dt>Waktu simulasi</dt><dd class="num">' + duration(state.clock) + '</dd></div>' +
        '<div class="counter"><dt>Percobaan gagal</dt><dd class="num">' + state.fails.toLocaleString('id-ID') + '</dd></div>' +
        '<div class="counter' + (state.locks ? ' counter--alert' : '') + '"><dt>Penguncian akun / peringatan admin</dt><dd class="num">' + state.locks.toLocaleString('id-ID') + '</dd></div>' +
        '<div class="counter"><dt>Kontrol aktif</dt><dd class="bf-ctrl">' + (m.lock ? 'Pembatasan' : '') + (m.lock && m.mfa ? ' + ' : '') + (m.mfa ? 'MFA' : '') + (!m.lock && !m.mfa ? 'Tidak ada' : '') + '</dd></div>' +
      '</dl>';
  }

  function renderTable() {
    var m = mod();
    var rows = [];
    STRENGTHS.forEach(function (s) {
      [[false, false], [true, false], [false, true], [true, true]].forEach(function (c) {
        var r = m.results[key(s.id, c[0], c[1])];
        if (r) rows.push(r);
      });
    });
    C.$('#bf-table', ui.root).innerHTML =
      '<thead><tr><th scope="col">Kata sandi</th><th scope="col">Pembatasan</th><th scope="col">MFA</th><th scope="col">Percobaan</th><th scope="col">Waktu simulasi</th><th scope="col">Hasil</th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (r) {
        var s = STRENGTHS.filter(function (x) { return x.id === r.pw; })[0];
        return '<tr><td>' + s.label + '</td><td>' + (r.lock ? 'Ya' : 'Tidak') + '</td><td>' + (r.mfa ? 'Ya' : 'Tidak') + '</td>' +
          '<td class="num">' + r.attempts.toLocaleString('id-ID') + '</td><td class="num">' + duration(r.seconds) + '</td>' +
          '<td><span class="tag ' + (r.outcome === 'breach' ? 'tag--drop' : 'tag--allow') + '">' + outcomeText(r.outcome) + '</span></td></tr>';
      }).join('') : '<tr><td colspan="6" class="muted">Belum ada hasil. Jalankan serangan simulasi pertama.</td></tr>') +
      '</tbody>';
  }

  function renderProgress() {
    C.$('#bf-progress', ui.root).innerHTML = C.page.progressCard(MOD);
  }

  function renderQuestions() {
    var m = mod();
    var p = baseProgress(m);
    var el = C.$('#bf-q', ui.root);
    var head = '<header class="card-head"><div><h2 id="bf-q-h">Pertanyaan Simpulan</h2>' +
      '<p class="card-sub">Jawab berdasarkan tabel perbandingan.</p></div>' +
      (m.revealed ? '<span class="tag tag--muted num">Benar ' + correctCount(m) + '/3</span>' : '') + '</header>';
    if (p.best < 3) {
      el.innerHTML = head + '<p class="locked-note">' + C.icon('lock') + '<span>Terbuka setelah kamu menjalankan tiga kondisi (tanpa kontrol, pembatasan percobaan, dan MFA) pada kekuatan kata sandi yang sama. Progres: ' + p.best + '/3.</span></p>';
      return;
    }
    el.innerHTML = head +
      '<div class="q-stack">' + QUESTIONS.map(function (q, i) {
        return C.page.choice(q, { picked: m.answers[q.id], reveal: m.revealed, no: i + 1, name: 'bq-' + q.id });
      }).join('') + '</div>' +
      '<p class="field-err" id="bq-err" hidden></p>' +
      '<div class="actions-row">' + (m.revealed
        ? '<button type="button" class="btn btn--ghost" data-action="bq-retry">' + C.icon('reset') + '<span>Ulangi Pertanyaan</span></button><p class="small muted">Skor terbaik: ' + m.qBest + '/3.</p>'
        : '<button type="button" class="btn btn--accent" data-action="bq-check">' + C.icon('checklist') + '<span>Periksa Jawaban</span></button>') + '</div>';
  }

  function correctCount(m) { return QUESTIONS.filter(function (q) { return m.answers[q.id] === q.answer; }).length; }

  /* ---------- Animasi serangan ---------- */
  function lineHtml(cls, text) { return '<li class="term__line term__line--' + cls + '">' + text + '</li>'; }

  function run() {
    if (ui.anim) return;
    var m = mod();
    var res = simulate(m.pw, m.lock, m.mfa);
    var term = C.$('#bf-term', ui.root);
    term.innerHTML = lineHtml('info', 'Target: portal.smk-nusantara.example (simulasi), akun siswa01. Kontrol: ' +
      (m.lock ? 'pembatasan percobaan' : '') + (m.lock && m.mfa ? ' + ' : '') + (m.mfa ? 'MFA' : '') + (!m.lock && !m.mfa ? 'tidak ada' : '') + '.');
    var shown = Math.min(res.attempts, 40);
    var st = { status: 'run', fails: 0, locks: 0, clock: 0 };
    var i = 0;
    C.$('#bf-run', ui.root).disabled = true;
    C.$('#bf-skip', ui.root).hidden = false;
    var step = C.reducedMotion() ? 0 : 55;

    function finish() {
      clearInterval(ui.anim);
      ui.anim = 0;
      var found = res.outcome !== 'exhausted';
      if (res.attempts > shown) {
        term.insertAdjacentHTML('beforeend', lineHtml('info', '… simulasi dipercepat: ' + (res.attempts - shown).toLocaleString('id-ID') + ' percobaan berikutnya …'));
      }
      if (found) {
        term.insertAdjacentHTML('beforeend', lineHtml('hit', 'Percobaan #' + res.attempts.toLocaleString('id-ID') + '  user=siswa01  sandi=••••••••  → KATA SANDI COCOK'));
        if (res.mfa) term.insertAdjacentHTML('beforeend', lineHtml('ok', 'Server meminta kode OTP 6 digit. Bot tidak memiliki ponsel pemilik akun → LOGIN DITOLAK'));
        else term.insertAdjacentHTML('beforeend', lineHtml('bad', 'Login berhasil. Akun siswa01 dikuasai penyerang.'));
      } else {
        term.insertAdjacentHTML('beforeend', lineHtml('ok', 'Seluruh 10.000 kata sandi di daftar sudah dicoba → TIDAK DITEMUKAN. Menebak semua kombinasi 14 karakter butuh waktu jauh lebih dari umur manusia.'));
      }
      term.scrollTop = term.scrollHeight;
      st = { status: res.outcome, fails: found ? res.attempts - 1 : res.attempts, locks: res.locks, clock: res.seconds };
      renderServer(st);
      setBar(res.attempts);
      C.$('#bf-run', ui.root).disabled = false;
      C.$('#bf-skip', ui.root).hidden = true;

      var mm = mod();
      mm.results[key(res.pw, res.lock, res.mfa)] = res;
      var s = STRENGTHS.filter(function (x) { return x.id === res.pw; })[0];
      C.log.add(MOD, res.outcome === 'breach' ? 'warn' : 'success',
        'Brute force (sandi ' + s.label.toLowerCase() + ', pembatasan ' + (res.lock ? 'aktif' : 'mati') + ', MFA ' + (res.mfa ? 'aktif' : 'mati') + '): ' +
        outcomeText(res.outcome).toLowerCase() + ' setelah ' + res.attempts.toLocaleString('id-ID') + ' percobaan, ' + duration(res.seconds) + '.');
      C.store.commit('bf-run');
      renderTable();
      renderProgress();
      renderQuestions();
    }
    ui.finish = finish;

    function tick() {
      if (!ui) return;
      i++;
      if (i > shown) { finish(); return; }
      var isHit = i === res.attempts && res.outcome !== 'exhausted';
      if (isHit) { finish(); return; }
      st.fails++;
      st.clock = i / RATE + st.locks * LOCK_MIN * 60;
      term.insertAdjacentHTML('beforeend', lineHtml('fail', 'Percobaan #' + i + '  user=siswa01  sandi=••••••••  → GAGAL'));
      if (m.lock && st.fails % LOCK_AFTER === 0) {
        st.locks++;
        st.clock += LOCK_MIN * 60;
        term.insertAdjacentHTML('beforeend', lineHtml('lock', 'Akun terkunci 15 menit. Peringatan dikirim ke admin. Bot menunggu…'));
        st.status = 'locked';
      } else st.status = 'run';
      term.scrollTop = term.scrollHeight;
      setBar(i);
      renderServer(st);
    }
    renderServer(st);
    if (step === 0) { finish(); return; }
    ui.anim = setInterval(tick, step);
  }

  function setBar(n) {
    C.$('#bf-bar', ui.root).style.width = Math.min(100, n / LIST * 100) + '%';
    C.$('#bf-pos', ui.root).textContent = n.toLocaleString('id-ID') + ' / 10.000';
  }

  /* ---------- Event ---------- */
  function onClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || !ui || !ui.root.contains(btn) || btn.disabled) return;
    var m = mod();
    switch (btn.getAttribute('data-action')) {
      case 'bf-run': run(); break;
      case 'bf-skip': if (ui.anim && ui.finish) ui.finish(); break;
      case 'bq-check': {
        var missing = QUESTIONS.filter(function (q) { return !m.answers[q.id]; }).length;
        if (missing) { var er = C.$('#bq-err', ui.root); er.textContent = 'Masih ada ' + missing + ' pertanyaan yang belum dijawab.'; er.hidden = false; return; }
        m.revealed = true;
        m.qAttempts++;
        var c = correctCount(m);
        m.qBest = Math.max(m.qBest, c);
        C.log.add(MOD, c === 3 ? 'success' : 'warn', 'Pertanyaan simpulan brute force: ' + c + ' dari 3 benar.');
        C.store.commit('bq');
        renderQuestions(); renderProgress();
        break;
      }
      case 'bq-retry': m.answers = {}; m.revealed = false; C.store.commit('bq'); renderQuestions(); break;
      case 'module-reset':
        C.page.confirmReset(MOD, 'Simulasi Brute Force', function () {
          if (!ui) return;
          if (ui.anim) { clearInterval(ui.anim); ui.anim = 0; }
          C.$('#bf-term', ui.root).innerHTML = '';
          C.$('#bf-run', ui.root).disabled = false; C.$('#bf-skip', ui.root).hidden = true;
          setBar(0); renderAll();
        });
        break;
      default: break;
    }
  }

  function onChange(e) {
    var t = e.target;
    var m = mod();
    if (t.name === 'bf-pw') m.pw = t.value;
    else if (t.id === 'bf-lock') m.lock = t.checked;
    else if (t.id === 'bf-mfa') m.mfa = t.checked;
    else if (t.name && t.name.indexOf('bq-') === 0) {
      if (m.revealed) return;
      m.answers[t.getAttribute('data-q')] = t.value;
      C.$$('#bf-q [data-qid="' + t.getAttribute('data-q') + '"] .opt', ui.root).forEach(function (l) { l.classList.toggle('is-picked', l.querySelector('input').checked); });
      var er = C.$('#bq-err', ui.root); if (er) er.hidden = true;
    } else return;
    C.store.commit('bf-setup');
    if (!ui.anim && (t.id === 'bf-lock' || t.id === 'bf-mfa')) renderServer();
  }

  function renderAll() { renderSetup(); renderServer(); renderTable(); renderProgress(); renderQuestions(); }

  function mount(root) {
    ui = { root: root, anim: 0, finish: null };
    root.innerHTML = template();
    root.addEventListener('click', onClick);
    root.addEventListener('change', onChange);
    renderAll();
    C.$('#bf-term', root).innerHTML = lineHtml('info', 'Pilih skenario lalu tekan Jalankan Serangan Simulasi.');
  }
  function unmount() {
    if (!ui) return;
    if (ui.anim) clearInterval(ui.anim);
    ui = null;
  }

  C.router.register(MOD, { mount: mount, unmount: unmount });
})();

</script>
  <script data-file="js/modules/firewall.js">
/* ==========================================================================
   Menu 5 — Simulasi Firewall
   Siswa mengubah aturan FW-01, mengirim paket uji, menjalankan lalu lintas
   otomatis, dan menyelesaikan 5 misi yang diuji otomatis.
   Semua paket adalah data sintetis yang dievaluasi di browser.
   ========================================================================== */
(function () {
  'use strict';
  var C = window.CSVL;
  var E = C.FirewallEngine;
  var D = C.FirewallData;
  var S = C.FirewallSim;
  var esc = C.esc;
  var MOD = 'firewall';
  var SPEEDS = { lambat: 1500, normal: 850, cepat: 420 };

  /* ---------------- State modul ---------------- */
  function freshRules() {
    return D.initialRules.map(function (r, i) {
      return Object.assign({ id: i + 1, enabled: true, hits: 0 }, r);
    });
  }
  function freshCounters() {
    return { total: 0, allowed: 0, blocked: 0, threatBlocked: 0, threatPassed: 0, legitBlocked: 0 };
  }
  function fresh() {
    return {
      defaultPolicy: D.initialPolicy,
      rules: freshRules(),
      nextId: D.initialRules.length + 1,
      missions: D.missions.map(function () {
        return { passed: false, hintUsed: false, attempts: 0, points: 0, passedAt: null };
      }),
      viewMission: 0,
      counters: freshCounters(),
      packetsSent: 0
    };
  }
  function valid(m) {
    return m && Array.isArray(m.rules) && Array.isArray(m.missions) &&
      m.missions.length === D.missions.length &&
      (m.defaultPolicy === 'ALLOW' || m.defaultPolicy === 'DROP') &&
      m.rules.every(function (r) { return r && typeof r.id === 'number' && E.validateRule(r).ok; });
  }
  C.store.registerModule(MOD, fresh, valid);
  C.store.registerScore(MOD, function (m) {
    var done = m.missions.filter(function (x) { return x.passed; }).length;
    var meta = C.moduleMeta(MOD);
    return {
      earned: m.missions.reduce(function (s, x) { return s + (x.points || 0); }, 0),
      max: D.missions.length * D.pointsFull,
      done: done, total: D.missions.length, label: 'Simulasi Firewall',
      started: done > 0 || m.missions.some(function (x) { return x.attempts > 0; }),
      tuntas: done === D.missions.length,
      indicators: m.missions.map(function (x, i) { return { label: meta.indicators[i], met: x.passed }; })
    };
  });

  function mod() { return C.store.mod(MOD); }
  function isUnlocked(m, i) { return i === 0 || m.missions[i - 1].passed; }
  function highestUnlocked(m) {
    var i = 0;
    while (i < D.missions.length - 1 && m.missions[i].passed) i++;
    return i;
  }

  /* API untuk Dashboard dan topbar */
  C.Firewall = {
    status: function () { return S.status(mod()); },
    progress: function () {
      var m = mod();
      var done = m.missions.filter(function (x) { return x.passed; }).length;
      var next = -1;
      for (var i = 0; i < m.missions.length; i++) { if (!m.missions[i].passed) { next = i; break; } }
      return { done: done, total: D.missions.length, next: next, nextTitle: next >= 0 ? D.missions[next].title : null };
    },
    policy: function () { return mod().defaultPolicy; },
    activeRules: function () { return mod().rules.filter(function (r) { return r.enabled; }).length; }
  };

  var ui = null;

  /* ---------------- Template halaman ---------------- */
  function nodeOptions(selected) {
    return D.nodes.map(function (n) {

  function template() {

    var addr = D.addressBook.map(function (a) {

        '</div>' +
      '</header>' +

      '<div class="fw-status" id="fw-status"></div>' +

      '<div class="fw-layout">' +
        '<div class="fw-col fw-col--a">' +
          '<article class="card hud fw-topo-card" id="fw-topo-card" aria-labelledby="fw-topo-h">' +
            '<header class="card-head"><div><h2 id="fw-topo-h">Topologi Jaringan</h2>' +

              '<li><span class="lg lg--threat"></span>Serangan sintetis</li>' +

          '<article class="card fw-rules-card" id="fw-rules-card" aria-labelledby="fw-rules-h">' +

              '<div><h2 id="fw-rules-h">Aturan Firewall</h2>' +

              '<summary>Daftar alamat jaringan sintetis</summary>' +
              '<div class="table-scroll"><table class="tbl"><thead><tr><th scope="col">Alamat</th><th scope="col">Perangkat atau jaringan</th></tr></thead><tbody>' + addrRows + '</tbody></table></div>' +
              '<p class="small muted">Tulis <code>ANY</code> untuk semua alamat. <code>/32</code> berarti satu host, <code>/24</code> berarti 256 alamat dalam satu jaringan.</p>' +
            '</details>' +
          '</article>' +

          '<article class="card fw-log-card" id="fw-log-card" aria-labelledby="fw-log-h">' +
            '<header class="card-head">' +
              '<div><h2 id="fw-log-h">Log Peristiwa Firewall</h2>' +
              '<p class="card-sub">Paket uji, ancaman yang diblokir atau lolos, layanan sah yang terganggu, dan perubahan aturan.</p></div>' +
              '<div class="card-tools">' +
                '<label class="sr-only" for="fw-log-filter">Filter log</label>' +
                '<select id="fw-log-filter" class="input input--sm">' +
                  '<option value="all">Semua</option><option value="block">Diblokir</option><option value="allow">Diizinkan</option>' +
                  '<option value="warn">Peringatan</option><option value="success">Berhasil</option><option value="info">Info</option>' +
                '</select>' +
                '<button type="button" class="btn btn--ghost btn--sm" data-action="log-copy">' + C.icon('copy') + '<span>Salin</span></button>' +

              '</div>' +

            '<ol class="log-list" id="fw-log-list" aria-live="off"></ol>' +

        '</div>' +

        '<div class="fw-col fw-col--b">' +

                '<div class="field"><label for="ps-src">Sumber</label><select id="ps-src" class="input">' + nodeOptions('pengunjung') + '</select></div>' +

  /* ---------------- Render: status ---------------- */

      return '<span class="svc-bar ' + (s.up ? 'is-up' : 'is-down') + '" title="' + esc(s.label + (s.up ? ': berjalan' : ': terblokir')) + '"></span>';
    }).join('');
    var expList = st.exposures.length
      ? st.exposures.map(function (p) { return '<li class="exp-item">' + C.icon('alert') + '<span>' + esc(p.label) + ' <code>' + esc(S.describe(p)) + '</code></span></li>'; }).join('')
      : '<li class="exp-item exp-item--ok">' + C.icon('check') + '<span>Tidak ada celah dari daftar pemeriksaan.</span></li>';
    var svcList = st.services.map(function (s) {
      return '<li class="exp-item ' + (s.up ? 'exp-item--ok' : '') + '">' + C.icon(s.up ? 'check' : 'x') + '<span>' + esc(s.label) + ' <code>' + esc(S.describe(s.spec)) + '</code></span></li>';
    }).join('');

    var el = C.$('#fw-status', ui.root);
    el.innerHTML =
      '<div class="fw-stat fw-stat--device"><span class="live-dot" aria-hidden="true"></span>' +
        '<div><span class="fw-stat__k">Perangkat</span><span class="fw-stat__v">FW-01 aktif</span></div></div>' +
      '<div class="fw-stat"><span class="fw-stat__k" id="pol-label">Kebijakan default</span>' +
        '<div class="seg" role="group" aria-labelledby="pol-label">' +
          '<button type="button" class="seg__btn seg__btn--allow' + (m.defaultPolicy === 'ALLOW' ? ' is-on' : '') + '" data-action="policy" data-value="ALLOW" aria-pressed="' + (m.defaultPolicy === 'ALLOW') + '">IZINKAN</button>' +
          '<button type="button" class="seg__btn seg__btn--drop' + (m.defaultPolicy === 'DROP' ? ' is-on' : '') + '" data-action="policy" data-value="DROP" aria-pressed="' + (m.defaultPolicy === 'DROP') + '">BLOKIR</button>' +
        '</div></div>' +
      '<div class="fw-stat"><span class="fw-stat__k">Aturan aktif</span><span class="fw-stat__v num">' + active + ' <small>dari ' + m.rules.length + '</small></span></div>' +
      '<div class="fw-stat"><span class="fw-stat__k">Tingkat ancaman</span>' +
        '<span class="fw-stat__v"><span class="level level--' + st.levelKey + '">' + st.level + '</span> <small>' + st.exposures.length + ' celah terbuka</small></span></div>' +
      '<div class="fw-stat"><span class="fw-stat__k">Layanan sah</span>' +
        '<span class="fw-stat__v num">' + st.servicesUp + '/' + st.services.length + ' <small>berjalan</small></span><span class="svc-bars" aria-hidden="true">' + svcBars + '</span></div>' +
      '<details class="fw-stat-details" id="fw-stat-details"' + (ui.detailsOpen ? ' open' : '') + '>' +
        '<summary>Lihat celah keamanan dan status layanan</summary>' +
        '<div class="exp-grid">' +
          '<div><h3 class="h-sub">Celah keamanan terbuka</h3><ul class="exp-list">' + expList + '</ul></div>' +
          '<div><h3 class="h-sub">Layanan sah yang harus tetap berjalan</h3><ul class="exp-list">' + svcList + '</ul></div>' +
        '</div>' +
      '</details>';
    var det = C.$('#fw-stat-details', el);
    det.addEventListener('toggle', function () { if (ui) ui.detailsOpen = det.open; });
  }

  /* ---------------- Render: misi ---------------- */
  function scoreOf(m) {
    return m.missions.reduce(function (s, x) { return s + (x.points || 0); }, 0);
  }

  function renderMission() {
    var m = mod();
    var i = m.viewMission;
    var ms = m.missions[i];
    var md = D.missions[i];
    var allDone = m.missions.every(function (x) { return x.passed; });
    var run = ui.runs[i];
    var totalTests = 0;
    for (var k = 0; k <= i; k++) totalTests += D.missions[k].tests.length;
    var ownTests = md.tests.length;

    var steps = D.missions.map(function (x, idx) {
      var st = m.missions[idx];
      var locked = !isUnlocked(m, idx);
      var cls = 'mstep' + (st.passed ? ' is-done' : '') + (idx === i ? ' is-active' : '') + (locked ? ' is-locked' : '');
      var stateTxt = st.passed ? 'selesai' : locked ? 'terkunci' : 'terbuka';
      return '<li><button type="button" class="' + cls + '" data-action="mission-view" data-index="' + idx + '"' +
        (locked ? ' disabled' : '') + (idx === i ? ' aria-current="step"' : '') +
        ' aria-label="Misi ' + (idx + 1) + ': ' + esc(x.title) + ', ' + stateTxt + '">' +
        (st.passed ? C.icon('check') : locked ? C.icon('lock') : '<span>' + (idx + 1) + '</span>') +
        '</button></li>';
    }).join('');

    var hintVisible = ms.hintUsed || ui.hintOpen[i];
    var hintBtn = '';
    if (!ms.hintUsed && !ms.passed) {
      hintBtn = '<button type="button" class="btn btn--ghost" data-action="mission-hint">' + C.icon('info') + '<span>Buka Petunjuk (−5 poin)</span></button>';
    } else if (!ms.hintUsed && ms.passed) {
      hintBtn = '<button type="button" class="btn btn--ghost" data-action="mission-hint" aria-expanded="' + !!ui.hintOpen[i] + '">' + C.icon('info') + '<span>' + (ui.hintOpen[i] ? 'Sembunyikan Petunjuk' : 'Lihat Petunjuk') + '</span></button>';
    }

    var resultHtml = '';
    if (run) {
      var sorted = run.results.slice().sort(function (a, b) { return (a.pass === b.pass) ? 0 : a.pass ? 1 : -1; });
      resultHtml =
        '<div class="run ' + (run.passed ? 'run--pass' : 'run--fail') + '" role="status">' +
          '<p class="run__head">' + (run.passed
            ? C.icon('check') + '<span>Semua ' + run.total + ' uji lolos.</span>'
            : C.icon('alert') + '<span>' + run.failed + ' dari ' + run.total + ' uji belum lolos. Perbaiki aturan lalu uji lagi.</span>') + '</p>' +
          '<ul class="test-list">' + sorted.map(function (r) {
            var by = r.result.sameZone ? 'tanpa firewall' : r.result.byDefault ? 'kebijakan default' : 'aturan #' + r.result.matchedNo;
            return '<li class="test ' + (r.pass ? 'is-pass' : 'is-fail') + '">' +
              '<span class="test__ico">' + C.icon(r.pass ? 'check' : 'x') + '</span>' +
              '<span class="test__body"><span class="test__label">' + esc(r.test.label) +
                (r.regression ? ' <span class="tag tag--muted">Regresi Misi ' + (r.mission + 1) + '</span>' : '') + '</span>' +
              '<span class="test__detail"><code>' + esc(S.describe(r.test)) + '</code> · harus ' +
                E.DECISION_LABEL[r.test.expect] + ', hasil ' + E.DECISION_LABEL[r.actual] + ' (' + by + ')</span></span>' +
